<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TV">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icona-180.png">
<link rel="icon" href="icona-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>TV</title>
<!--
  TV — senza server.

  Parla diretto a TMDB e al cloud SmartThings: niente Mac, niente
  funzione serverless, funziona anche da 4G. Possibile perche'
  entrambe le API mandano access-control-allow-origin: * e
  SmartThings accetta l'header Authorization (verificato 22/09/2026).

  I SEGRETI NON SONO IN QUESTO FILE. Li inserisci tu una volta e
  restano in localStorage, sul telefono. Per questo il file puo'
  stare in un repo pubblico senza problemi.

  Il filtro "solo cio' che pago" nella navigazione per generi lo fa
  TMDB, non noi: /discover accetta with_watch_providers +
  watch_region, quindi quello che non hai non arriva nemmeno.
-->
<style>
  :root {
    --fondo:      #0B1014;
    --fondo-alto: #101922;
    --piano:      #16222D;
    --piano-alto: #1E2D3A;
    --bordo:      #24353F;
    --testo:      #EDF2F5;
    --tenue:      #8CA2B2;
    /* #5D7382 dava 3.86:1 sul fondo, sotto il minimo AA di 4.5.
       Lo uso per testo piccolo (anni, date, intestazioni), dove
       serve piu' contrasto, non meno. */
    --debole:     #7C93A3;
    --acceso:     #F2E9D8;
    --acceso-testo: #16220F;
    --verde:      #7FBF7A;
    --rosso:      #C97A6D;
    --ombra: 0 8px 28px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {
    background: var(--fondo);
    /* niente ingrandimento automatico del testo in orizzontale */
    -webkit-text-size-adjust: 100%;
    /* il rimbalzo della pagina mostrerebbe il bianco dietro */
    overscroll-behavior-y: none;
  }
  body {
    margin: 0;
    /* dvh e non vh: su iOS la vh non tiene conto delle barre che
       compaiono e spariscono, e il fondo pagina resta tagliato */
    min-height: 100dvh;
    background: var(--fondo); color: var(--testo);
    font: 400 16px/1.5 -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
    /* Dynamic Island: da app aggiunta a Home il contenuto partirebbe
       sotto l'isola. 59pt su iPhone 15. */
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(66px + env(safe-area-inset-bottom));
  }
  button {
    font: inherit; color: inherit; background: none; border: 0; cursor: pointer;
    /* manipulation toglie i 300ms di attesa del doppio tap: su un
       telecomando la differenza si sente */
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  img { display: block; }

  /* ----------------------------------------------------------- struttura */
  #schermo { min-height: 60vh; }
  .pad { padding: 0 16px; }
  .titolone {
    font-size: 27px; font-weight: 640; letter-spacing: -.021em;
    margin: 16px 0 10px;
  }
  .sezione {
    font-size: 12px; font-weight: 640; letter-spacing: .07em;
    text-transform: uppercase; color: var(--debole);
    margin: 26px 0 10px;
  }
  .nota { color: var(--tenue); font-size: 15px; margin: 18px 0; }
  .vuoto { color: var(--debole); text-align: center; padding: 16vh 24px; line-height: 1.6; display: flex; flex-direction: column; align-items: center; }
  .vuoto p { margin: 0; white-space: pre-line; }
  .benvenuto {
    margin: 2px 0 18px; padding: 14px 16px; border-radius: 14px;
    background: var(--fondo-alto); border: 1px solid var(--bordo);
    color: var(--tenue); font-size: 14.5px; line-height: 1.6;
  }
  .benvenuto b { color: var(--testo); font-weight: 600; }
  .forse { margin: 4px 16px 0; color: var(--tenue); font-size: 13.5px; }
  .cercaLista { padding: 2px 16px 4px; }
  .cercaLista input {
    width: 100%; padding: 11px 14px; font-size: 16px;
    background: var(--fondo-alto); border: 1px solid var(--bordo);
    border-radius: 12px; color: var(--testo);
  }
  .cercaLista input::placeholder { color: var(--debole); }

  /* ------------------------------------------------------ barra in basso */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; gap: 2px;
    background: rgba(11,16,20,.86);
    backdrop-filter: saturate(160%) blur(18px);
    -webkit-backdrop-filter: saturate(160%) blur(18px);
    border-top: 1px solid var(--bordo);
    padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
  }
  nav button {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 3px; padding: 5px 0 3px; color: var(--debole);
    font-size: 10.5px; font-weight: 560; letter-spacing: .02em;
    border-radius: 11px;
    min-height: 44px;   /* minimo tocco comodo secondo Apple */
    overflow: hidden; white-space: nowrap;
  }
  nav button svg { width: 23px; height: 23px; fill: none;
    stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  nav button[aria-selected=true] { color: var(--acceso); }

  /* -------------------------------------------------------------- generi */
  .generi {
    display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .generi::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; min-height: 44px; padding: 10px 16px; border-radius: 999px;
    display: inline-flex; align-items: center;
    background: var(--piano); border: 1px solid var(--bordo);
    color: var(--tenue); font-size: 14.5px; font-weight: 500; white-space: nowrap;
  }
  .chip[aria-pressed=true] {
    background: var(--acceso); border-color: var(--acceso);
    color: var(--acceso-testo); font-weight: 600;
  }
  /* Il riempimento della cornice non e' un bersaglio: i tocchi che
     cadono li' non arrivano ai bottoni. Quindi sono i BOTTONI a
     dover essere 44px, non la cornice. */
  .interruttore {
    display: inline-flex; margin: 0 0 2px; padding: 3px;
    background: var(--piano); border: 1px solid var(--bordo); border-radius: 12px;
  }
  .interruttore button {
    min-height: 44px; padding: 8px 20px; border-radius: 9px; font-size: 15px;
    font-weight: 560; color: var(--tenue);
  }
  .interruttore button[aria-pressed=true] { background: var(--piano-alto); color: var(--testo); }

  /* ------------------------------------------------------ griglia poster */
  .griglia {
    display: grid; gap: 14px 11px; padding: 4px 16px 8px;
    grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
  }
  /* align-self: start perche' le righe della griglia si dimensionano
     sulla carta piu' alta (titolo su due righe) e le altre, essendo
     <button>, si centrerebbero verticalmente scendendo di 15px.
     display: flex annulla il centramento interno del button. */
  .carta {
    text-align: left; align-self: start;
    display: flex; flex-direction: column; align-items: stretch;
  }
  .carta .tela {
    position: relative; aspect-ratio: 2/3; border-radius: 11px;
    overflow: hidden; background: var(--piano);
    box-shadow: 0 3px 14px rgba(0,0,0,.35);
  }
  .carta img { width: 100%; height: 100%; object-fit: cover; -webkit-touch-callout: none; }
  .carta:active .tela { transform: scale(.972); }
  .carta .tela { transition: transform .13s ease; }
  .carta .manca {
    display: flex; align-items: center; justify-content: center;
    height: 100%; padding: 10px; text-align: center;
    color: var(--debole); font-size: 11.5px; line-height: 1.35;
  }
  .carta .voto {
    position: absolute; top: 6px; right: 6px;
    background: rgba(8,12,15,.82); backdrop-filter: blur(6px);
    color: var(--testo); font-size: 11px; font-weight: 640;
    padding: 3px 6px; border-radius: 7px;
  }
  .carta h3 {
    margin: 7px 1px 0; font-size: 13px; font-weight: 520; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 2.6em;
  }
  .carta p { margin: 1px 1px 0; font-size: 11.5px; color: var(--debole); }

  /* ----------------------------------------------------------- dettaglio */
  .sfondo { position: relative; margin-bottom: 8px; }
  .sfondo img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
  .sfondo::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(11,16,20,.15) 0%, rgba(11,16,20,.6) 55%, var(--fondo) 100%);
  }
  .sfondo.senza { aspect-ratio: 16/7; background: linear-gradient(160deg, var(--piano-alto), var(--fondo)); }
  .testa { display: flex; gap: 14px; align-items: flex-end; margin: -64px 0 0; position: relative; z-index: 2; }
  .testa .locandina {
    flex: 0 0 96px; aspect-ratio: 2/3; border-radius: 10px; overflow: hidden;
    background: var(--piano); box-shadow: var(--ombra);
  }
  .testa .locandina img { width: 100%; height: 100%; object-fit: cover; }
  .testa h1 { font-size: 22px; font-weight: 660; letter-spacing: -.018em; margin: 0 0 5px; line-height: 1.2; }
  .meta { color: var(--tenue); font-size: 13.5px; }
  .meta b { color: var(--testo); font-weight: 600; }

  /* ------------------------------------------------------------ verdetto */
  .verdetto { border-radius: 15px; padding: 17px 18px; margin: 20px 0 0; }
  .verdetto.si { background: var(--acceso); color: var(--acceso-testo); }
  .verdetto.no { background: var(--piano); border: 1px solid var(--bordo); }
  .verdetto .risposta { font-size: 21px; font-weight: 640; letter-spacing: -.015em; margin: 0; }
  .verdetto .dove { margin: 7px 0 0; font-size: 14.5px; opacity: .82; }

  .apri {
    display: flex; align-items: center; gap: 12px; width: 100%;
    margin: 10px 0 0; padding: 13px 15px;
    background: var(--piano); border: 1px solid var(--bordo);
    border-radius: 13px; font-size: 16px; font-weight: 560;
    transition: background .14s;
  }
  .apri:active { background: var(--piano-alto); }
  .apri .logo { width: 34px; height: 34px; border-radius: 8px; flex: 0 0 34px; background: var(--piano-alto); }
  /* Il Fire Stick cerca fra TUTTE le app, quindi non ha un logo suo:
     una lente invece del quadratino vuoto. */
  .apri .logo.cerca { display: flex; align-items: center; justify-content: center; }
  .apri .logo.cerca svg { width: 19px; height: 19px; stroke: var(--tenue); stroke-width: 2; fill: none; }
  .apri .etichetta { flex: 1; text-align: left; }
  .apri small { display: block; font-size: 12.5px; font-weight: 400; color: var(--debole); margin-top: 1px; }
  .apri.fatto { background: var(--acceso); color: var(--acceso-testo); border-color: var(--acceso); }
  .apri.fatto small { color: rgba(22,34,15,.62); }
  .apri.male { border-color: var(--rosso); }
  .apri:disabled { opacity: .55; }

  .trama { color: var(--testo); font-size: 15.5px; line-height: 1.62; margin: 10px 0 0; opacity: .9; }
  .cast { display: flex; gap: 12px; overflow-x: auto; padding: 2px 16px 6px; scrollbar-width: none; }
  .cast::-webkit-scrollbar { display: none; }
  .attore { flex: 0 0 74px; text-align: center; }
  .attore .faccia {
    width: 74px; height: 74px; border-radius: 50%; overflow: hidden;
    background: var(--piano); margin: 0 auto 6px;
    display: flex; align-items: center; justify-content: center;
    color: var(--debole); font-size: 20px; font-weight: 600;
  }
  .attore .faccia img { width: 100%; height: 100%; object-fit: cover; }
  /* due righe fisse: i nomi lunghi non devono sfasare la fila */
  .attore b {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; font-size: 12px; font-weight: 540; line-height: 1.3;
    min-height: 2.6em;
  }
  .attore span { display: block; font-size: 11px; color: var(--debole); line-height: 1.3; margin-top: 1px; }

  /* -------------------------------------------------------------- ricerca */
  .barraRicerca { padding: 4px 16px 0; }
  /* 16px e' la soglia: sotto, iOS ingrandisce la pagina quando il
     campo prende il fuoco e non la rimpicciolisce piu' */
  .barraRicerca input {
    width: 100%; background: var(--piano); border: 1px solid var(--bordo);
    border-radius: 13px; color: var(--testo); font: 400 16.5px system-ui, sans-serif;
    padding: 14px 16px; -webkit-appearance: none; appearance: none;
  }
  .barraRicerca input::placeholder { color: var(--debole); }
  input:focus, textarea:focus, .chip:focus-visible, .carta:focus-visible, .apri:focus-visible {
    outline: 2px solid var(--acceso); outline-offset: 2px;
  }

  .riga {
    display: flex; gap: 13px; width: 100%; text-align: left;
    padding: 9px 0; border-bottom: 1px solid var(--bordo);
  }
  .riga .mini { flex: 0 0 52px; aspect-ratio: 2/3; border-radius: 7px; overflow: hidden; background: var(--piano); }
  .riga .mini img { width: 100%; height: 100%; object-fit: cover; }
  .riga .dati { flex: 1; min-width: 0; align-self: center; }
  .riga b { display: block; font-size: 15.5px; font-weight: 550; }
  .riga span { font-size: 13px; color: var(--debole); }

  /* --------------------------------------------------------- impostazioni */
  .campo { margin: 0 0 20px; }
  .campo label { display: block; font-size: 14px; font-weight: 560; margin: 0 0 7px; }
  .campo textarea {
    width: 100%; background: var(--piano); border: 1px solid var(--bordo);
    border-radius: 12px; color: var(--testo);
    font: 400 14px/1.5 ui-monospace, SFMono-Regular, monospace;
    padding: 13px 14px; resize: vertical;
  }
  .campo p { color: var(--debole); font-size: 12.5px; margin: 7px 0 0; line-height: 1.5; }
  .primario {
    display: block; width: 100%; margin: 6px 0 0; padding: 15px;
    background: var(--acceso); color: var(--acceso-testo);
    border-radius: 13px; font-size: 16.5px; font-weight: 620;
  }
  .primario:disabled { opacity: .5; }
  .esito { margin: 14px 0 0; font-size: 14px; line-height: 1.6; color: var(--tenue); }
  .esito .ok::before   { content: "✓ "; color: var(--verde); }
  .esito .ko::before   { content: "✕ "; color: var(--rosso); }

  .indietro {
    display: inline-flex; align-items: center; gap: 6px; color: var(--tenue);
    font-size: 15px; padding: 14px 16px 4px; min-height: 44px;
  }

  /* ------------------------------------------------------------ filtri */
  .capo { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .capo .azioni { display: flex; gap: 8px; flex: 0 0 auto; }
  /* "Stasera" sta nella barra del titolo: da pulsante a tutta larghezza
     costava 57px di altezza prima del contenuto. In crema resta la cosa
     piu' vistosa della schermata anche se e' piccolo. */
  .capo .stasera {
    width: auto; margin: 0; padding: 0 15px; min-height: 44px;
    border-radius: 999px; font-size: 14.5px; gap: 6px;
  }
  .capo .stasera svg { width: 17px; height: 17px; }
  .bottoneFiltri {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 8px 15px; border-radius: 999px;
    font-size: 14.5px; font-weight: 560;
    background: var(--piano); border: 1px solid var(--bordo); color: var(--tenue);
  }
  .bottoneFiltri[aria-expanded=true], .bottoneFiltri.attivi {
    background: var(--acceso); border-color: var(--acceso); color: var(--acceso-testo);
  }
  .pannello {
    margin: 12px 16px 2px; padding: 4px 0 10px;
    border: 1px solid var(--bordo); border-radius: 14px; background: var(--fondo-alto);
  }
  .pannello .gruppo { padding: 10px 14px 2px; }
  .pannello .gruppo > span {
    display: block; font-size: 11.5px; font-weight: 640; letter-spacing: .07em;
    text-transform: uppercase; color: var(--debole); margin: 0 0 8px;
  }
  .scelte { display: flex; flex-wrap: wrap; gap: 7px; }
  .scelte .chip { font-size: 13.5px; padding: 7px 12px; }
  .azzera {
    display: block; width: calc(100% - 28px); margin: 12px 14px 4px; padding: 11px;
    border-radius: 11px; border: 1px solid var(--bordo); color: var(--tenue); font-size: 14.5px;
  }
  .conteggio { color: var(--debole); font-size: 12.5px; font-weight: 400; }

  /* ------------------------------------------------------- telecomando */
  .telecomando { padding: 0 16px 20px; }
  .fila { display: flex; gap: 10px; margin: 0 0 12px; }
  .fila > button { flex: 1; }
  .tasto {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; min-height: 56px; padding: 10px 6px;
    -webkit-touch-callout: none;   /* niente menu al tocco lungo */
    background: var(--piano); border: 1px solid var(--bordo); border-radius: 13px;
    font-size: 12.5px; font-weight: 560; color: var(--tenue);
    transition: background .1s, transform .1s;
  }
  .tasto:active { background: var(--acceso); color: var(--acceso-testo); transform: scale(.96); }
  .tasto svg { width: 21px; height: 21px; fill: none; stroke: currentColor;
               stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .tasto.acceso { background: var(--acceso); color: var(--acceso-testo); border-color: var(--acceso); }
  .tasto:disabled { opacity: .45; }

  .croce {
    display: grid; gap: 9px; margin: 0 auto 14px; max-width: 260px;
    grid-template-columns: repeat(3, 1fr);
    grid-template-areas: ". su ." "sx ok dx" ". giu .";
  }
  .croce .su  { grid-area: su; }  .croce .giu { grid-area: giu; }
  .croce .sx  { grid-area: sx; }  .croce .dx  { grid-area: dx; }
  .croce .ok  { grid-area: ok; }
  .croce .tasto { min-height: 62px; border-radius: 15px; }
  .croce .ok {
    background: var(--piano-alto); font-size: 15px; font-weight: 660; color: var(--testo);
    border-radius: 50%;
  }
  .stato {
    display: flex; align-items: center; gap: 9px; margin: 0 0 16px;
    padding: 12px 14px; background: var(--fondo-alto);
    border: 1px solid var(--bordo); border-radius: 13px; font-size: 14px;
  }
  .pallina { width: 9px; height: 9px; border-radius: 50%; background: var(--debole); flex: 0 0 9px; }
  .pallina.viva { background: var(--verde); }
  .pallina.morta { background: var(--rosso); }
  .stato .quale { color: var(--tenue); }
  /* 66x22 misurati: troppo poco per un dito. Il bersaglio arriva a 44
     senza ingrossare la barra, coi margini negativi. */
  .stato button {
    margin: -13px -4px -13px auto; padding: 13px 4px;
    color: var(--tenue); font-size: 13px; text-decoration: underline;
  }

  /* ------------------------------------------------------- stasera */
  .stasera {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    width: calc(100% - 32px); margin: 4px 16px 14px; padding: 16px;
    background: var(--acceso); color: var(--acceso-testo);
    border-radius: 14px; font-size: 16.5px; font-weight: 640;
  }
  .stasera svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9;
                 stroke-linecap: round; stroke-linejoin: round; }
  .pescato { padding: 0 16px; scroll-margin-top: 12px; }
  /* Quando c'è un pescato, riservo altezza: senza, la pagina non
     scorre abbastanza per portarlo davanti e resta in fondo. */
  .pescato:not(:empty) { min-height: 82vh; }
  /* Le cinque righe consigliate: locandina piccola, titolo, dove lo
     paghi, e il tuo voto. Si toccano e aprono la scheda. */
  .cinque { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 0; }
  .rigaPesca {
    background: var(--fondo-alto); border: 1px solid var(--bordo);
    border-radius: 14px; overflow: hidden;
  }
  .capoPesca {
    display: flex; gap: 13px; align-items: center; width: 100%;
    text-align: left; padding: 11px 13px;
  }
  .capoPesca:active { background: var(--piano); }
  .rigaPesca .mini {
    flex: 0 0 54px; aspect-ratio: 2/3; border-radius: 9px; overflow: hidden;
    background: var(--piano);
  }
  .rigaPesca .mini img { width: 100%; height: 100%; object-fit: cover; }
  .rigaPesca .dati { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .rigaPesca .dati b {
    font-size: 15.5px; font-weight: 600; line-height: 1.25;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .rigaPesca .dati .meta { font-size: 12.5px; color: var(--debole); }
  .rigaPesca .dati .dove { font-size: 12.5px; color: var(--verde); font-weight: 560; }
  .rigaPesca .dati .dove.fuori { color: var(--tenue); font-weight: 500; }
  .rigaPesca .dati .tuo { font-size: 12px; color: var(--tenue); }
  .rigaPesca .dati .freccia { font-size: 12px; color: var(--acceso); font-weight: 560; margin-top: 3px; }
  .caricamento.piccolo { padding: 22px 0; }

  /* ----------------------------------------------- stagioni/episodi */
  .prossimo {
    margin: 14px 0 0; padding: 14px 16px; border-radius: 13px;
    background: var(--fondo-alto); border: 1px solid var(--bordo);
  }
  .prossimo .quando { font-size: 12px; font-weight: 640; letter-spacing: .06em;
                      text-transform: uppercase; color: var(--verde); margin: 0 0 5px; }
  .prossimo.finita .quando { color: var(--debole); }
  .prossimo .cosa { margin: 0; font-size: 15.5px; font-weight: 550; }
  .prossimo .data { margin: 4px 0 0; font-size: 13.5px; color: var(--tenue); }

  .episodio {
    display: flex; gap: 12px; width: 100%; text-align: left;
    padding: 11px 0; border-bottom: 1px solid var(--bordo);
  }
  .episodio .fermo {
    flex: 0 0 96px; aspect-ratio: 16/9; border-radius: 8px;
    overflow: hidden; background: var(--piano);
  }
  .episodio .fermo img { width: 100%; height: 100%; object-fit: cover; }
  .episodio .dati { flex: 1; min-width: 0; align-self: center; }
  .episodio b { display: block; font-size: 14.5px; font-weight: 550; line-height: 1.3; }
  .episodio span { font-size: 12.5px; color: var(--debole); }
  .episodio .trama2 {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; font-size: 12.5px; color: var(--tenue); margin-top: 3px;
  }
  .futuro { opacity: .55; }

  /* -------------------------------------------------------- persona */
  .capoPersona { display: flex; gap: 15px; align-items: center; padding: 6px 16px 4px; }
  .capoPersona .ritratto {
    flex: 0 0 82px; width: 82px; height: 82px; border-radius: 50%;
    overflow: hidden; background: var(--piano);
    display: flex; align-items: center; justify-content: center;
    color: var(--debole); font-size: 26px; font-weight: 600;
  }
  .capoPersona .ritratto img { width: 100%; height: 100%; object-fit: cover; }
  .capoPersona h1 { font-size: 23px; font-weight: 660; letter-spacing: -.018em; margin: 0 0 3px; line-height: 1.15; }
  .attore { -webkit-touch-callout: none; }
  button.attore { background: none; border: 0; padding: 0; }

  /* -------------------------------------------------- scorciatoie */
  .scorciatoie { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; margin: 10px 0 0; }
  .scorciatoia {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 7px; min-height: 76px; padding: 11px 6px; border-radius: 13px;
    background: var(--piano); border: 1px solid var(--bordo);
    font-size: 11.5px; font-weight: 550; color: var(--tenue); text-align: center;
    -webkit-touch-callout: none;
  }
  .scorciatoia img { width: 36px; height: 36px; border-radius: 9px; }
  .scorciatoia:active { background: var(--piano-alto); }
  .scorciatoia.acceso, .scorciatoia[aria-pressed=true] {
    background: var(--acceso); border-color: var(--acceso); color: var(--acceso-testo);
  }
  .scorciatoia:disabled { opacity: .6; }

  /* --------------------------------------------------------- saga */
  .carta.nonTua { opacity: .42; }
  .carta.questo .tela { outline: 2px solid var(--acceso); outline-offset: 2px; }

  /* ----------------------------------------------------- diagnosi */
  .diagnosi { margin: 8px 0 0; }
  .diagnosi .riga2 {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 9px 0; border-bottom: 1px solid var(--bordo); font-size: 14px;
  }
  .diagnosi .riga2 span:first-child { color: var(--tenue); }
  .diagnosi .riga2 span:last-child { text-align: right; font-weight: 550; }
  .diagnosi .si { color: var(--verde); }
  .diagnosi .no { color: var(--rosso); }
  .guai { margin: 12px 0 0; }
  .guai .guaio {
    padding: 9px 0; border-bottom: 1px solid var(--bordo);
    font: 400 12.5px/1.5 ui-monospace, monospace; color: var(--tenue);
  }
  .guai .guaio b { display: block; color: var(--rosso); font-weight: 600; }

  /* ---------------------------------------------------- visto/voto */
  .visto {
    margin: 12px 0 0; padding: 14px 16px; border-radius: 13px;
    background: var(--fondo-alto); border: 1px solid var(--bordo);
  }
  .visto .domanda { margin: 0 0 10px; font-size: 14.5px; color: var(--tenue); }
  .stelle { display: flex; gap: 4px; }
  .stelle button {
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    border-radius: 10px; -webkit-touch-callout: none;
  }
  .stelle svg { width: 27px; height: 27px; stroke: var(--debole); stroke-width: 1.5; fill: none; }
  .stelle button.piena svg { fill: var(--acceso); stroke: var(--acceso); }
  .stelle button:active { background: var(--piano); }
  /* La fila per votare in fretta: serve a votarne venti di fila,
     quindi conta la densita' - una scheda intera per titolo sarebbe
     troppo lenta - ma NON a costo del dito: le stelle stanno su una
     riga loro, larghe 44px, che e' la misura sotto la quale si sbaglia
     stella. Titolo, anno e spunta «notte» stanno sopra, su una riga
     sola. */
  /* Le carte «Da votare», tipo Tinder: una per volta, grande, e si
     trascina. La pila si intuisce dalla carta appena dietro. */
  .mazzoCarte { position: relative; padding: 4px 16px 0; }
  .contaVotare { color: var(--tenue); font-size: 13.5px; text-align: center; }
  .contaVotare b { color: var(--testo); font-weight: 640; }
  .spiegaMazzo { margin: 2px 16px 8px; color: var(--tenue); font-size: 13px;
    line-height: 1.5; text-align: center; }
  .spiegaMazzo b { color: var(--testo); }
  .spiegaMod { margin: 8px 16px 0; color: var(--tenue); font-size: 13.5px; line-height: 1.5; }
  .cartaV {
    position: relative; z-index: 2;
    background: var(--piano); border: 1px solid var(--bordo);
    border-radius: 20px; overflow: hidden; touch-action: pan-y;
    will-change: transform;
  }
  .cartaV.dietro {
    position: absolute; top: 12px; left: 22px; right: 22px; z-index: 1;
    opacity: .5; transform: scale(.97); pointer-events: none;
  }
  .cartaV.dietro img { width: 100%; display: block; border-radius: 20px; }
  /* Il poster e' CAPPATO in altezza: su un telefono, se e' alto quanto
     vuole, le stelle e i tasti finiscono sotto la piega e il colpo
     d'occhio si perde. Object-fit cover riempie senza deformare, e il
     titolo sta in sovrimpressione sul fondo. */
  .posterCarta {
    display: block; width: 100%; padding: 0; border: 0; background: none;
    position: relative; height: 42vh; min-height: 240px;
  }
  .posterCarta img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .mancaCarta { width: 100%; height: 100%; background: var(--piano-alto); }
  .sottoCarta {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 40px 16px 12px; text-align: left; pointer-events: none;
    background: linear-gradient(transparent, rgba(9,14,18,.92));
  }
  .sottoCarta h3 { margin: 0; font-size: 21px; font-weight: 680; line-height: 1.15;
    text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  .sottoCarta p { margin: 3px 0 0; color: #cdd8e0; font-size: 14px; }
  .cartaV .stelle { justify-content: space-between; padding: 10px 16px 4px; }
  .cartaV .stelle button { width: 46px; height: 46px; }
  .didascStelle {
    text-align: center; margin: 0; padding: 0 16px;
    font-size: 11.5px; color: var(--tenue);
  }
  .azioniCarta {
    display: flex; align-items: flex-start; justify-content: space-around;
    padding: 8px 16px 16px;
  }
  .azioneCol { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .azioneCol .didasc { font-size: 11px; color: var(--tenue); white-space: nowrap; }
  .tondo {
    width: 58px; height: 58px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--piano-alto); border: 1px solid var(--bordo);
  }
  .tondo svg { width: 26px; height: 26px; fill: none; stroke-width: 2.2; }
  .tondo.salta svg { stroke: var(--rosso); }
  .tondo.voglio { width: 66px; height: 66px; }
  .tondo.voglio svg { width: 30px; height: 30px; stroke: var(--verde); }
  .tondo.notte svg { stroke: var(--tenue); }
  .tondo.notte[aria-pressed=true] { border-color: var(--acceso); }
  .tondo.notte[aria-pressed=true] svg { stroke: var(--acceso); fill: var(--acceso); }
  .tondo:active { background: var(--bordo); }
  .etichettaSwipe {
    position: absolute; top: 16px; z-index: 3; left: 16px;
    padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 15px;
    letter-spacing: 1px; opacity: 0; transition: opacity .1s; pointer-events: none;
  }
  .etichettaSwipe.si { opacity: 1; color: var(--verde); border: 2px solid var(--verde); }
  .etichettaSwipe.no { opacity: 1; right: 16px; left: auto; color: var(--rosso); border: 2px solid var(--rosso); }

  .fila2 {
    display: flex; gap: 11px; align-items: flex-start;
    padding: 9px 0; border-bottom: 1px solid var(--bordo);
  }
  .fila2 .apri2 {
    padding: 0; background: none; border: 0; flex: none;
    width: 50px; display: block;
  }
  .fila2 .apri2 img, .fila2 .manca2 {
    width: 50px; height: 75px; border-radius: 7px; object-fit: cover;
    background: var(--piano); display: block;
  }
  .fila2 .chi { flex: 1; min-width: 0; }
  .fila2 .su2 { display: flex; gap: 8px; align-items: flex-start; }
  .fila2 .su2 > div { flex: 1; min-width: 0; }
  .fila2 h3 {
    margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .fila2 .anno2 {
    margin: 1px 0 0; font-size: 12.5px; color: var(--tenue);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .fila2 .stelle { margin: 2px 0 0; justify-content: space-between; }
  .fila2 .stelle button { width: 44px; height: 44px; }
  .fila2 .notte {
    position: relative; flex: none; padding: 5px 11px; font-size: 12.5px;
    min-height: 32px; border-radius: 999px; border: 1px solid var(--bordo);
    color: var(--tenue); background: none;
  }
  /* La pillola resta piccola - se fosse alta 44 la riga crescerebbe di
     altrettanto - ma il bersaglio arriva a 44. */
  .fila2 .notte::before {
    content: ""; position: absolute; inset: -6px -4px; border-radius: 999px;
  }
  .fila2 .notte[aria-pressed=true] {
    color: var(--acceso); border-color: var(--acceso);
    background: rgba(242, 233, 216, .08);
  }
  .fila2 .fatto2 {
    margin: 8px 0 0; font-size: 14px; color: var(--acceso);
    min-height: 34px; display: flex; align-items: center; gap: 14px;
  }
  .fila2 .fatto2 button {
    background: none; border: 0; padding: 0; min-height: 34px;
    color: var(--tenue); font-size: 13.5px; text-decoration: underline;
  }

  /* 32px misurati: sotto i 44 il dito sbaglia, e qui ci sono due
     comandi vicini («Non l'ho visto» e «Buono per dormire»). */
  .visto .togli {
    margin: 4px 0 0; padding: 6px 0; color: var(--tenue);
    font-size: 13.5px; text-decoration: underline; min-height: 44px;
  }
  .visto .altroVoto {
    margin: 8px 0 0; font-size: 13.5px; color: var(--tenue);
    letter-spacing: .5px;
  }
  .visto .esito { margin: 10px 0 0; font-size: 14.5px; font-weight: 550; }
  .gusto {
    margin: 10px 16px 0; padding: 12px 14px; border-radius: 12px;
    background: var(--fondo-alto); border: 1px solid var(--bordo);
    color: var(--tenue); font-size: 13.5px; line-height: 1.55;
  }
  .gusto b { color: var(--testo); font-weight: 600; }

  /* ------------------------------------------------- aggiornamento */
  .nuova {
    position: fixed; left: 12px; right: 12px;
    bottom: calc(74px + env(safe-area-inset-bottom)); z-index: 50;
    display: flex; align-items: center; gap: 12px;
    padding: 13px 15px; border-radius: 14px;
    background: var(--acceso); color: var(--acceso-testo);
    box-shadow: var(--ombra); font-size: 14.5px; font-weight: 560;
  }
  .nuova span { flex: 1; }
  .nuova button {
    padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 660;
    background: var(--acceso-testo); color: var(--acceso); min-height: 40px;
  }

  /* ------------------------------------------------- il tour della prima volta */
  .veloTour {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: rgba(4,8,11,.86);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    animation: velaEntra .18s ease-out;
  }
  @keyframes velaEntra { from { opacity: 0; } to { opacity: 1; } }
  .tour {
    width: 100%; max-width: 330px;
    background: var(--fondo-alto); border: 1px solid var(--bordo);
    border-radius: 22px; box-shadow: var(--ombra);
    padding: 30px 24px 22px; text-align: center;
  }
  .tourIcona {
    font-size: 46px; line-height: 1; margin: 2px 0 16px;
  }
  .tour h3 { font-size: 21px; font-weight: 680; margin: 0 0 10px; }
  .tour p {
    color: var(--tenue); font-size: 15px; line-height: 1.55; margin: 0;
    min-height: 70px;
  }
  .tour p b { color: var(--testo); font-weight: 600; }
  .tourPunti { display: flex; gap: 7px; justify-content: center; margin: 20px 0 22px; }
  .tourPunti i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--bordo); transition: background .2s, transform .2s;
  }
  .tourPunti i.on { background: var(--acceso); transform: scale(1.15); }
  .tourAvanti {
    width: 100%; padding: 14px; border-radius: 13px;
    background: var(--acceso); color: var(--acceso-testo);
    font-size: 16px; font-weight: 680; min-height: 50px;
  }
  .tourAvanti:active { transform: scale(.98); }
  .tourSalta {
    display: inline-flex; align-items: center; min-height: 40px;
    margin-top: 6px; padding: 4px 12px;
    color: var(--debole); font-size: 13.5px;
  }

  /* ------------------------------------------------------ in arrivo */
  .arrivo {
    display: flex; gap: 12px; align-items: center; width: 100%; text-align: left;
    padding: 11px 0; border-bottom: 1px solid var(--bordo);
  }
  .arrivo .mini { flex: 0 0 44px; aspect-ratio: 2/3; border-radius: 7px; overflow: hidden; background: var(--piano); }
  .arrivo .mini img { width: 100%; height: 100%; object-fit: cover; }
  .arrivo .dati { flex: 1; min-width: 0; }
  .arrivo b { display: block; font-size: 15px; font-weight: 550; }
  .arrivo span { font-size: 12.5px; color: var(--debole); }
  .arrivo .fra {
    flex: 0 0 auto; padding: 5px 10px; border-radius: 8px;
    background: var(--piano); color: var(--verde);
    font-size: 12px; font-weight: 640; white-space: nowrap;
  }
  .arrivo .fra.oggi { background: var(--acceso); color: var(--acceso-testo); }

  /* ---------------------------------------------------- condividi */
  .condividi {
    display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--piano); border: 1px solid var(--bordo);
    -webkit-touch-callout: none;
  }
  .condividi svg { width: 20px; height: 20px; fill: none; stroke: var(--tenue);
                   stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .condividi:active { transform: scale(.92); }
  .indirizzo {
    width: 100%; margin: 10px 0 0; padding: 12px 14px;
    background: var(--piano); border: 1px solid var(--bordo); border-radius: 12px;
    color: var(--testo); font: 400 14px/1.4 ui-monospace, monospace;
  }

  /* --------------------------------------------------- da guardare */
  .testaAzioni { display: flex; align-items: center; justify-content: space-between; padding-right: 12px; }
  .cuore {
    display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--piano); border: 1px solid var(--bordo);
    -webkit-touch-callout: none;
  }
  .cuore svg { width: 21px; height: 21px; fill: none; stroke: var(--tenue);
               stroke-width: 1.8; stroke-linejoin: round; }
  .cuore[aria-pressed=true] { background: var(--acceso); border-color: var(--acceso); }
  .cuore[aria-pressed=true] svg { fill: var(--acceso-testo); stroke: var(--acceso-testo); }
  .cuore:active { transform: scale(.92); }
  .svuota {
    display: block; margin: 20px 16px 0; padding: 12px; width: calc(100% - 32px);
    border: 1px solid var(--bordo); border-radius: 12px;
    color: var(--tenue); font-size: 14.5px;
  }

  /* ---------------------------------------------------- abbonamenti */
  .servizi { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
             gap: 10px; margin: 10px 0 0; }
  .servizio {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 6px; border-radius: 13px;
    background: var(--piano); border: 1px solid var(--bordo);
    font-size: 11px; line-height: 1.25; text-align: center; color: var(--tenue);
    min-height: 44px;
  }
  .servizio img { width: 38px; height: 38px; border-radius: 9px; }
  .servizio[aria-pressed=true] {
    background: var(--acceso); border-color: var(--acceso); color: var(--acceso-testo);
    font-weight: 600;
  }
  .servizio .senzaApp { font-size: 9.5px; opacity: .8; }
  .cerca-servizio {
    width: 100%; margin: 14px 0 0; background: var(--piano);
    border: 1px solid var(--bordo); border-radius: 12px; color: var(--testo);
    font: 400 16.5px system-ui, sans-serif; padding: 12px 14px;
    -webkit-appearance: none; appearance: none;
  }
  .cerca-servizio::placeholder { color: var(--debole); }

  /* -------------------------------------------------------- trailer */
  .trailer { position: relative; margin: 10px 0 0; border-radius: 13px; overflow: hidden;
             background: var(--piano); aspect-ratio: 16/9; }
  .trailer img { width: 100%; height: 100%; object-fit: cover; }
  .trailer iframe { width: 100%; height: 100%; border: 0; display: block; }
  .trailer .via {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(rgba(11,16,20,.1), rgba(11,16,20,.55));
  }
  .trailer .via span {
    display: flex; align-items: center; justify-content: center;
    width: 62px; height: 62px; border-radius: 50%;
    background: rgba(242,233,216,.94); box-shadow: var(--ombra);
  }
  .trailer .via svg { width: 26px; height: 26px; margin-left: 3px; fill: var(--acceso-testo); }
  .trailer .quale {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 14px 10px;
    font-size: 12.5px; color: var(--testo);
    background: linear-gradient(transparent, rgba(11,16,20,.85));
  }

  /* ------------------------------------------------------- tastiera TV */
  .tastiera { margin: 0 0 6px; }
  .tastiera .campo2 { display: flex; gap: 9px; }
  .tastiera input {
    flex: 1; min-width: 0; background: var(--piano); border: 1px solid var(--bordo);
    border-radius: 12px; color: var(--testo); font: 400 16.5px system-ui, sans-serif;
    padding: 14px 15px;
  }
  .tastiera input::placeholder { color: var(--debole); }
  .tastiera .manda {
    padding: 14px 18px; border-radius: 12px; font-size: 15.5px; font-weight: 600;
    background: var(--acceso); color: var(--acceso-testo);
  }
  .tastiera .manda:disabled { opacity: .5; }
  .cifre { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px 0 0; }
  .cifre .tasto { min-height: 46px; font-size: 16px; font-weight: 600; }
  .avvisoPonte {
    margin: 10px 0 0; padding: 12px 14px; border-radius: 12px;
    background: var(--fondo-alto); border: 1px solid var(--bordo);
    color: var(--tenue); font-size: 13.5px; line-height: 1.55;
  }

  /* Il distintivo della strada, accanto al titolo: serve che si veda
     SEMPRE in che modo sei, altrimenti ci si confonde su quale
     pulsante compare sulle schede. */
  .strada {
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 44px; padding: 0 12px; margin: 0 0 0 10px;
    border-radius: 999px; border: 1px solid var(--bordo);
    background: var(--piano); color: var(--tenue);
    font-size: 13px; font-weight: 560; white-space: nowrap;
  }
  .strada b { color: var(--testo); font-weight: 600; }

  /* La scelta all'avvio: due riquadri grandi, uno per strada. */
  .bivio { padding: 8vh 16px 0; }
  .bivio h1 { margin: 0 0 6px; font-size: 27px; letter-spacing: -.5px; }
  .bivio > p {
    margin: 0 0 22px; color: var(--tenue); font-size: 15px; line-height: 1.55;
  }
  .bivio .via {
    display: block; width: 100%; margin: 0 0 12px; padding: 18px;
    text-align: left; border-radius: 16px;
    background: var(--piano); border: 1px solid var(--bordo);
    color: var(--testo);
  }
  .bivio .via strong { display: block; font-size: 17.5px; font-weight: 620; }
  .bivio .via span {
    display: block; margin: 5px 0 0; color: var(--tenue);
    font-size: 13.5px; line-height: 1.5; font-weight: 400;
  }
  .bivio .via[aria-pressed=true] { border-color: var(--acceso); }

  /* Le istruzioni chiuse. Servono la prima volta; i campi tutte le
     altre, e in mezzo facevano scorrere per niente. */
  /* Un sotto-titolo: prima erano tutti «sezione» e non si capiva cosa
     stesse dentro cosa - «Stato» sembrava una sezione a se'. */
  .sottosezione {
    margin: 16px 0 6px; font-size: 12.5px; font-weight: 600;
    letter-spacing: .3px; color: var(--debole);
  }

  /* La stanza in cui non sei: chiusa, ma con lo stesso peso visivo di

<script>
"use strict";

/* ---------------------------------------------------- dati non segreti
   Un tempo erano tenuti allineati a mano con dei file JSON nel repo.
   Quei file non ci sono piu': l'app e' l'unica fonte, e non c'e' piu'
   niente da tenere d'accordo. Le due liste erano DIVERGITE una volta,
   e il risultato non era un errore ma un verdetto sbagliato.        */

const MAPPA = {

  "119":  { nome: "Prime Video",       app: "3201910019365" },
  "337":  { nome: "Disney+",           app: "3201901017640" },

  "1899": { nome: "HBO Max",           app: "5b8c3eb16b.BeamCTVDev" },
  "359":  { nome: "Mediaset Infinity", app: "g3zzYA7yO8.InfinityNew" },
  "110":  { nome: "Infinity+",         app: "g3zzYA7yO8.InfinityNew" },
};

// Gli abbonamenti NON sono piu' una costante: si scelgono in
// Impostazioni e stanno in localStorage. Erano scritti anche in un
// file del repo, e le due liste sono divergite una volta: Infinity+
// c'era qui e l'abbonamento no, e il risultato non
// era un errore ma un verdetto sbagliato.
// Questi valgono solo al primo avvio, finche' non scegli.
const SERVIZI_PREDEFINITI = ["8", "119", "337", "1899", "39", "359", "584"];

// Sottogeneri veri: sono le keyword di TMDB, non i generi. Gli id
// li ho cercati una volta con /search/keyword e verificati uno per
// uno incrociati col filtro abbonamenti: nessuno torna vuoto.
// I sottogeneri sono keyword TMDB. Ognuno porta con se' i generi
// principali con cui ha senso (`g`): raro un film di fantascienza
// «storia vera». Chi ha g:"*" e' TRASVERSALE e vale sotto ogni genere. Gli id sono sia dei FILM sia delle SERIE, che TMDB
// numera diversi (es. Fantascienza film 878, serie «Sci-Fi & Fantasy»
// 10765), cosi' la stessa lista vale per tutti e due. Verificati a mano.
const SOTTOGENERI = [
  // TRASVERSALI (g: "*"): il MODO in cui una storia e' raccontata, non
  // di cosa parla, quindi valgono sotto ogni genere. «Basato su un
  // libro» verificato: pesca in tutti i generi, dall'azione al dramma.
  { n: "Basato su un libro", k: "818", g: "*" },
  { n: "Supereroi", k: "9715", g: ["28","878","12","14","10759","10765"] },
  { n: "Storia vera", k: "9672", g: ["18","36","80","10752","10768"] },
  { n: "Rapine", k: "10051", g: ["80","53","28","10759"] },
  { n: "Spionaggio", k: "470", g: ["53","28","10752","10759","10768"] },
  { n: "Serial killer", k: "10714", g: ["53","27","80","9648","18"] },
  { n: "Distopia", k: "4565", g: ["878","53","18","10765"] },
  { n: "Viaggi nel tempo", k: "4379", g: ["878","12","10765"] },
  { n: "Post-apocalittico", k: "359337", g: ["878","27","28","10765","10759"] },
  { n: "Zombie", k: "12377", g: ["27","878","28","10765","10759"] },
  { n: "Vampiri", k: "3133", g: ["27","14","10749","10765"] },
  { n: "Alieni", k: "14909", g: ["878","27","10765"] },
  { n: "Robot", k: "14544", g: ["878","28","16","10765","10759"] },
  { n: "Arti marziali", k: "779", g: ["28","10759"] },
  { n: "Sopravvivenza", k: "10349", g: ["12","53","18","28","10759"] },
  { n: "Mafia", k: "10391", g: ["80","18","53"] },
  { n: "Cospirazioni", k: "10410", g: ["53","9648","878","10765","10768"] },
  { n: "Processi", k: "33519", g: ["18","53","80"] },
  { n: "Anime", k: "210024", g: ["16"] },
  { n: "Dinosauri", k: "12616", g: ["12","878","28","10751","10765","10759","10762"] },
  { n: "Natale", k: "207317", g: ["10751","35","10749","10762"] },
  // Temi piu' da DOCUMENTARIO (genere 99), che prima restava vuoto - ma
  // utili anche altrove (Spazio/Scienza sotto Fantascienza, Biografie
  // sotto Dramma...). Id e accoppiamenti verificati su TMDB: ogni
  // coppia genere+keyword da' risultati veri, se no non c'e'.
  { n: "True crime", k: "33722", g: ["99","80","18"] },
  { n: "Natura", k: "18330", g: ["99","12","10751"] },
  { n: "Sport", k: "6075", g: ["99","18","10751"] },
  { n: "Musica", k: "283297", g: ["99","10402","10749"] },
  { n: "Biografie", k: "5565", g: ["99","18","36"] },
  { n: "Politica", k: "6078", g: ["99","18","10768"] },
  { n: "Spazio", k: "9882", g: ["99","878","10765"] },
  { n: "Scienza", k: "287067", g: ["99","878"] },
  { n: "Arte", k: "14893", g: ["99","18"] },
  { n: "Cibo", k: "10637", g: ["99","35"] },
  { n: "Ambiente", k: "2210", g: ["99"] },
];

// I sottogeneri che stanno bene col genere principale scelto. Senza
// genere (Qualsiasi), tutti. Se la lista torna vuota, chi disegna
// nasconde del tutto la sezione: meglio niente che un filtro assurdo.
function sottogeneriPer(genere) {
  if (!genere) return SOTTOGENERI;
  // «*» = trasversale, sotto ogni genere; gli altri solo sotto i loro.
  return SOTTOGENERI.filter(s => s.g === "*" || s.g.includes(String(genere)));
}

// tvChannelName restituisce il NOME PACCHETTO, mentre MAPPA contiene
// l'id per LANCIARE - che per cinque app e' numerico. Quindi servono
// due tabelle diverse: questa e' per leggere, MAPPA per scrivere.
// Raccolti osservando la TV vera.
// Per quali servizi la tastiera a schermo e' stata MISURATA, e
// quindi il titolo si puo' scrivere dentro l'app invece di lasciarlo
// battere col telecomando. Il valore e' il nome della disposizione in
// tastiere.py, e le due liste devono restare d'accordo: offrire di
// scrivere su un'app di cui non si conosce la tastiera vorrebbe dire
// premere frecce alla cieca e scrivere spazzatura, senza che nessuno
// se ne accorga.
// Netflix e' misurata: griglia, bordi che girano, tasti larghi,
// normalizzazione e strada fino al campo di ricerca.
const TASTIERE = { "8": "netflix", "39": "now", "337": "disney",
                   "1899": "hbomax", "584": "discovery",
                   "119": "prime", "359": "infinity" };

// Da dove a-Shell scarica lo script che scrive sulla TV. In un posto
// solo, perche' finisce in un comando che l'utente incolla a mano:
// se cambia, deve cambiare qui e basta.
const POSIZIONE_SCRIPT =
  "https://mattiasereno.github.io/tv/scrivi_telefono.py";
const POSIZIONE_FIRE =
  "https://mattiasereno.github.io/tv/firestick.py";

// Dove si ferma la catena sul Fire TV, e come si chiama in italiano.
// L'ordine e' dal piu' prudente al piu' spiccio.
const FERMATE_FIRE = [
  ["risultati", "Sui risultati", "Scegli tu il titolo dalla lista"],
  ["titolo", "Sulla pagina del titolo",
   "Apre il primo risultato: guardi che sia quello e premi OK"],
  ["servizio", "Parte", "Apre il primo risultato e avvia"],
];

// Il comando da incollare nella Scorciatoia di iOS.
//
// NON contiene percorsi: scarica lo script al volo. Su a-Shell la
// cartella da cui parte una Scorciatoia non e' quella della finestra
// interattiva, e indovinarla e' costato tre tentativi. Cosi' il
// telefono non ha nessuna copia da tenere aggiornata, che e' stata
// due volte la causa di guasti silenziosi.
//
// E' una funzione e non una stringa perche' le prove devono poterlo
// ESEGUIRE: un comando che l'utente incolla a mano e che nessuno
// prova e' un comando che non funziona.
// Il testo da passare alla Scorciatoia: la disposizione, le opzioni
// e il titolo. In una funzione perche' le prove devono poter usare
// QUESTA e non una copia - e perche' e' l'unico canale che l'app ha
// verso lo script: il comando nella Scorciatoia e' fisso e varia solo
// il testo.
function testoPerScorciatoia(tastiera, comeEAndata, titolo) {
  // PROVATO E TOLTO, 29/09/2026: qui passava " --carica=2" quando
  // l'app era GIA' APERTA, per risparmiare i quattordici secondi di
  // attesa che in quel caso sembravano sprecati. Sulla TV vera NON E'
  // PARTITO, e si e' scelto di tornare all'attesa piena.
  //
  // Perche' non riproporlo alla leggera: "gia aperta" secondo
  // SmartThings non vuol dire "pronta a ricevere tasti". Il
  // tvChannelName dice quale app e' in primo piano, non se ha finito
  // di disegnare - e i primi tasti persi sono stati uno dei difetti
  // piu' fastidiosi di tutta la serata.
  //
  // comeEAndata resta nella firma perche' lancia() lo calcola
  // comunque e le prove lo fissano: se un giorno si trova un modo di
  // sapere che l'app e' davvero pronta, il posto e' questo.
  return tastiera + " " + titolo;
}

function comandoScorciatoia(titolo) {
  // Tutto passa come ARGOMENTI, non nell'ambiente: a-Shell non e' una
  // shell completa e il prefisso VAR=valore davanti al comando non lo
  // interpreta.
  //
  // --nome perche' il token della TV e' legato al nome con cui ci si
  // presenta, e il Mac si chiama TVProject: senza un nome proprio i
  // due si rubano il permesso e la TV lo richiede ogni volta.
  //
  // --token perche' sul telefono non c'e' nessun file dove tenerlo, e
  // cercarlo nelle cartelle non funziona: la Scorciatoia parte da un
  // posto diverso dalla finestra interattiva di a-Shell.
  return 'python3 -c "import urllib.request as u;' +
         "exec(u.urlopen('" + POSIZIONE_SCRIPT + "').read())\"" +
         " --nome=" + chiavi.tvnome +
         (chiavi.tvtoken ? " --token=" + chiavi.tvtoken : "") +
         ' --apri "' + titolo + '"';
}

// Un indirizzo di rete ha una forma. Dirlo subito vale piu' che
// scoprirlo quando lo script non trova niente: «non arrivo a
// 1921680121» non fa capire che il difetto e' nel numero.
function indirizzoBuono(ip) {
  const pezzi = String(ip).split(".");
  return pezzi.length === 4 && pezzi.every(
    p => /^[0-9]{1,3}$/.test(p) && Number(p) <= 255);
}

// Il comando per la Scorciatoia del Fire Stick. Stessa forma di
// quello Samsung - niente percorsi, lo script si scarica al volo -
// ma altro script e altre opzioni.
//
// --ip perche' l'ADB parla con un indirizzo, non con un nome: il
// Fire TV non si annuncia da nessuna parte che una Scorciatoia possa
// interrogare.
// Il SEME resta quello di default dentro lo script: e' quello che
// decide la chiave, e cambiarlo vorrebbe dire riautorizzare il
// dispositivo sul popup del Fire TV.
// Il comando da incollare NON contiene NIENTE di variabile: ne' il
// comando (--cerca), ne' l'indirizzo. Tutto arriva nel testo.
//
// PERCHE', ed e' costato un pomeriggio: prima l'indirizzo stava qui
// dentro. Chi ha incollato il comando nella Scorciatoia PRIMA di
// salvare l'indirizzo si e' ritrovato una Scorciatoia senza --ip=, e
// lo script diceva «mi serve l'indirizzo del Fire TV» mentre
// l'indirizzo nell'app c'era. Un comando che dipende da un'altra
// impostazione va ri-incollato ogni volta che quella cambia, e
// nessuno si ricorda di farlo.
// Adesso il comando e' fisso per sempre e l'app e' l'unica fonte
// dell'indirizzo.
function comandoScorciatoiaFire() {
  return 'python3 -c "import urllib.request as u;' +
         "exec(u.urlopen('" + POSIZIONE_FIRE + "').read())\"" +
         ' "TITOLO"';
}

// Il testo da passare alla Scorciatoia del Fire Stick: la fermata e
// il titolo. La fermata viaggia qui e non nel comando incollato,
// perche' si cambia dalle Opzioni e il comando lo si incolla una
// volta sola.
// Tutto quello che varia viaggia nel testo: l'indirizzo, la fermata,
// il comando e il suo argomento. In un posto solo, cosi' non si puo'
// dimenticare l'indirizzo in una strada e non nell'altra.
function testoFire(coda) {
  return (chiavi.fireip ? "--ip=" + chiavi.fireip + " " : "") + coda;
}

function testoPerScorciatoiaFire(titolo, fino) {
  const f = fino || "risultati";
  return testoFire((f === "risultati" ? "" : "--fino=" + f + " ") +
                   "--cerca " + titolo);
}

// Una fila di tasti, tutti in un viaggio. E' il punto: un viaggio per
// tasto vorrebbe dire tre secondi a freccia - la generazione della
// chiave da sola ne vale uno e mezzo - e nessuno naviga un menu
// cosi'. La schermata non li offre piu' (vedi bloccoFireComandi), ma
// da riga di comando servono.
function testoTastiFire(elenco) {
  return testoFire("--tasti " + elenco.join(" "));
}

function testoTastoFire(tasto) {
  return testoFire("--tasto " + tasto);
}

const NOMI_PACCHETTO = {
  "org.tizen.netflix-app": "Netflix",
  "org.tizen.primevideo": "Prime Video",
  "MCmYXNxgcu.DisneyPlus": "Disney+",
  "jcz0WrZYdy.NOWTV": "NOW",
  "5b8c3eb16b.BeamCTVDev": "HBO Max",
  "g3zzYA7yO8.InfinityNew": "Mediaset Infinity",
  "9Ur5IzDKqV.TizenYouTube": "YouTube",
  "org.tizen.browser": "Browser",
};

// Per le app che non conosco, un nome leggibile invece della stringa
// grezza: org.tizen.qualcosa-app -> Qualcosa, xYz123.NomeApp -> NomeApp
function nomeApp(pacchetto) {
  if (!pacchetto) return "";
  if (NOMI_PACCHETTO[pacchetto]) return NOMI_PACCHETTO[pacchetto];
  const perMappa = Object.values(MAPPA).find(m => m.app === pacchetto);
  if (perMappa && perMappa.nome) return perMappa.nome;
  let n = String(pacchetto);
  n = n.replace(/^org\.tizen\./, "").replace(/^[A-Za-z0-9]{8,}\./, "");
  n = n.replace(/-app$/, "").replace(/[-_.]+/g, " ").trim();
  return n ? n.charAt(0).toUpperCase() + n.slice(1) : pacchetto;
}

// App che hanno un id verificato sulla TV ma non sono "provider" per
// TMDB, quindi non comparirebbero mai da nessuna parte nell'app.
// Gli id sono stati verificati sulla TV una per una, leggendo
// tvChannelName con l'app aperta.
const APP_EXTRA = [

const ORDINI = [

// with_runtime funziona su film E serie (verificato). Per le serie il

const DURATE = {

};

// Il pescaggio scegliendo una pagina fra 500 ignora l'ordinamento:
// se ordini per voto e poi peschi dalla pagina 400, prendi comunque
// roba mediocre. Quindi la preferenza restringe anche la PROFONDITA'.
const PREFERENZE = [
  { n: "Popolari",   ordine: "popularity.desc",   pagine: 25 },
  { n: "Voto alto",  ordine: "vote_average.desc", pagine: 10 },

const DECENNI = [
  { n: "Tutti", da: "", a: "" },
  { n: "2020 →", da: "2020-01-01", a: "" },
  { n: "2010-19", da: "2010-01-01", a: "2019-12-31" },

// incollato con la coda «/rest/v1» diventa «.../rest/v1/rest/v1/voci»:
// la tabella non si trova, e il messaggio dice «non trovo la tabella»
// mentre la tabella c'e'. E' successo davvero.
function pulisciUrlSupa(v) {
  return String(v || "")
    .trim().replace(/\s+/g, "")
    .replace(/\/+$/, "")
    .replace(/\/rest(\/v1)?$/i, "")

  metti(cosa, tipo, id, quando) {

                  ...this.tutto.filter(x => x.k !== k)];

    this.tutto = this.tutto.filter(x => x.k !== k);
  },
};

// Indirizzi interni: ogni scheda ha il suo, cosi' si puo' mandare.
//   #/film/27205   #/serie/1396   #/persona/525
// Li scrivo con replaceState e non toccando location.hash, perche'
// location.hash farebbe scattare hashchange e ridisegnerebbe la
// schermata che l'ha appena scritto.
const A_PAROLA = { movie: "film", tv: "serie" };
const A_TIPO = { film: "movie", serie: "tv" };

function indirizzoDi(tipo, id) {
  return location.origin + location.pathname +
         "#/" + (A_PAROLA[tipo] || "film") + "/" + id;
}

function leggiIndirizzo() {
  const m = (location.hash || "").match(/^#\/(film|serie|persona)\/(\d+)$/);
  if (m) return { cosa: m[1], id: Number(m[2]) };
  // liste condivise: #/lista/m27205,t1396  e  #/visti/m155:5,t1396:4
  const l = (location.hash || "").match(/^#\/(lista|visti)\/([mt0-9,:]+)$/);
  if (l) return { cosa: l[1], voci: decodificaVoci(l[2]) };
  // un telefono nuovo da preparare: #/telefono/<dati>
  const t = (location.hash || "").match(/^#\/telefono\/([A-Za-z0-9_-]+)$/);
  if (t) {
    const dati = leggiAltroTelefono(t[1]);
    if (dati) return { cosa: "telefono", dati };
  }
  return null;
}

// Una lista in un indirizzo: solo tipo e numero, piu' il voto per i
// visti. Non ci metto titoli e locandine, che si recuperano da TMDB:
// un indirizzo con trenta titoli dentro diventerebbe illeggibile.
function codificaVoci(voci, conVoto) {
  return voci
    .map(v => (v.tipo === "tv" ? "t" : "m") + v.id + (conVoto && v.mio ? ":" + v.mio : ""))
    .join(",");
}

function decodificaVoci(testo) {
  return (testo || "").split(",").map(p => {
    const m = p.match(/^([mt])(\d+)(?::([1-5]))?$/);
    if (!m) return null;
    return { tipo: m[1] === "t" ? "tv" : "movie", id: Number(m[2]),
             mio: m[3] ? Number(m[3]) : 0 };
  }).filter(Boolean);
}

function scriviIndirizzo(cosa, id) {
  const nuovo = "#/" + cosa + "/" + id;
  if (location.hash !== nuovo) history.replaceState(null, "", nuovo);
}

function pulisciIndirizzo() {
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
}

// navigator.share e navigator.clipboard vogliono un contesto sicuro:
// su GitHub Pages (https) ci sono, sull'indirizzo locale in http no.
// Percio' tre livelli, non uno.
async function condividi(titolo, url, dove) {
  try {
    if (navigator.share) { await navigator.share({ title: titolo, url }); return "condiviso"; }
  } catch (e) {
    if (e && e.name === "AbortError") return "annullato";
  }
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(url);
      return "copiato";
    }
  } catch (e) { /* si ripiega sotto */ }
  if (dove) {
    const campo = el("input", "indirizzo");
    campo.value = url;
    campo.readOnly = true;
    dove.appendChild(campo);
    campo.focus();
    campo.setSelectionRange(0, url.length);
    return "mostrato";
  }
  return "niente";
}
