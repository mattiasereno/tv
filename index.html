      chi.appendChild(ripesca);
      f.appendChild(loc);
      f.appendChild(chi);
      zona.appendChild(f);
    });
  };
  disegna();
}
// La schermata che accoglie un telefono nuovo. NON scrive niente da
// sola: fa vedere cosa metterebbe e aspetta un tocco. Aprire un link
// e trovarsi le impostazioni cambiate sarebbe una sorpresa, e su un
// telefono che era gia' configurato sarebbe un danno.
async function schermoAltroTelefono(dati) {
  window.scrollTo(0, 0);
  schermo.innerHTML = "";
  const pad = el("div", "pad");
  pad.appendChild(el("h1", "titolone", "Preparo questo telefono"));
  schermo.appendChild(pad);

  const cosaFa = [
    ["Chiave TMDB", dati.tmdb ? "s\u00ec" : "manca"],
    ["Abbonamenti", dati.servizi.length
      ? dati.servizi.map(nomeProvider).join(", ") : "nessuno"],
    ["Famiglia", dati.famiglia || "nessuna"],
  ];
  const d = el("div", "diagnosi");
  d.innerHTML = cosaFa.map(([k, v2]) =>
    "<div><span>" + esc(k) + "</span><span>" + esc(v2) + "</span></div>")
    .join("");
  pad.appendChild(d);

  const gia = chiavi.tmdb || chiavi.famiglia;
  pad.appendChild(el("p", "nota", gia
    ? "Attenzione: su questo telefono c\u2019\u00e8 gi\u00e0 una " +
      "configurazione, e queste impostazioni la sostituiscono. I titoli " +
      "e i voti non si toccano."
    : "Manca solo il tuo nome: serve perch\u00e9 i voti restano di chi li " +
      "d\u00e0, e due telefoni con lo stesso nome se li sovrascrivono."));

  const campo = el("div", "campo");
  campo.innerHTML = '<label for="mionome">Come ti chiami</label>' +
    '<textarea id="mionome" rows="1" autocapitalize="words" ' +
    'autocomplete="off" spellcheck="false"></textarea>';
  pad.appendChild(campo);
  document.getElementById("mionome").value = chiavi.io;

  const esito = el("p", "nota");
  const via = el("button", "primario", "Metti queste impostazioni");
  via.style.cssText = "width:100%;margin:8px 0 0";
  via.onclick = async () => {
    const nome = document.getElementById("mionome").value.trim();
    if (!nome) {
      esito.textContent = "Scrivi il tuo nome, poi riprova.";
      return;
    }
    via.disabled = true;
    via.textContent = "Metto\u2026";
    if (dati.tmdb) chiavi.tmdb = dati.tmdb;
    if (dati.servizi.length) chiavi.servizi = dati.servizi;
    if (dati.supaUrl) chiavi.supaUrl = dati.supaUrl;
    if (dati.supaChiave) chiavi.supaChiave = dati.supaChiave;
    if (dati.famiglia) chiavi.famiglia = dati.famiglia;
    chiavi.io = nome;
    // la strada: su un telefono nuovo si parte dalla TV, che e' quella
    // che funziona senza installare niente
    chiavi.strada = "tv";
    pulisciIndirizzo();
    try {
      if (nuvola.pronta) {
        esito.textContent = "Prendo liste e voti di casa\u2026";
        const r = await scambia();
        esito.textContent = "Presi " + r.presi + " pezzi di casa.";
      }
    } catch (e) {
      esito.textContent = "Impostazioni messe, ma la famiglia non risponde: " +
        e.message;
      registro.aggiungi("famiglia", e.message);
    }
    setTimeout(() => vai(chiavi.tmdb ? "sfoglia" : "impostazioni"), 900);
  };
  pad.appendChild(via);
  pad.appendChild(esito);

  pad.appendChild(comeSiFa(
    "Questo telefono pu\u00f2 fare tutto: dire cosa paghi gi\u00e0, " +
    "cercare, la lista, i voti, «Stasera», e <b>aprire le app sulla " +
    "TV</b> dal <b>Telecomando</b> \u2014 quello passa dal cloud e " +
    "non serve installare niente.<br><br>" +
    "L\u2019unica cosa che NON fa \u00e8 <b>scrivere il titolo dentro " +
    "l\u2019app della TV</b>: per quella serve a-Shell e una Scorciatoia, " +
    "e sono cose da mettere solo sul telefono che le usa.",
    "Cosa fa e cosa non fa questo telefono"));

  const no = el("button", "altri", "No, lascia com\u2019\u00e8");
  no.style.cssText = "width:100%;margin:6px 0 0";
  no.onclick = () => { pulisciIndirizzo(); vai(chiavi.tmdb ? "sfoglia" : "impostazioni"); };
  pad.appendChild(no);
}

async function schermoPrendi(quale, voci) {
  window.scrollTo(0, 0);
  if (!voci.length) return vuoto("Questo indirizzo non contiene nessun titolo.");
  girello();

  const pieni = (await Promise.all(voci.slice(0, 60).map(async v => {
    try {
      const d = await tmdb("/" + v.tipo + "/" + v.id,
                           { language: LINGUA, append_to_response: "keywords" });
      return {
        tipo: v.tipo, id: v.id, mio: v.mio,
        titolo: d.title || d.name || "?",
        anno: (d.release_date || d.first_air_date || "").slice(0, 4),
        voto: d.vote_average || 0,
        locandina: d.poster_path,
        generiId: (d.genres || []).map(g => String(g.id)),
        keyword: (((d.keywords || {}).keywords) || ((d.keywords || {}).results) || [])
          .slice(0, 3).map(k => String(k.id)),
      };
    } catch (e) { return null; }
  }))).filter(Boolean);

  schermo.innerHTML = "";
  const su = el("button", "indietro", "← Chiudi");
  su.onclick = () => vai("lista");
  schermo.appendChild(su);

  const pad = el("div", "pad");
  pad.appendChild(el("h1", "titolone",
    quale === "visti" ? "Titoli votati" : "Titoli da guardare"));
  schermo.appendChild(pad);

  if (!pieni.length) return void pad.appendChild(el("p", "nota",
    "Non riesco a recuperare nessuno di questi titoli."));

  const gia = pieni.filter(v => quale === "visti"
    ? visti.voto(v.tipo, v.id) : lista.ha(v.tipo, v.id)).length;
  const p = el("div", "gusto");
  p.innerHTML = "Ti hanno mandato <b>" + pieni.length +
    (pieni.length === 1 ? " titolo" : " titoli") + "</b>." +
    (gia ? " " + gia + " ce li hai già: non li duplico." : "");
  schermo.appendChild(p);

  const b = el("button", "primario", "Aggiungi ai miei");
  b.style.cssText = "width:calc(100% - 32px);margin:14px 16px 0";
  b.onclick = () => {
    pieni.forEach(v => {
      if (quale === "visti") visti.segna(v, v.mio || 3);
      else lista.aggiungi(v);
    });
    b.disabled = true;
    b.textContent = "Aggiunti";
    if (quale === "visti") vistaLista = "visti";
    setTimeout(() => vai("lista"), 900);
  };
  schermo.appendChild(b);

  schermo.appendChild(grigliaDi(pieni, quale === "visti"));
}

function schermoTelecomando() {
  schermo.innerHTML = "";
  const pad = el("div", "pad");
  pad.appendChild(el("h1", "titolone", "Telecomando"));
  schermo.appendChild(pad);

  const barra = el("div", "stato");
  barra.innerHTML = '<span class="pallina"></span><span class="quale">Leggo lo stato…</span>';

  // In modo Fire Stick il Fire Stick viene PRIMA - e' il motivo per
  // cui sei in questo modo - e la TV Samsung sta sotto, con un titolo
  // suo. Prima l'allarme SmartThings galleggiava in cima e sembrava
  // che tutto fosse rotto, mentre il telecomando del Fire Stick non
  // ha bisogno di SmartThings: sono due apparecchi, in due stanze.
  if (chiavi.strada === "fire") {
    const corpoFire = el("div", "telecomando");
    schermo.appendChild(corpoFire);
    bloccoFireComandi(corpoFire);
    const t = el("div", "pad");
    t.style.cssText = "padding-top:0";
    t.appendChild(el("p", "sezione", "La TV in salotto"));
    t.appendChild(el("p", "nota",
      "Volume, accensione e ingressi della TV Samsung — un altro " +
      "apparecchio, un’altra stanza."));
    t.appendChild(barra);              // lo stato appartiene a questa sezione
    schermo.appendChild(t);
  } else {
    pad.appendChild(barra);            // in modo TV lo stato sta in cima
  }

  const corpoTel = el("div", "telecomando");
  schermo.appendChild(corpoTel);

  let avviso_attivo = null;
  function lamenta(testo) {
    if (avviso_attivo) clearTimeout(avviso_attivo);
    const q = barra.querySelector(".quale");
    q.textContent = testo;
    barra.querySelector(".pallina").className = "pallina morta";
    avviso_attivo = setTimeout(aggiorna, 2600);
  }

  // Ogni tasto e' una POST: ottimista, ma se fallisce lo dice.
  function tasto(etichetta, icona, azione, classe = "", nome = "") {
    const b = el("button", "tasto " + classe);
    b.innerHTML = (icona || "") + (etichetta ? "<span>" + etichetta + "</span>" : "");
    // I tasti del lettore hanno solo l'icona: senza questo, per chi
    // usa VoiceOver sono cinque «pulsante» identici.
    if (!etichetta && nome) b.setAttribute("aria-label", nome);
    b.onclick = async () => {
      b.classList.add("acceso");
      setTimeout(() => b.classList.remove("acceso"), 170);
      try { await azione(); } catch (e) { lamenta(e.message); }
    };
    return b;
  }
  const key = v => () => comando("samsungvd.remoteControl", "send", [v, "PRESS_AND_RELEASED"]);

  // Tasto tenuto premuto = ripetizione. Uso PRESS_AND_RELEASED
  // ripetuto e non PRESSED+RELEASED per due motivi: e' l'unica forma
  // verificata su questa TV, e soprattutto non puo' lasciare un tasto
  // incastrato se il rilascio non arriva mai (app in background,
  // rete che cade, dito che esce dal pulsante).
  const ATTESA_PRIMA = 450, OGNI = 320;
  function ripetibile(b, valore) {
    let ritardo = null, battito = null;
    const manda = () => comando("samsungvd.remoteControl", "send",
                                [valore, "PRESS_AND_RELEASED"]).catch(e => {
      ferma();
      lamenta(e.message);
    });
    const ferma = () => {
      clearTimeout(ritardo); clearInterval(battito);
      ritardo = battito = null;
      b.classList.remove("acceso");
    };
    b.addEventListener("pointerdown", e => {
      if (e.button) return;
      // setPointerCapture solleva NotFoundError se il pointerId non e'
      // attivo, e stando prima dell'invio lascerebbe il pulsante
      // inerte in silenzio. La cattura serve solo a non perdere gli
      // eventi se il dito scivola: se non si puo' avere, pazienza.
      try { b.setPointerCapture(e.pointerId); } catch (err) { /* pazienza */ }
      b.classList.add("acceso");
      manda();
      ritardo = setTimeout(() => { battito = setInterval(manda, OGNI); }, ATTESA_PRIMA);
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(ev =>
      b.addEventListener(ev, ferma));
    // se l'app va in background mentre tieni premuto
    document.addEventListener("visibilitychange", () => { if (document.hidden) ferma(); });
    return b;
  }

  function fila(...tasti) {
    const f = el("div", "fila");
    tasti.forEach(t => f.appendChild(t));
    return f;
  }

  // ------------------------------------------------------------- croce
  // Le direzioni si ripetono se le tieni premute; OK no, sarebbe un
  // modo di premere invio venti volte per sbaglio.
  const direzione = (icona, valore, classe) => {
    const b = el("button", "tasto " + classe);
    b.innerHTML = icona;
    b.setAttribute("aria-label", valore);
    return ripetibile(b, valore);
  };
  const croce = el("div", "croce");
  croce.appendChild(direzione(ICONE.su, "UP", "su"));
  croce.appendChild(direzione(ICONE.sx, "LEFT", "sx"));
  croce.appendChild(tasto("OK", "", key("OK"), "ok"));
  croce.appendChild(direzione(ICONE.dx, "RIGHT", "dx"));
  croce.appendChild(direzione(ICONE.giu, "DOWN", "giu"));
  corpoTel.appendChild(croce);

  corpoTel.appendChild(fila(
    tasto("Indietro", ICONE.back, key("BACK")),
    tasto("Home", ICONE.home, key("HOME")),
    tasto("Menu", ICONE.menu, key("MENU")),
  ));
  corpoTel.appendChild(fila(
    tasto("Esci", ICONE.exit, key("EXIT")),
    tasto("Sorgente", ICONE.fonte, key("SOURCE")),
    tasto("Muto", ICONE.muto, () => comando("audioMute", "mute")),
  ));

  // ------------------------------------------------- scorciatoie
  // I pulsanti di lancio esistevano solo dentro la scheda di un
  // titolo: per aprire Netflix e sfogliare da li' non c'era modo.
  corpoTel.appendChild(el("p", "sezione", "Apri un'app"));
  const zonaScorciatoie = el("div", "scorciatoie");
  corpoTel.appendChild(zonaScorciatoie);

  const daAprire = [
    ...chiavi.servizi
      .map(pid => ({ pid, ...(MAPPA[pid] || {}) }))
      .filter(x => x.app)
      .map(x => ({ nome: x.nome || nomeProvider(x.pid), app: x.app, logo: logoProvider(x.pid) })),
    ...APP_EXTRA,
  ];
  // lo stesso id due volte (Mediaset Infinity e Infinity+) sarebbe
  // due pulsanti identici
  const vistiApp = new Set();
  daAprire.filter(x => !vistiApp.has(x.app) && vistiApp.add(x.app)).forEach(x => {
    const b = el("button", "scorciatoia");
    b.innerHTML = (x.logo ? '<img src="' + IMG + "/w92" + x.logo +
        '" alt="" onerror="this.style.display=\'none\'">' : "") +
      "<span>" + esc(x.nome) + "</span>";
    b.onclick = async () => {
      b.disabled = true;
      const etichetta = b.querySelector("span");
      const prima = etichetta.textContent;
      etichetta.textContent = "Apro…";
      try {
        if (await lancia(x.app, x.nome)) {
          b.classList.add("acceso");
          etichetta.textContent = "Aperta";
          setTimeout(() => { b.classList.remove("acceso"); etichetta.textContent = prima; }, 2500);
          aggiorna();
        } else {
          etichetta.textContent = prima;
          lamenta("Comando partito, ma la TV non ha confermato. Guarda lo schermo.");
        }
      } catch (e) { etichetta.textContent = prima; lamenta(e.message); }
      b.disabled = false;
    };
    zonaScorciatoie.appendChild(b);
  });

  if (!zonaScorciatoie.children.length)
    corpoTel.appendChild(el("div", "avvisoPonte",
      "Scegli gli abbonamenti in Opzioni e qui compaiono le scorciatoie."));

  corpoTel.appendChild(el("p", "sezione", "Volume"));
  const volume = (icona, etichetta, cmd) => {
    const b = el("button", "tasto");
    b.innerHTML = icona + "<span>" + etichetta + "</span>";
    let ritardo = null, battito = null;
    const manda = () => comando("audioVolume", cmd).catch(e => { ferma(); lamenta(e.message); });
    const ferma = () => { clearTimeout(ritardo); clearInterval(battito); b.classList.remove("acceso"); };
    b.addEventListener("pointerdown", e => {
      if (e.button) return;
      // setPointerCapture solleva NotFoundError se il pointerId non e'
      // attivo, e stando prima dell'invio lascerebbe il pulsante
      // inerte in silenzio. La cattura serve solo a non perdere gli
      // eventi se il dito scivola: se non si puo' avere, pazienza.
      try { b.setPointerCapture(e.pointerId); } catch (err) { /* pazienza */ }
      b.classList.add("acceso");
      manda();
      ritardo = setTimeout(() => { battito = setInterval(manda, OGNI); }, ATTESA_PRIMA);
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(ev => b.addEventListener(ev, ferma));
    document.addEventListener("visibilitychange", () => { if (document.hidden) ferma(); });
    return b;
  };
  corpoTel.appendChild(fila(
    volume(ICONE.meno, "Giù", "volumeDown"),
    volume(ICONE.piu, "Su", "volumeUp"),
  ));

  corpoTel.appendChild(el("p", "sezione", "Riproduzione"));
  corpoTel.appendChild(fila(
    tasto("", ICONE.indre, key("REWIND"), "", "Riavvolgi"),
    tasto("", ICONE.play, key("PLAY"), "", "Riproduci"),
    tasto("", ICONE.pausa, key("PAUSE"), "", "Pausa"),
    tasto("", ICONE.stop, key("STOP"), "", "Stop"),
    tasto("", ICONE.avan, key("FF"), "", "Avanti veloce"),
  ));

  // ---------------------------------------------------------- tastiera
  corpoTel.appendChild(el("p", "sezione", "Scrivi sulla TV"));
  const zonaTastiera = el("div", "tastiera");
  corpoTel.appendChild(zonaTastiera);

  // Il testo passa SOLO dalla Scorciatoia iOS: SmartThings non ha
  // nessun comando per il testo, e una pagina https non puo' aprire un
  // WebSocket verso la TV (il suo certificato vale solo per se
  // stessa). Il ponte via server locale c'era e non c'e' piu': faceva
  // le stesse cose e andava tenuto allineato a mano.
  if (chiavi.scorciatoia) {
    const riga = el("div", "campo2");
    const campo = el("input");
    campo.type = "text";
    campo.placeholder = "Testo da scrivere sulla TV";
    campo.autocomplete = "off";
    campo.enterKeyHint = "send";
    const manda = el("button", "manda", "Invia");
    const invia = () => {
      if (!campo.value.trim()) return campo.focus();
      scriviConScorciatoia(campo.value);
    };
    manda.onclick = invia;
    campo.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); invia(); } };
    riga.appendChild(campo);
    riga.appendChild(manda);
    zonaTastiera.appendChild(riga);
    zonaTastiera.appendChild(el("div", "avvisoPonte",
      "Passa dalla Scorciatoia «" + esc(chiavi.scorciatoia) + "», " +
      "quindi funziona solo in casa. Metti a fuoco il campo di ricerca " +
      "sulla TV prima di inviare."));
  } else {
    zonaTastiera.appendChild(el("div", "avvisoPonte",
      "Non disponibile da qui. Serve una Scorciatoia iOS: si configura " +
      "in Opzioni, e da lì il telefono stesso fa da ponte verso la TV."));
  }


  corpoTel.appendChild(el("p", "sezione", "Accensione"));
  const accensione = el("div", "fila");
  corpoTel.appendChild(accensione);

  const zonaIngressi = el("div");
  corpoTel.appendChild(zonaIngressi);

  const zonaModi = el("div");
  corpoTel.appendChild(zonaModi);

  // ------------------------------------------------------------ stato
  async function aggiorna() {
    try {
      const st = await statoTv();
      barra.querySelector(".pallina").className = "pallina " + (st.accesa ? "viva" : "");
      const nome = nomeApp(st.app);
      barra.querySelector(".quale").textContent = st.accesa
        ? (nome ? "Accesa · " + nome : "Accesa")
        : "Spenta";

      accensione.innerHTML = "";
      accensione.appendChild(tasto(
        st.accesa ? "Spegni" : "Accendi", ICONE.acceso,
        async () => { await comando("switch", st.accesa ? "off" : "on"); setTimeout(aggiorna, 2500); },
        st.accesa ? "" : "acceso"));

      zonaModi.innerHTML = "";
      const modi = (titolo, voci, attuale, capacita, cmd, quale) => {
        if (!voci.length) return;
        zonaModi.appendChild(el("p", "sezione", titolo));
        const sc = el("div", "scelte");
        voci.forEach(v => {
          const b = el("button", "chip", esc(v.name || v.id));
          b.setAttribute("aria-pressed", String(v.name === attuale || v.id === attuale));
          b.onclick = async () => {
            sc.querySelectorAll(".chip").forEach(x => { x.disabled = true; });
            try {
              const esito = await impostaModo(capacita,
                m => comando(capacita, cmd, [m]), quale, v);
              if (esito !== v.name && esito !== v.id)
                lamenta("La TV non ha cambiato " + titolo.toLowerCase() + ".");
            } catch (e) { lamenta(e.message); }
            aggiorna();
          };
          sc.appendChild(b);
        });
        zonaModi.appendChild(sc);
      };
      modi("Immagine", st.immagini, st.immagine,
           "custom.picturemode", "setPictureMode", "immagine");
      modi("Suono", st.suoni, st.suono,
           "custom.soundmode", "setSoundMode", "suono");

      zonaIngressi.innerHTML = "";
      if (st.ingressi.length) {
        zonaIngressi.appendChild(el("p", "sezione", "Ingressi"));
        const sc = el("div", "scelte");
        st.ingressi.forEach(i => {
          const b = el("button", "chip", esc(i.name || i.id));
          b.setAttribute("aria-pressed", String(i.id === st.ingresso));
          b.onclick = async () => {
            try {
              await comando("samsungvd.mediaInputSource", "setInputSource", [i.id]);
              setTimeout(aggiorna, 2500);
            } catch (e) { lamenta(e.message); }
          };
          sc.appendChild(b);
        });
        zonaIngressi.appendChild(sc);

      }
    } catch (e) {
      barra.querySelector(".pallina").className = "pallina morta";
      barra.querySelector(".quale").textContent = e.message;
    }
  }

  const ricarica = el("button", null, "Aggiorna");
  ricarica.onclick = aggiorna;
  barra.appendChild(ricarica);
  aggiorna();
}

function bloccoAbbonamenti(pad) {
  pad.appendChild(el("p", "sezione", "I tuoi abbonamenti"));
  const spiega = el("p", "nota",
    "Tocca per aggiungere o togliere. Il verdetto «Lo paghi già» dipende " +
    "solo da questa lista: una voce di troppo non dà errore, dà una risposta sbagliata.");
  spiega.style.margin = "0 0 4px";
  pad.appendChild(spiega);

  const scelti = el("div", "servizi");
  pad.appendChild(scelti);

  const cerca = el("input", "cerca-servizio");
  cerca.type = "search";
  cerca.placeholder = "Aggiungi un servizio";
  cerca.autocomplete = "off";
  cerca.setAttribute("aria-label", "Cerca un servizio da aggiungere");
  pad.appendChild(cerca);

  const altri = el("div", "servizi");
  pad.appendChild(altri);

  function riquadro(pid, attivo) {
    const b = el("button", "servizio");
    b.setAttribute("aria-pressed", String(attivo));
    const logo = logoProvider(pid);
    const lanciabile = (MAPPA[pid] || {}).app;
    b.innerHTML =
      // se il logo non si carica sparisce, invece di lasciare
      // l'icona di immagine rotta
      (logo ? '<img src="' + IMG + "/w92" + logo +
              '" alt="" onerror="this.style.display=\'none\'">'
            : "") +
      "<span>" + esc(nomeProvider(pid)) + "</span>" +
      (attivo && !lanciabile
        ? '<span class="senzaApp">non la apro sulla TV</span>' : "");
    b.onclick = () => {
      const ora = chiavi.servizi;
      chiavi.servizi = attivo ? ora.filter(x => x !== pid) : [...ora, pid];
      cerca.value = "";
      disegna();
    };
    return b;
  }

  function disegna() {
    const miei = chiavi.servizi;
    scelti.innerHTML = "";
    if (!miei.length) {
      const p = el("p", "nota", "Nessun servizio selezionato: senza almeno uno non posso dirti niente.");
      p.style.margin = "4px 0 0";
      scelti.appendChild(p);
    }
    miei.forEach(pid => scelti.appendChild(riquadro(pid, true)));

    const filtro = cerca.value.trim().toLowerCase();
    altri.innerHTML = "";
    if (!filtro) return;
    Object.keys(PROVIDER)
      .filter(pid => !miei.includes(pid) &&
                     nomeProvider(pid).toLowerCase().includes(filtro))
      .sort((a, b) => PROVIDER[a].pri - PROVIDER[b].pri)
      .slice(0, 12)
      .forEach(pid => altri.appendChild(riquadro(pid, false)));
    if (!altri.children.length)
      altri.appendChild(el("p", "nota", "Nessun servizio con questo nome."));
  }

  cerca.oninput = disegna;
  disegna();

  // La lista completa arriva da TMDB: se non c'e' ancora, i nomi
  // vengono dalla mappa delle app e la ricerca non trova nulla.
  if (!Object.keys(PROVIDER).length && chiavi.tmdb)
    caricaProvider().then(disegna).catch(() => {});
}

// Mostrato una volta al ritorno dall autorizzazione.
let esitoCollegamento = null;

function bloccoCollegamento(pad) {
  pad.appendChild(el("p", "sottosezione", "Collegamento"));

  if (esitoCollegamento) {
    const m = {
      collegato: "Collegato. Da ora il permesso si rinnova da solo.",
      negato: "Hai negato l'autorizzazione.",
      altraFinestra: "Il collegamento era partito da un'altra finestra, " +
        "quindi non posso completarlo qui. Su iPhone succede se lo avvii " +
        "dall'app installata: fallo da Safari, poi copia il collegamento " +
        "e incollalo qui.",
      sospetto: "Lo state non combacia: rifalla da capo, per sicurezza.",
      fallito: "Non sono riuscito a completare: " + (esitoCollegamento.errore || ""),
    }[esitoCollegamento.esito] || "Esito sconosciuto.";
    const e = el("div", "gusto");
    e.textContent = m;
    pad.appendChild(e);
    esitoCollegamento = null;
  }

  const stato = el("div", "diagnosi");
  pad.appendChild(stato);
  const riga = (cosa, valore, buono) => {
    const r = el("div", "riga2");
    r.innerHTML = "<span>" + esc(cosa) + '</span><span class="' +
      (buono === true ? "si" : buono === false ? "no" : "") + '">' +
      esc(valore) + "</span>";
    stato.appendChild(r);
  };
  if (oauth.collegato) {
    const resta = Math.max(0, Math.round((oauth.scade - Date.now()) / 60000));
    riga("Collegamento", "OAuth, non scade", true);
    riga("Permesso valido per", resta > 90 ? Math.round(resta / 60) + " ore" : resta + " min");
  } else if (chiavi.token) {
    riga("Collegamento", "token da 24 ore", false);
  } else {
    riga("Collegamento", "assente", false);
  }

  if (!oauth.collegato) {
    const spiega = el("div", "gusto");
    spiega.innerHTML = "I token semplici durano <b>24 ore</b>. Collegando " +
      "l'app con OAuth il permesso si rinnova da solo: basta aprirla una " +
      "volta al mese perché non scada mai.";
    pad.appendChild(spiega);

    // Da app installata l'autorizzazione finisce in Safari, che ha una
    // memoria separata: il collegamento non tornerebbe mai qui.
    if (dentroAppInstallata()) {
      const avvertenza = el("div", "gusto");
      avvertenza.innerHTML =
        "<b>Sei nell'app installata.</b> Qui iOS manderebbe " +
        "l'autorizzazione a Safari, che ha una memoria separata: il " +
        "collegamento resterebbe là. Fai così:<br><br>" +
        "1. apri <b>" + esc(indirizzoDiRitorno()) + "</b> in Safari<br>" +
        "2. collega da lì<br>" +
        "3. in Safari premi <b>Copia il collegamento</b><br>" +
        "4. torna qui e incollalo sotto";
      pad.appendChild(avvertenza);

      const incolla = el("div", "campo");
      incolla.innerHTML =
        '<label for="oi">Incolla il collegamento</label>' +
        '<textarea id="oi" rows="3" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>';
      pad.appendChild(incolla);

      const prendi = el("button", "primario", "Usa questo collegamento");
      const esitoIncolla = el("div", "esito");
      prendi.onclick = () => {
        if (scartaCollegamento(document.getElementById("oi").value)) {
          esitoIncolla.innerHTML = '<div class="ok">Collegato.</div>';
          setTimeout(schermoImpostazioni, 700);
        } else {
          esitoIncolla.innerHTML = '<div class="ko">Non è un collegamento valido: ' +
            'deve cominciare con TV1: e va copiato tutto.</div>';
        }
      };
      pad.appendChild(prendi);
      pad.appendChild(esitoIncolla);
    }

    if (dentroAppInstallata()) return;   // qui il pulsante non funzionerebbe

    const campi = el("div");
    campi.innerHTML =
      '<div class="campo"><label for="o1">Client ID</label>' +
      '<textarea id="o1" rows="2" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea></div>' +
      '<div class="campo"><label for="o2">Client Secret</label>' +
      '<textarea id="o2" rows="2" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>' +
      "<p>Vengono dall'app creata con collega.sh. Restano su questo telefono.</p></div>";
    pad.appendChild(campi);
    document.getElementById("o1").value = oauth.id;
    document.getElementById("o2").value = oauth.segreto;

    const parti = el("button", "primario", "Collega SmartThings");
    const avviso = el("div", "esito");
    parti.onclick = () => {
      oauth.id = document.getElementById("o1").value;
      oauth.segreto = document.getElementById("o2").value;
      if (!oauth.id || !oauth.segreto) {
        avviso.innerHTML = '<div class="ko">Servono entrambi.</div>';
        return;
      }
      avviso.innerHTML = '<div class="ok">Ti mando su Samsung...</div>';
      avviaCollegamento();
    };
    pad.appendChild(parti);
    pad.appendChild(avviso);

    const dove = el("div", "gusto");
    dove.innerHTML = "Samsung ti rimander\u00e0 a <b>" + esc(indirizzoDiRitorno()) +
      "</b>, che deve essere esattamente il redirect URI registrato " +
      "nell'app. Dall'indirizzo locale non funziona.";
    pad.appendChild(dove);
  } else {
    // Da qui si trasferisce nell'app installata, che ha una memoria
    // separata e non vedrebbe mai questo collegamento.
    const copia = el("button", "primario", "Copia il collegamento");
    const esitoCopia = el("div", "esito");
    copia.onclick = async () => {
      const pacco = impacchettaCollegamento();
      const esito = await condividi("Collegamento TV", pacco, null);
      if (esito === "copiato" || esito === "condiviso") {
        esitoCopia.innerHTML = '<div class="ok">Copiato. Incollalo ' +
          "nell'app installata, in questa stessa schermata.</div>";
      } else {
        const campo = el("textarea");
        campo.className = "indirizzo";
        campo.rows = 4;
        campo.value = pacco;
        campo.readOnly = true;
        esitoCopia.innerHTML = "";
        esitoCopia.appendChild(campo);
        campo.focus();
        campo.setSelectionRange(0, pacco.length);
      }
    };
    pad.appendChild(copia);
    pad.appendChild(esitoCopia);
    const nota = el("div", "gusto");
    nota.innerHTML = "Serve per passare il collegamento all'app " +
      "installata sulla Home, che ha una memoria separata da Safari. " +
      "Contiene le tue credenziali: <b>resta fra i tuoi dispositivi</b>.";
    pad.appendChild(nota);

    const stacca = el("button", "svuota", "Scollega");
    stacca.style.cssText = "width:100%;margin:12px 0 0";
    stacca.onclick = () => {
      if (stacca.dataset.sicuro !== "1") {
        stacca.dataset.sicuro = "1";
        stacca.textContent = "Tocca di nuovo per scollegare";
        return;
      }
      oauth.scollega();
      schermoImpostazioni();
    };
    pad.appendChild(stacca);
  }
}

/* ------------------------------------------------ OPZIONI

   Ordine per FREQUENZA, non per come e' cresciuto il codice. Era
   diventato un elenco confuso: il collegamento OAuth - la cosa piu'
   tecnica, che si tocca una volta nella vita - stava in cima, e la
   scelta della stanza, che e' un tocco e cambia cosa fa l'app, stava
   in mezzo fra i campi delle chiavi.

     1. Dove guardi        un tocco, cambia cosa fanno le schede
     2. Abbonamenti        e' quello che si cambia davvero
     3. Chiave TMDB        una volta, e senza non c'e' niente
     4. La stanza scelta   prima quella in cui sei, poi l'altra
     5. Famiglia           una volta per telefono
     6. Diagnostica        quando qualcosa non va

   E ogni spiegazione lunga sta dentro un «Come si fa» chiuso: le
   istruzioni servono la prima volta, i campi tutte le altre.       */

function schermoImpostazioni() {
  schermo.innerHTML = "";
  const pad = el("div", "pad");
  pad.appendChild(el("h1", "titolone", "Opzioni"));
  schermo.appendChild(pad);

  // Al primo avvio l'app arriva qui perche' manca la chiave, ma senza
  // dirlo sembra solo una schermata di impostazioni capitata a caso.
  // Un cappello spiega perche' sei qui e cosa cambia il gioco.
  if (!chiavi.tmdb) {
    const ben = el("div", "benvenuto");
    ben.innerHTML =
      "<b>Benvenuto.</b> Per cominciare serve una <b>chiave TMDB</b> " +
      "— è gratis, e senza l’app non sa niente di nessun " +
      "film. La metti qui sotto, in <b>Chiave TMDB</b>. Poi scegli i " +
      "tuoi abbonamenti, e sei pronto.";
    pad.appendChild(ben);
    // e quando manca la chiave, quella viene PRIMA: e' l'unica cosa
    // che blocca tutto, gli abbonamenti si sistemano dopo.
    bloccoTmdb(pad);
    bloccoStanza(pad);
    bloccoAbbonamenti(pad);
  } else {
    bloccoStanza(pad);
    bloccoAbbonamenti(pad);
    bloccoTmdb(pad);
  }

  // Prima la stanza in cui sei, APERTA. L'altra resta sotto ma
  // CHIUSA: c'e' se la cerchi, e non ti fa scorrere due schermate di
  // impostazioni di un apparecchio che in questo momento non stai
  // usando. La pagina era lunga nove schermate.
  const stanza = (nome, riempi, aperta) => {
    if (aperta) {
      pad.appendChild(el("p", "sezione", nome));
      riempi(pad);
      return;
    }
    const d = el("details", "stanzaPiegata");
    d.appendChild(el("summary", null, nome));
    const dentro = el("div");
    d.appendChild(dentro);

    // con getElementById, e fuori dal documento non li trovano

  };

  const stanze = chiavi.strada === "fire"
    ? [["Il Fire Stick in camera", bloccoFire], ["La TV in salotto", bloccoTv]]
    : [["La TV in salotto", bloccoTv], ["Il Fire Stick in camera", bloccoFire]];
  stanze.forEach(([nome, riempi], i) => stanza(nome, riempi, i === 0));

  bloccoFamiglia(pad);

}

// Le cose che si fanno UNA VOLTA: aperte finche' non sono fatte,
// chiuse quando lo sono. CHIUSE e non nascoste: se una si rompe la
// si riapre, e si vede il segno di spunta invece di dover ricordare
// se l'avevi fatta.
//
// Meta' di questa schermata era cosi': il comando da incollare nella
// Scorciatoia, il token della TV, l'SQL di Supabase. Roba di cinque
// minuti in tutta la vita, che stava aperta per sempre.
function unaVoltaSola(pad, titolo, fatto, riempi) {
  const d = el("details", "unavolta");
  if (!fatto) d.setAttribute("open", "");
  d.appendChild(el("summary", null,
    (fatto ? "\u2713 " : "") + titolo));
  const dentro = el("div");
  d.appendChild(dentro);
  // attaccato PRIMA di riempirlo: i blocchi cercano i loro campi con
  // getElementById, e fuori dal documento non li trovano
  pad.appendChild(d);
  riempi(dentro);
}

// Un pieghevole per le istruzioni. <details> e non un pulsante mio:
// lo apre e chiude il browser, si ricorda da se' com'era, e funziona
// anche se il resto del codice si rompe.
function comeSiFa(testo, titolo) {
  const d = el("details", "comesifa");
  d.innerHTML = "<summary>" + esc(titolo || "Come si fa") +
    "</summary><div>" + testo + "</div>";
  return d;
}

/* TOLTO, 30/09/2026 - e vale la pena sapere perche'.

   Qui c'era un telecomando per il Fire Stick: i tasti si accodavano e
   partivano insieme con --tasti, per non pagare un viaggio per
   freccia. Chi la usa ha guardato ed e' stato netto: «i tasti aprono
   la scorciatoia per forza? e' inutilizzabile cosi'». Ha ragione, e
   la conclusione giusta e' togliere, non difendere.

   Le vie d'uscita, cercate prima di arrendersi:
     - una pagina web non puo' aprire una socket TCP. Muro, non
       difficolta'.
     - a-Shell potrebbe tenere aperto il collegamento ADB e prendere
       comandi da un server locale... ma iOS lo SOSPENDE appena passi
       a Safari. Il server muore. Muro.
     - il Fire TV ha DIAL in HTTP, ma una pagina https non puo'
       chiamare http://192.168.x.x. Stesso muro del ponte Samsung.
     - HDMI-CEC dalla TV: non serve, il Fire Stick sta su un
       proiettore in camera.
     - Amazon non ha nessuna API cloud per il telecomando.

   Quindi: per il Fire Stick l'app fa UNA cosa, e la fa meglio del
   telecomando: scrivere il titolo. Un viaggio per un titolo intero
   invece di beccare venti lettere su una tastiera a schermo e' un
   affare. Un viaggio per una freccia non lo e'.
   I tasti li fa il telecomando, che in camera sta a mezzo metro.

   --tasti resta dentro firestick.py: da riga di comando serve, e per
   capire cosa e' rotto quando si rompe serve ancora di piu'.        */

// La testa della schermata Comandi quando sei in modo Fire Stick.
function bloccoFireComandi(dove) {
  const p = el("div", "pad");
  p.style.cssText = "padding-top:0";

  // L'HUB. Da qui si RAGGIUNGE il telecomando vero, non se ne fa una
  // brutta copia. Il telecomando istantaneo lo serve l'app sul Fire
  // Stick (play/pausa, indietro, home, apri le sette app), e questa
  // pagina non puo' parlargli in fetch - e' https, lui e' http locale,
  // stesso muro del ponte a-Shell. Ma puo' APRIRLO: una navigazione
  // https->http e' permessa, e da li' i tasti sono istantanei.
  const ip = chiavi.fireip;
  if (!ip) {
    p.appendChild(el("p", "nota",
      "Dimmi l\u2019indirizzo del Fire Stick in Opzioni e qui compare " +
      "il telecomando."));
    dove.appendChild(p);
    return;
  }

  const url = "http://" + ip + ":8080/";
  const spiega = el("div", "gusto");
  spiega.innerHTML =
    "Il <b>telecomando del Fire Stick</b> \u2014 in camera, sul " +
    "proiettore. Play e pausa, indietro, home, e apri l\u2019app " +
    "giusta: tutto <b>istantaneo</b>, servito dal Fire Stick stesso.";
  p.appendChild(spiega);

// Cosa sa l'app di se stessa. Serve quando si rompe sul telefono di
// qualcun altro e non hai un server a cui chiedere.
// NON contiene mai le chiavi: solo se ci sono.
function bloccoDiagnosi(pad) {
  pad.appendChild(el("p", "sezione", "Diagnostica"));
  const d = el("div", "diagnosi");
  pad.appendChild(d);

  const voci = [];
  const riga = (cosa, valore, stato) => {
    voci.push([cosa, valore]);
    const r = el("div", "riga2");
    r.innerHTML = "<span>" + esc(cosa) + '</span><span class="' +
      (stato === true ? "si" : stato === false ? "no" : "") + '">' + esc(valore) + "</span>";
    d.appendChild(r);
  };

  riga("Versione", VERSIONE);
  riga("Chiave TMDB", chiavi.tmdb ? "inserita" : "manca", !!chiavi.tmdb);
  riga("Collegamento TV", oauth.collegato ? "OAuth (non scade)"
       : chiavi.token ? "token 24 ore" : "assente",
       oauth.collegato ? true : chiavi.token ? null : false);
  riga("TV già trovata", chiavi.tv ? "sì (…" + chiavi.tv.slice(-6) + ")" : "no", !!chiavi.tv);
  riga("Abbonamenti scelti", String(chiavi.servizi.length), chiavi.servizi.length > 0);
  riga("Da guardare", String(lista.tutto.length));
  riga("Titoli votati", String(visti.tutto.length));
  riga("Servizi noti", String(Object.keys(PROVIDER).length));
  riga("Famiglia", nuvola.pronta ? "pronta" : "non impostata", nuvola.pronta);
  if (nuvola.pronta) {
    riga("Ultimo scambio", chiavi.ultimoScambio
      ? new Date(chiavi.ultimoScambio).toLocaleString("it-IT") : "mai",
      chiavi.ultimoScambio > 0);
    riga("Voti degli altri", String(altrui.tutto.length));
  }
  riga("Strada scelta", chiavi.strada === "fire" ? "Fire Stick" : "TV Samsung");
  if (chiavi.strada === "fire") {
    riga("Indirizzo Fire Stick", chiavi.fireip || "manca", !!chiavi.fireip);
    riga("Scorciatoia Fire", chiavi.scorciatoiaFire || "non impostata",
         !!chiavi.scorciatoiaFire);
    riga("Si ferma", chiavi.firefino);
  } else {
    riga("Scorciatoia per scrivere", chiavi.scorciatoia || "non impostata",
         !!chiavi.scorciatoia);
  }
  riga("Rete", navigator.onLine === false ? "assente" : "presente",
       navigator.onLine !== false);
  riga("Funziona offline", (navigator.serviceWorker && navigator.serviceWorker.controller)
       ? "sì" : "non ancora", !!(navigator.serviceWorker && navigator.serviceWorker.controller));

  const guai = registro.tutto;
  riga("Problemi registrati", String(guai.length), guai.length === 0);

  if (guai.length) {
    pad.appendChild(el("p", "sezione", "Ultimi problemi"));
    const g = el("div", "guai");
    guai.slice(0, 8).forEach(x => {
      const r = el("div", "guaio");
      const quando = new Date(x.quando).toLocaleString("it-IT",
        { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
      r.innerHTML = "<b>" + esc(x.dove) + " · " + esc(quando) + "</b>" + esc(x.cosa);
      g.appendChild(r);
    });
    pad.appendChild(g);

    const pulisci = el("button", "svuota", "Dimentica i problemi");
    pulisci.style.cssText = "width:100%;margin:12px 0 0";
    pulisci.onclick = () => { registro.svuota(); schermoImpostazioni(); };
    pad.appendChild(pulisci);
  }

  const copia = el("button", "svuota", "Copia la diagnostica");
  copia.style.cssText = "width:100%;margin:12px 0 0";
  copia.onclick = async () => {
    const testo = ["TV — diagnostica", ...voci.map(([a, b]) => a + ": " + b),
      "", "Ultimi problemi:",
      ...(guai.length ? guai.slice(0, 8).map(x =>
        new Date(x.quando).toISOString().slice(0, 16) + " " + x.dove + " — " + x.cosa)
        : ["nessuno"])].join("\n");
    const esito = await condividi("Diagnostica", testo, null);
    if (esito === "niente") {
      // nessuna condivisione e nessuna clipboard: la metto a schermo
      const campo = el("textarea");
      campo.className = "indirizzo";
      campo.rows = 10;
      campo.value = testo;
      campo.readOnly = true;
      copia.after(campo);
      copia.disabled = true;
    } else {
      copia.textContent = esito === "copiato" ? "Copiata" : "Condivisa";
      setTimeout(() => { copia.textContent = "Copia la diagnostica"; }, 2200);
    }
  };
  pad.appendChild(copia);
}

// Le web app aggiunte alla Home tengono l'HTML in cache e possono
// restare indietro di giorni: GitHub Pages manda max-age=600 ma iOS
// e' piu' affezionato di cosi'. Quindi chiedo io se c'e' una
// versione nuova, e per ricaricarla davvero cambio l'indirizzo con
// ?v=, perche' un reload semplice riprenderebbe la stessa copia.
async function controllaVersione() {
  try {
    const r = await fetch("versione.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const d = await r.json();
    if (!d.versione || d.versione === VERSIONE) return;

    const avviso = el("div", "nuova");
    avviso.innerHTML = "<span>C'è una versione nuova dell'app.</span>";
    const b = el("button", null, "Aggiorna");
    b.onclick = () => {
      location.replace(location.pathname + "?v=" + encodeURIComponent(d.versione) + location.hash);
    };
    const chiudi = el("button", null, "Dopo");
    chiudi.style.cssText = "background:transparent;color:var(--acceso-testo);opacity:.7";
    chiudi.onclick = () => avviso.remove();
    avviso.appendChild(b);
    avviso.appendChild(chiudi);
    document.body.appendChild(avviso);
  } catch (e) { /* senza rete si vive */ }
}

// Un indirizzo condiviso apre direttamente quella scheda.
function apriIndirizzo(dove) {
  // Questo viene PRIMA del controllo sulla chiave: e' proprio il link
  // che serve a chi non ha ancora niente.
  if (dove.cosa === "telefono") return schermoAltroTelefono(dove.dati);
  if (!chiavi.tmdb) return vai("impostazioni");
  if (dove.cosa === "lista" || dove.cosa === "visti")
    return schermoPrendi(dove.cosa, dove.voci);
  if (dove.cosa === "persona") return schermoPersona(dove.id, () => vai("sfoglia"));
  return schermoDettaglio(A_TIPO[dove.cosa], dove.id, () => vai("sfoglia"));
}

// Se l'indirizzo cambia mentre l'app e' aperta (link toccato da fuori).
window.addEventListener("hashchange", () => {
  const dove = leggiIndirizzo();
  if (dove) apriIndirizzo(dove);
});

// Al primo avvio non c'e' niente da mostrare: si comincia dalle chiavi.
(async () => {
  // Se torniamo dall autorizzazione Samsung c'e' ?code= nella query,
  // e va consumato PRIMA di qualunque instradamento.
  let ritorno = null;
  try { ritorno = await raccogliCodice(); } catch (e) { /* si continua */ }
  if (ritorno) {
    esitoCollegamento = ritorno;
    vai("impostazioni");
    return;
  }
  const arrivo = leggiIndirizzo();
  if (arrivo) apriIndirizzo(arrivo);
  // Il bivio prima di tutto, ma solo se non e' mai stato scelto e
  // c'e' gia' la chiave: chiederlo a chi non ha ancora configurato
  // niente vorrebbe dire una domanda prima del necessario.
  else if (deveChiedereStrada()) schermoBivio();
  else vai(chiavi.tmdb ? "sfoglia" : "impostazioni");
  // Il tour, una volta sola: solo a chi e' gia' dentro (c'e' la
  // chiave, la strada e' scelta) e non l'ha ancora visto, e non se e'
  // arrivato da un link. Chi ha appena configurato non lo vuole in
  // faccia prima ancora di scegliere la strada.
  if (chiavi.tmdb && chiavi.stradaScelta && !chiavi.tourVisto && !arrivo)
    setTimeout(mostraTour, 300);
  // permesso fresco per quando servira', senza far aspettare nessuno
  if (oauth.collegato) rinnovaSeServe().catch(() => {});

  // Lo scambio con l'altro telefono, DOPO aver disegnato: se si
  // aspettasse la rete prima di mostrare qualcosa, l'app sembrerebbe
  // lenta per una cosa che di solito non cambia niente.
  if (nuvola.pronta)
    scambia()
      .then(r => { if (r.applicati) vai(scheda_attiva); })
      .catch(e => registro.aggiungi("famiglia", e.message));
})();

// Il service worker serve solo a far aprire l'app senza rete: vedi
// sw.js. Se la registrazione fallisce (contesto non sicuro, o
// browser che non lo supporta) l'app funziona come prima.
// "serviceWorker" in navigator e' vero anche se la proprieta' esiste
// ma vale undefined, e register() puo' alzare in modo sincrono: il
// .catch da solo non basta.
try {
  if (navigator.serviceWorker && navigator.serviceWorker.register)
    navigator.serviceWorker.register("sw.js").catch(() => {});
} catch (e) { /* l'app funziona anche senza */ }

controllaVersione();
</script>
