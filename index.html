<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TV">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icona-180.png">
<link rel="icon" href="icona-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>TV</title>
<!--
  TV — senza server.

  Parla diretto a TMDB e al cloud SmartThings: niente Mac, niente
  funzione serverless, funziona anche da 4G. Possibile perche'
  entrambe le API mandano access-control-allow-origin: * e
  SmartThings accetta l'header Authorization (verificato 22/09/2026).

  I SEGRETI NON SONO IN QUESTO FILE. Li inserisci tu una volta e
  restano in localStorage, sul telefono. Per questo il file puo'
  stare in un repo pubblico senza problemi.

  Il filtro "solo cio' che pago" nella navigazione per generi lo fa
  TMDB, non noi: /discover accetta with_watch_providers +
  watch_region, quindi quello che non hai non arriva nemmeno.
-->
<style>
  :root {
    --fondo:      #0B1014;
    --fondo-alto: #101922;
    --piano:      #16222D;
    --piano-alto: #1E2D3A;
    --bordo:      #24353F;
    --testo:      #EDF2F5;
    --tenue:      #8CA2B2;
    /* #5D7382 dava 3.86:1 sul fondo, sotto il minimo AA di 4.5.
       Lo uso per testo piccolo (anni, date, intestazioni), dove
       serve piu' contrasto, non meno. */
    --debole:     #7C93A3;
    --acceso:     #F2E9D8;
    --acceso-testo: #16220F;
    --verde:      #7FBF7A;
    --rosso:      #C97A6D;
    --ombra: 0 8px 28px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {
    background: var(--fondo);
    /* niente ingrandimento automatico del testo in orizzontale */
    -webkit-text-size-adjust: 100%;
    /* il rimbalzo della pagina mostrerebbe il bianco dietro */
    overscroll-behavior-y: none;
  }
  body {
    margin: 0;
    /* dvh e non vh: su iOS la vh non tiene conto delle barre che
       compaiono e spariscono, e il fondo pagina resta tagliato */
    min-height: 100dvh;
    background: var(--fondo); color: var(--testo);
    font: 400 16px/1.5 -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
    /* Dynamic Island: da app aggiunta a Home il contenuto partirebbe
       sotto l'isola. 59pt su iPhone 15. */
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(66px + env(safe-area-inset-bottom));
  }
  button {
    font: inherit; color: inherit; background: none; border: 0; cursor: pointer;
    /* manipulation toglie i 300ms di attesa del doppio tap: su un
       telecomando la differenza si sente */
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  img { display: block; }

  /* ----------------------------------------------------------- struttura */
  #schermo { min-height: 60vh; }
  .pad { padding: 0 16px; }
  .titolone {
    font-size: 27px; font-weight: 640; letter-spacing: -.021em;
    margin: 16px 0 10px;
  }
  .sezione {
    font-size: 12px; font-weight: 640; letter-spacing: .07em;
    text-transform: uppercase; color: var(--debole);
    margin: 26px 0 10px;
  }
  .nota { color: var(--tenue); font-size: 15px; margin: 18px 0; }
  .vuoto { color: var(--debole); text-align: center; padding: 16vh 24px; line-height: 1.6; }

  /* ------------------------------------------------------ barra in basso */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; gap: 2px;
    background: rgba(11,16,20,.86);
    backdrop-filter: saturate(160%) blur(18px);
    -webkit-backdrop-filter: saturate(160%) blur(18px);
    border-top: 1px solid var(--bordo);
    padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
  }
  nav button {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 3px; padding: 5px 0 3px; color: var(--debole);
    font-size: 10.5px; font-weight: 560; letter-spacing: .02em;
    border-radius: 11px;
    min-height: 44px;   /* minimo tocco comodo secondo Apple */
    overflow: hidden; white-space: nowrap;
  }
  nav button svg { width: 23px; height: 23px; fill: none;
    stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  nav button[aria-selected=true] { color: var(--acceso); }

  /* -------------------------------------------------------------- generi */
  .generi {
    display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .generi::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; min-height: 44px; padding: 10px 16px; border-radius: 999px;
    display: inline-flex; align-items: center;
    background: var(--piano); border: 1px solid var(--bordo);
    color: var(--tenue); font-size: 14.5px; font-weight: 500; white-space: nowrap;
  }
  .chip[aria-pressed=true] {
    background: var(--acceso); border-color: var(--acceso);
    color: var(--acceso-testo); font-weight: 600;
  }
  /* Il riempimento della cornice non e' un bersaglio: i tocchi che
     cadono li' non arrivano ai bottoni. Quindi sono i BOTTONI a
     dover essere 44px, non la cornice. */
  .interruttore {
    display: inline-flex; margin: 0 0 2px; padding: 3px;
    background: var(--piano); border: 1px solid var(--bordo); border-radius: 12px;
  }
  .interruttore button {
    min-height: 44px; padding: 8px 20px; border-radius: 9px; font-size: 15px;
    font-weight: 560; color: var(--tenue);
  }
  .interruttore button[aria-pressed=true] { background: var(--piano-alto); color: var(--testo); }

  /* ------------------------------------------------------ griglia poster */
  .griglia {
    display: grid; gap: 14px 11px; padding: 4px 16px 8px;
    grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
  }
  /* align-self: start perche' le righe della griglia si dimensionano
     sulla carta piu' alta (titolo su due righe) e le altre, essendo
     <button>, si centrerebbero verticalmente scendendo di 15px.
     display: flex annulla il centramento interno del button. */
  .carta {
    text-align: left; align-self: start;
    display: flex; flex-direction: column; align-items: stretch;
  }
  .carta .tela {
    position: relative; aspect-ratio: 2/3; border-radius: 11px;
    overflow: hidden; background: var(--piano);
    box-shadow: 0 3px 14px rgba(0,0,0,.35);
  }
  .carta img { width: 100%; height: 100%; object-fit: cover; -webkit-touch-callout: none; }
  .carta:active .tela { transform: scale(.972); }
  .carta .tela { transition: transform .13s ease; }
  .carta .manca {
    display: flex; align-items: center; justify-content: center;
    height: 100%; padding: 10px; text-align: center;
    color: var(--debole); font-size: 11.5px; line-height: 1.35;
  }
  .carta .voto {
    position: absolute; top: 6px; right: 6px;
    background: rgba(8,12,15,.82); backdrop-filter: blur(6px);
    color: var(--testo); font-size: 11px; font-weight: 640;
    padding: 3px 6px; border-radius: 7px;
  }
  .carta h3 {
    margin: 7px 1px 0; font-size: 13px; font-weight: 520; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 2.6em;
  }
  .carta p { margin: 1px 1px 0; font-size: 11.5px; color: var(--debole); }

  /* ----------------------------------------------------------- dettaglio */
  .sfondo { position: relative; margin-bottom: 8px; }
  .sfondo img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
  .sfondo::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(11,16,20,.15) 0%, rgba(11,16,20,.6) 55%, var(--fondo) 100%);
  }
  .sfondo.senza { aspect-ratio: 16/7; background: linear-gradient(160deg, var(--piano-alto), var(--fondo)); }
  .testa { display: flex; gap: 14px; align-items: flex-end; margin: -64px 0 0; position: relative; z-index: 2; }
  .testa .locandina {
    flex: 0 0 96px; aspect-ratio: 2/3; border-radius: 10px; overflow: hidden;
    background: var(--piano); box-shadow: var(--ombra);
  }
  .testa .locandina img { width: 100%; height: 100%; object-fit: cover; }
  .testa h1 { font-size: 22px; font-weight: 660; letter-spacing: -.018em; margin: 0 0 5px; line-height: 1.2; }
  .meta { color: var(--tenue); font-size: 13.5px; }
  .meta b { color: var(--testo); font-weight: 600; }

  /* ------------------------------------------------------------ verdetto */
  .verdetto { border-radius: 15px; padding: 17px 18px; margin: 20px 0 0; }
  .verdetto.si { background: var(--acceso); color: var(--acceso-testo); }
  .verdetto.no { background: var(--piano); border: 1px solid var(--bordo); }
  .verdetto .risposta { font-size: 21px; font-weight: 640; letter-spacing: -.015em; margin: 0; }
  .verdetto .dove { margin: 7px 0 0; font-size: 14.5px; opacity: .82; }

  .apri {
    display: flex; align-items: center; gap: 12px; width: 100%;
    margin: 10px 0 0; padding: 13px 15px;
    background: var(--piano); border: 1px solid var(--bordo);
    border-radius: 13px; font-size: 16px; font-weight: 560;
    transition: background .14s;
  }
  .apri:active { background: var(--piano-alto); }
  .apri .logo { width: 34px; height: 34px; border-radius: 8px; flex: 0 0 34px; background: var(--piano-alto); }
  .apri .etichetta { flex: 1; text-align: left; }
  .apri small { display: block; font-size: 12.5px; font-weight: 400; color: var(--debole); margin-top: 1px; }
  .apri.fatto { background: var(--acceso); color: var(--acceso-testo); border-color: var(--acceso); }
  .apri.fatto small { color: rgba(22,34,15,.62); }
  .apri.male { border-color: var(--rosso); }
  .apri:disabled { opacity: .55; }

  .trama { color: var(--testo); font-size: 15.5px; line-height: 1.62; margin: 10px 0 0; opacity: .9; }
  .cast { display: flex; gap: 12px; overflow-x: auto; padding: 2px 16px 6px; scrollbar-width: none; }
  .cast::-webkit-scrollbar { display: none; }
  .attore { flex: 0 0 74px; text-align: center; }
  .attore .faccia {
    width: 74px; height: 74px; border-radius: 50%; overflow: hidden;
    background: var(--piano); margin: 0 auto 6px;
    display: flex; align-items: center; justify-content: center;
    color: var(--debole); font-size: 20px; font-weight: 600;
  }
  .attore .faccia img { width: 100%; height: 100%; object-fit: cover; }
  /* due righe fisse: i nomi lunghi non devono sfasare la fila */
  .attore b {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; font-size: 12px; font-weight: 540; line-height: 1.3;
    min-height: 2.6em;
  }
  .attore span { display: block; font-size: 11px; color: var(--debole); line-height: 1.3; margin-top: 1px; }

  /* -------------------------------------------------------------- ricerca */
  .barraRicerca { padding: 4px 16px 0; }
  /* 16px e' la soglia: sotto, iOS ingrandisce la pagina quando il
     campo prende il fuoco e non la rimpicciolisce piu' */
  .barraRicerca input {
    width: 100%; background: var(--piano); border: 1px solid var(--bordo);
    border-radius: 13px; color: var(--testo); font: 400 16.5px system-ui, sans-serif;
    padding: 14px 16px; -webkit-appearance: none; appearance: none;
  }
  .barraRicerca input::placeholder { color: var(--debole); }
  input:focus, textarea:focus, .chip:focus-visible, .carta:focus-visible, .apri:focus-visible {
    outline: 2px solid var(--acceso); outline-offset: 2px;
  }

  .riga {
    display: flex; gap: 13px; width: 100%; text-align: left;
    padding: 9px 0; border-bottom: 1px solid var(--bordo);
  }
  .riga .mini { flex: 0 0 52px; aspect-ratio: 2/3; border-radius: 7px; overflow: hidden; background: var(--piano); }
  .riga .mini img { width: 100%; height: 100%; object-fit: cover; }
  .riga .dati { flex: 1; min-width: 0; align-self: center; }
  .riga b { display: block; font-size: 15.5px; font-weight: 550; }
  .riga span { font-size: 13px; color: var(--debole); }

  /* --------------------------------------------------------- impostazioni */
  .campo { margin: 0 0 20px; }
  .campo label { display: block; font-size: 14px; font-weight: 560; margin: 0 0 7px; }
  .campo textarea {
    width: 100%; background: var(--piano); border: 1px solid var(--bordo);
    border-radius: 12px; color: var(--testo);
    font: 400 14px/1.5 ui-monospace, SFMono-Regular, monospace;
    padding: 13px 14px; resize: vertical;
  }
  .campo p { color: var(--debole); font-size: 12.5px; margin: 7px 0 0; line-height: 1.5; }
  .primario {
    display: block; width: 100%; margin: 6px 0 0; padding: 15px;
    background: var(--acceso); color: var(--acceso-testo);
    border-radius: 13px; font-size: 16.5px; font-weight: 620;
  }
  .primario:disabled { opacity: .5; }
  .esito { margin: 14px 0 0; font-size: 14px; line-height: 1.6; color: var(--tenue); }
  .esito .ok::before   { content: "✓ "; color: var(--verde); }
  .esito .ko::before   { content: "✕ "; color: var(--rosso); }

  .indietro {
    display: inline-flex; align-items: center; gap: 6px; color: var(--tenue);
    font-size: 15px; padding: 14px 16px 4px; min-height: 44px;
  }

  /* ------------------------------------------------------------ filtri */
  .capo { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .capo .azioni { display: flex; gap: 8px; flex: 0 0 auto; }
  /* "Stasera" sta nella barra del titolo: da pulsante a tutta larghezza
     costava 57px di altezza prima del contenuto. In crema resta la cosa
     piu' vistosa della schermata anche se e' piccolo. */
  .capo .stasera {
    width: auto; margin: 0; padding: 0 15px; min-height: 44px;
    border-radius: 999px; font-size: 14.5px; gap: 6px;
  }
  .capo .stasera svg { width: 17px; height: 17px; }
  .bottoneFiltri {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 8px 15px; border-radius: 999px;
    font-size: 14.5px; font-weight: 560;
    background: var(--piano); border: 1px solid var(--bordo); color: var(--tenue);
  }
  .bottoneFiltri[aria-expanded=true], .bottoneFiltri.attivi {
    background: var(--acceso); border-color: var(--acceso); color: var(--acceso-testo);
  }
  .pannello {
    margin: 12px 16px 2px; padding: 4px 0 10px;
    border: 1px solid var(--bordo); border-radius: 14px; background: var(--fondo-alto);
  }
  .pannello .gruppo { padding: 10px 14px 2px; }
  .pannello .gruppo > span {
    display: block; font-size: 11.5px; font-weight: 640; letter-spacing: .07em;
    text-transform: uppercase; color: var(--debole); margin: 0 0 8px;
  }
  .scelte { display: flex; flex-wrap: wrap; gap: 7px; }
  .scelte .chip { font-size: 13.5px; padding: 7px 12px; }
  .azzera {
    display: block; width: calc(100% - 28px); margin: 12px 14px 4px; padding: 11px;
    border-radius: 11px; border: 1px solid var(--bordo); color: var(--tenue); font-size: 14.5px;
  }
  .conteggio { color: var(--debole); font-size: 12.5px; font-weight: 400; }

  /* ------------------------------------------------------- telecomando */
  .telecomando { padding: 0 16px 20px; }
  .fila { display: flex; gap: 10px; margin: 0 0 12px; }
  .fila > button { flex: 1; }
  .tasto {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; min-height: 56px; padding: 10px 6px;
    -webkit-touch-callout: none;   /* niente menu al tocco lungo */
    background: var(--piano); border: 1px solid var(--bordo); border-radius: 13px;
    font-size: 12.5px; font-weight: 560; color: var(--tenue);
    transition: background .1s, transform .1s;
  }
  .tasto:active { background: var(--acceso); color: var(--acceso-testo); transform: scale(.96); }
  .tasto svg { width: 21px; height: 21px; fill: none; stroke: currentColor;
               stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .tasto.acceso { background: var(--acceso); color: var(--acceso-testo); border-color: var(--acceso); }
  .tasto:disabled { opacity: .45; }

  .croce {
    display: grid; gap: 9px; margin: 0 auto 14px; max-width: 260px;
    grid-template-columns: repeat(3, 1fr);
    grid-template-areas: ". su ." "sx ok dx" ". giu .";
  }
  .croce .su  { grid-area: su; }  .croce .giu { grid-area: giu; }
  .croce .sx  { grid-area: sx; }  .croce .dx  { grid-area: dx; }
  .croce .ok  { grid-area: ok; }
  .croce .tasto { min-height: 62px; border-radius: 15px; }
  .croce .ok {
    background: var(--piano-alto); font-size: 15px; font-weight: 660; color: var(--testo);
    border-radius: 50%;
  }
  .stato {
    display: flex; align-items: center; gap: 9px; margin: 0 0 16px;
    padding: 12px 14px; background: var(--fondo-alto);
    border: 1px solid var(--bordo); border-radius: 13px; font-size: 14px;
  }
  .pallina { width: 9px; height: 9px; border-radius: 50%; background: var(--debole); flex: 0 0 9px; }
  .pallina.viva { background: var(--verde); }
  .pallina.morta { background: var(--rosso); }
  .stato .quale { color: var(--tenue); }
  .stato button { margin-left: auto; color: var(--tenue); font-size: 13px; text-decoration: underline; }

  /* ------------------------------------------------------- stasera */
  .stasera {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    width: calc(100% - 32px); margin: 4px 16px 14px; padding: 16px;
    background: var(--acceso); color: var(--acceso-testo);
    border-radius: 14px; font-size: 16.5px; font-weight: 640;
  }
  .stasera svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9;
                 stroke-linecap: round; stroke-linejoin: round; }
  .pescato { padding: 0 16px; }
  .pescato .grande {
    display: flex; gap: 15px; margin: 6px 0 0;
  }
  .pescato .grande .locandina {
    flex: 0 0 132px; aspect-ratio: 2/3; border-radius: 12px; overflow: hidden;
    background: var(--piano); box-shadow: var(--ombra);
  }
  .pescato .grande .locandina img { width: 100%; height: 100%; object-fit: cover; }
  .pescato h2 { font-size: 21px; font-weight: 660; letter-spacing: -.017em; margin: 0 0 6px; line-height: 1.18; }
  .pescato .dentro { align-self: center; min-width: 0; }
  .ancora {
    display: block; width: 100%; margin: 12px 0 0; padding: 15px;
    background: var(--piano); border: 1px solid var(--bordo);
    border-radius: 13px; font-size: 16px; font-weight: 560; color: var(--testo);
  }
  .ancora:active { background: var(--piano-alto); }

  /* ----------------------------------------------- stagioni/episodi */
  .prossimo {
    margin: 14px 0 0; padding: 14px 16px; border-radius: 13px;
    background: var(--fondo-alto); border: 1px solid var(--bordo);
  }
  .prossimo .quando { font-size: 12px; font-weight: 640; letter-spacing: .06em;
                      text-transform: uppercase; color: var(--verde); margin: 0 0 5px; }
  .prossimo.finita .quando { color: var(--debole); }
  .prossimo .cosa { margin: 0; font-size: 15.5px; font-weight: 550; }
  .prossimo .data { margin: 4px 0 0; font-size: 13.5px; color: var(--tenue); }

  .episodio {
    display: flex; gap: 12px; width: 100%; text-align: left;
    padding: 11px 0; border-bottom: 1px solid var(--bordo);
  }
  .episodio .fermo {
    flex: 0 0 96px; aspect-ratio: 16/9; border-radius: 8px;
    overflow: hidden; background: var(--piano);
  }
  .episodio .fermo img { width: 100%; height: 100%; object-fit: cover; }
  .episodio .dati { flex: 1; min-width: 0; align-self: center; }
  .episodio b { display: block; font-size: 14.5px; font-weight: 550; line-height: 1.3; }
  .episodio span { font-size: 12.5px; color: var(--debole); }
  .episodio .trama2 {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; font-size: 12.5px; color: var(--tenue); margin-top: 3px;
  }
  .futuro { opacity: .55; }

  /* -------------------------------------------------------- persona */
  .capoPersona { display: flex; gap: 15px; align-items: center; padding: 6px 16px 4px; }
  .capoPersona .ritratto {
    flex: 0 0 82px; width: 82px; height: 82px; border-radius: 50%;
    overflow: hidden; background: var(--piano);
    display: flex; align-items: center; justify-content: center;
    color: var(--debole); font-size: 26px; font-weight: 600;
  }
  .capoPersona .ritratto img { width: 100%; height: 100%; object-fit: cover; }
  .capoPersona h1 { font-size: 23px; font-weight: 660; letter-spacing: -.018em; margin: 0 0 3px; line-height: 1.15; }
  .attore { -webkit-touch-callout: none; }
  button.attore { background: none; border: 0; padding: 0; }

  /* --------------------------------------------------------- saga */
  .carta.nonTua { opacity: .42; }
  .carta.questo .tela { outline: 2px solid var(--acceso); outline-offset: 2px; }

  /* ----------------------------------------------------- diagnosi */
  .diagnosi { margin: 8px 0 0; }
  .diagnosi .riga2 {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 9px 0; border-bottom: 1px solid var(--bordo); font-size: 14px;
  }
  .diagnosi .riga2 span:first-child { color: var(--tenue); }

<script>
"use strict";

/* ---------------------------------------------------- dati non segreti
   Tenuti allineati a mappa_app.json e miei_servizi.json del repo.    */

const MAPPA = {
  "8":    { nome: "Netflix",           app: "3201907018807" },
  "119":  { nome: "Prime Video",       app: "3201910019365" },
  "337":  { nome: "Disney+",           app: "3201901017640" },
  "350":  { nome: "Apple TV",          app: "3201807016597" },
  "584":  { nome: "Discovery+",        app: "3201803015944" },
  "39":   { nome: "NOW",               app: "jcz0WrZYdy.NOWTV" },
  "1899": { nome: "HBO Max",           app: "5b8c3eb16b.BeamCTVDev" },
  "359":  { nome: "Mediaset Infinity", app: "g3zzYA7yO8.InfinityNew" },
  "110":  { nome: "Infinity+",         app: "g3zzYA7yO8.InfinityNew" },
};

// Gli abbonamenti NON sono piu' una costante: si scelgono in
// Impostazioni e stanno in localStorage. Erano scritti sia qui sia
// in miei_servizi.json del repo, e le due liste sono divergite una
// volta: Infinity+ c'era qui e l'abbonamento no, e il risultato non
// era un errore ma un verdetto sbagliato.
// Questi valgono solo al primo avvio, finche' non scegli.
const SERVIZI_PREDEFINITI = ["8", "119", "337", "1899", "39", "359", "584"];

// Sottogeneri veri: sono le keyword di TMDB, non i generi. Gli id
// li ho cercati una volta con /search/keyword e verificati uno per
// uno incrociati col filtro abbonamenti: nessuno torna vuoto.
const SOTTOGENERI = [
  { n: "Supereroi", k: "9715" },        { n: "Storia vera", k: "9672" },
  { n: "Rapine", k: "10051" },          { n: "Spionaggio", k: "470" },
  { n: "Serial killer", k: "10714" },   { n: "Distopia", k: "4565" },
  { n: "Viaggi nel tempo", k: "4379" }, { n: "Post-apocalittico", k: "359337" },
  { n: "Zombie", k: "12377" },          { n: "Vampiri", k: "3133" },
  { n: "Alieni", k: "14909" },          { n: "Robot", k: "14544" },
  { n: "Arti marziali", k: "779" },     { n: "Sopravvivenza", k: "10349" },
  { n: "Mafia", k: "10391" },           { n: "Cospirazioni", k: "10410" },
  { n: "Processi", k: "33519" },        { n: "Anime", k: "210024" },
  { n: "Dinosauri", k: "12616" },       { n: "Natale", k: "207317" },
];

const ORDINI = [
  { n: "Popolari", v: "popularity.desc" },
  { n: "Voto più alto", v: "vote_average.desc" },
  { n: "Più recenti", v: "data.desc" },
];

// with_runtime funziona su film E serie (verificato). Per le serie il
// minutaggio e' quello dell'episodio, quindi le soglie sono diverse.
const DURATE = {
  movie: [
    { n: "Qualsiasi" },
    { n: "Fino a 90′", lte: 90 },
    { n: "90-120′", gte: 90, lte: 120 },
    { n: "Oltre 2 ore", gte: 120 },
  ],
  tv: [
    { n: "Qualsiasi" },
    { n: "Episodi corti, ≤30′", lte: 30 },
    { n: "Episodi lunghi, ≥50′", gte: 50 },
  ],
};

// Il pescaggio scegliendo una pagina fra 500 ignora l'ordinamento:
// se ordini per voto e poi peschi dalla pagina 400, prendi comunque
// roba mediocre. Quindi la preferenza restringe anche la PROFONDITA'.
const PREFERENZE = [
  { n: "Popolari",   ordine: "popularity.desc",   pagine: 25 },
  { n: "Voto alto",  ordine: "vote_average.desc", pagine: 10 },
  { n: "Pesca larga", ordine: "popularity.desc",  pagine: 500 },
];

const DECENNI = [
  { n: "Tutti", da: "", a: "" },
  { n: "2020 →", da: "2020-01-01", a: "" },
  { n: "2010-19", da: "2010-01-01", a: "2019-12-31" },
  { n: "2000-09", da: "2000-01-01", a: "2009-12-31" },
  { n: "Prima", da: "", a: "1999-12-31" },
];

const TIPI = { flatrate: "nell'abbonamento", free: "gratis", ads: "gratis con pubblicità",
               rent: "a noleggio", buy: "da comprare" };
const COMPRESI = ["flatrate", "free", "ads"];
const PAGANDO = ["rent", "buy"];

// La versione di QUESTO file. pubblica.sh la aggiorna a ogni
// pubblicazione, insieme a versione.json accanto.
const VERSIONE = "202609231026";

const TMDB = "https://api.themoviedb.org/3";
const ST = "https://api.smartthings.com/v1";
const IMG = "https://image.tmdb.org/t/p";
const PAESE = "IT", LINGUA = "it-IT";


/* -------------------------------------------------- segreti sul telefono */

const chiavi = {
  get tmdb()   { return localStorage.getItem("tmdb_key") || ""; },
  set tmdb(v)  { localStorage.setItem("tmdb_key", v.trim()); },
  get token()  { return localStorage.getItem("st_token") || ""; },
  set token(v) { localStorage.setItem("st_token", v.trim()); },
  get tv()     { return localStorage.getItem("st_device") || ""; },
  set tv(v)    { localStorage.setItem("st_device", v); },

  // Distinguo "non ho mai scelto" (chiave assente -> predefiniti) da
  // "ho scelto niente" (lista vuota -> nessun filtro possibile, e
  // l'app lo dice invece di mostrarti tutto lo scibile).
  get servizi() {
    const grezzo = localStorage.getItem("servizi");
    if (grezzo === null) return SERVIZI_PREDEFINITI.slice();
    try {
      const v = JSON.parse(grezzo);
      return Array.isArray(v) ? v.map(String) : SERVIZI_PREDEFINITI.slice();
    } catch (e) { return SERVIZI_PREDEFINITI.slice(); }
  },
  set servizi(a) { localStorage.setItem("servizi", JSON.stringify(a.map(String))); },
};

// I provider italiani: nome e logo per ogni id. Vengono da TMDB una
// volta e restano in localStorage, perche' servono anche in modo
// sincrono (per scrivere il nome di un servizio in un'etichetta).
let PROVIDER = {};
try { PROVIDER = JSON.parse(localStorage.getItem("provider") || "{}"); } catch (e) { PROVIDER = {}; }

function nomeProvider(pid) {
  return (PROVIDER[pid] || {}).nome || (MAPPA[pid] || {}).nome || pid;
}
function logoProvider(pid) {
  return (PROVIDER[pid] || {}).logo || null;
}

// La lista "da guardare" vive nel telefono: niente server, quindi
// niente sincronizzazione fra dispositivi. Ognuno ha la sua.
const lista = {
  get tutto() {
    try {
      const v = JSON.parse(localStorage.getItem("lista") || "[]");
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  },
  set tutto(a) { localStorage.setItem("lista", JSON.stringify(a)); },
  ha(tipo, id) { return this.tutto.some(x => x.tipo === tipo && String(x.id) === String(id)); },
  aggiungi(v) {
    if (this.ha(v.tipo, v.id)) return;
    // i piu' recenti in cima: e' l'ordine in cui li cerchi
    this.tutto = [{ ...v, quando: Date.now() }, ...this.tutto];
  },
  togli(tipo, id) {
    this.tutto = this.tutto.filter(x => !(x.tipo === tipo && String(x.id) === String(id)));
  },
};

// Indirizzi interni: ogni scheda ha il suo, cosi' si puo' mandare.
//   #/film/27205   #/serie/1396   #/persona/525
// Li scrivo con replaceState e non toccando location.hash, perche'
// location.hash farebbe scattare hashchange e ridisegnerebbe la
// schermata che l'ha appena scritto.
const A_PAROLA = { movie: "film", tv: "serie" };
const A_TIPO = { film: "movie", serie: "tv" };

function indirizzoDi(tipo, id) {
  return location.origin + location.pathname +
         "#/" + (A_PAROLA[tipo] || "film") + "/" + id;
}

function leggiIndirizzo() {
  const m = (location.hash || "").match(/^#\/(film|serie|persona)\/(\d+)$/);
  if (m) return { cosa: m[1], id: Number(m[2]) };
  // liste condivise: #/lista/m27205,t1396  e  #/visti/m155:5,t1396:4
  const l = (location.hash || "").match(/^#\/(lista|visti)\/([mt0-9,:]+)$/);
  if (l) return { cosa: l[1], voci: decodificaVoci(l[2]) };
  return null;
}

// Una lista in un indirizzo: solo tipo e numero, piu' il voto per i
// visti. Non ci metto titoli e locandine, che si recuperano da TMDB:
// un indirizzo con trenta titoli dentro diventerebbe illeggibile.
function codificaVoci(voci, conVoto) {
  return voci
    .map(v => (v.tipo === "tv" ? "t" : "m") + v.id + (conVoto && v.mio ? ":" + v.mio : ""))
    .join(",");
}

function decodificaVoci(testo) {
  return (testo || "").split(",").map(p => {
    const m = p.match(/^([mt])(\d+)(?::([1-5]))?$/);
    if (!m) return null;
    return { tipo: m[1] === "t" ? "tv" : "movie", id: Number(m[2]),
             mio: m[3] ? Number(m[3]) : 0 };
  }).filter(Boolean);
}

function scriviIndirizzo(cosa, id) {
  const nuovo = "#/" + cosa + "/" + id;
  if (location.hash !== nuovo) history.replaceState(null, "", nuovo);
}

function pulisciIndirizzo() {
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
}

// navigator.share e navigator.clipboard vogliono un contesto sicuro:
// su GitHub Pages (https) ci sono, sull'indirizzo locale in http no.
// Percio' tre livelli, non uno.
async function condividi(titolo, url, dove) {
  try {
    if (navigator.share) { await navigator.share({ title: titolo, url }); return "condiviso"; }
  } catch (e) {
    if (e && e.name === "AbortError") return "annullato";
  }
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(url);
      return "copiato";
    }
  } catch (e) { /* si ripiega sotto */ }
  if (dove) {
    const campo = el("input", "indirizzo");
    campo.value = url;
    campo.readOnly = true;
    dove.appendChild(campo);
    campo.focus();
    campo.setSelectionRange(0, url.length);
    return "mostrato";
  }
  return "niente";
}

// I visti, col voto che gli dai da 1 a 5. Salvo anche generi e
// keyword del titolo: li ho gia' in mano quando lo segni dalla sua
// scheda, quindi il profilo di gusto si costruisce senza una sola
// chiamata in piu'.
const visti = {
  get tutto() {
    try {
      const v = JSON.parse(localStorage.getItem("visti") || "[]");
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  },
  set tutto(a) { localStorage.setItem("visti", JSON.stringify(a)); },
  voto(tipo, id) {
    const v = this.tutto.find(x => x.tipo === tipo && String(x.id) === String(id));
    return v ? v.mio : 0;
  },
  segna(v, mio) {
    const resto = this.tutto.filter(x => !(x.tipo === v.tipo && String(x.id) === String(v.id)));
    this.tutto = [{ ...v, mio, quando: Date.now() }, ...resto];
  },
  togli(tipo, id) {
    this.tutto = this.tutto.filter(x => !(x.tipo === tipo && String(x.id) === String(id)));
  },
};

// Il gusto: conto generi e keyword dei titoli che hai votato bene,
// pesando 4 stelle 1 e 5 stelle 2. Non e' magia, e' un conteggio.
function profiloGusto() {
  const buoni = visti.tutto.filter(v => (v.mio || 0) >= 4);
  const generi = {}, keyword = {};
  buoni.forEach(v => {
    const peso = v.mio >= 5 ? 2 : 1;
    (v.generiId || []).forEach(g => { generi[g] = (generi[g] || 0) + peso; });
    (v.keyword || []).forEach(k => { keyword[k] = (keyword[k] || 0) + peso; });
  });
  const cima = o => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 4).map(x => x[0]);
  return { quanti: buoni.length, generi: cima(generi), keyword: cima(keyword) };
}

// "oggi", "domani", "fra 5 giorni", oppure la data scritta.
function quandoEsce(iso) {
  if (!iso) return "";
  const oggi = new Date(); oggi.setHours(0, 0, 0, 0);
  const d = new Date(iso + "T00:00:00");
  const giorni = Math.round((d - oggi) / 86400000);
  const scritta = d.toLocaleDateString("it-IT",
    { weekday: "long", day: "numeric", month: "long" });
  if (giorni === 0) return "oggi · " + scritta;
  if (giorni === 1) return "domani · " + scritta;
  if (giorni > 1) return "fra " + giorni + " giorni · " + scritta;
  if (giorni === -1) return "ieri · " + scritta;
  return scritta + (d.getFullYear() !== oggi.getFullYear() ? " " + d.getFullYear() : "");
}

async function tmdb(percorso, parametri = {}) {
  if (!chiavi.tmdb) throw new Error("Manca la chiave TMDB: vai in Impostazioni.");
  // Senza rete la fetch dice solo "Failed to fetch": meglio dirlo
  // in italiano, e ricordare che la Lista funziona comunque.
  if (navigator.onLine === false)
    throw new Error("Sei senza rete. La tua Lista funziona comunque.");
  const url = TMDB + percorso + "?" + new URLSearchParams({ ...parametri, api_key: chiavi.tmdb });
  let r;
  try { r = await fetch(url); }
  catch (e) {
    registro.aggiungi("TMDB", percorso + " -> rete: " + e.message);
    throw new Error("Non riesco a raggiungere TMDB. Controlla la rete.");
  }
  if (r.status === 401) {
    registro.aggiungi("TMDB", "chiave rifiutata (401)");
    throw new Error("Chiave TMDB rifiutata.");
  }
  if (!r.ok) {
    registro.aggiungi("TMDB", percorso + " -> HTTP " + r.status);
    throw new Error("TMDB non risponde (HTTP " + r.status + ").");
  }
  return r.json();
}

async function smartthings(percorso, corpoRichiesta) {
  if (!chiavi.token) throw new Error("Manca il token SmartThings: vai in Impostazioni.");
  if (navigator.onLine === false)
    throw new Error("Sei senza rete: la TV si comanda solo online.");
  const r = await fetch(ST + percorso, {
    method: corpoRichiesta ? "POST" : "GET",
    headers: { "Authorization": "Bearer " + chiavi.token, "Content-Type": "application/json" },
    body: corpoRichiesta ? JSON.stringify(corpoRichiesta) : undefined,
  });
  if (r.status === 401) {
    registro.aggiungi("SmartThings", "token rifiutato (401): scaduto o revocato");
    throw new Error("Token SmartThings rifiutato (scaduto o revocato).");
  }
  if (r.status === 403) {
    registro.aggiungi("SmartThings", "403: token senza permessi sui dispositivi");
    throw new Error("Token senza i permessi sui dispositivi.");
  }
  if (!r.ok) {
    registro.aggiungi("SmartThings", percorso + " -> HTTP " + r.status);
    throw new Error("SmartThings non risponde (HTTP " + r.status + ").");
  }
  return r.status === 204 ? {} : r.json();
}

async function trovaTv() {
  if (chiavi.tv) return chiavi.tv;
  const dati = await smartthings("/devices");
  for (const d of dati.items || [])
    for (const c of d.components || [])
      if ((c.capabilities || []).some(x => x.id === "custom.launchapp")) {
        chiavi.tv = d.deviceId;
        return d.deviceId;
      }
  throw new Error("Nessuna TV con custom.launchapp nel tuo account SmartThings.");
}

// setPictureMode e setSoundMode prendono "mode: string", ma non e'
// documentato se voglia l'id ("modeMovie") o il nome localizzato
// ("Film"). Lo stato riporta il NOME, quindi provo quello; se dopo
// qualche secondo non e' cambiato, riprovo con l'id. Come per
// launchApp, la risposta COMPLETED non e' una prova.
async function impostaModo(capacita, comando, attributo, voce) {
  const leggi = async () => {
    const st = await statoTv();
    return attributo === "immagine" ? st.immagine : st.suono;
  };
  const prima = await leggi().catch(() => null);
  await comando(voce.name);
  await new Promise(r => setTimeout(r, 2500));
  let adesso = await leggi().catch(() => null);
  if (adesso === voce.name) return adesso;

  await comando(voce.id);
  await new Promise(r => setTimeout(r, 2500));
  adesso = await leggi().catch(() => null);
  return adesso;
}

async function appInPrimoPiano() {
  const stato = await smartthings("/devices/" + await trovaTv() + "/status");
  return (((stato.components || {}).main || {}).tvChannel || {}).tvChannelName?.value || "";
}

// COMPLETED vuol dire "comando recapitato", non "app aperta": la
// prova e' rileggere l'app in primo piano. Per questo verifichiamo.
async function lancia(appId) {
  const ident = await trovaTv();
  const prima = await appInPrimoPiano().catch(() => "");
  await smartthings("/devices/" + ident + "/commands", {
    commands: [{ component: "main", capability: "custom.launchapp",
                 command: "launchApp", arguments: [appId] }],
  });
  for (let i = 0; i < 5; i++) {
    await new Promise(r => setTimeout(r, 2400));
    const adesso = await appInPrimoPiano().catch(() => "");
    if (adesso === appId || (adesso && adesso !== prima)) return true;
  }
  return false;
}

// Il filtro lo fa TMDB: with_watch_providers + watch_region.
// Quello che non hai in abbonamento non arriva nemmeno.
async function sfoglia(f, pagina = 1) {
  const campoData = f.tipo === "movie" ? "primary_release_date" : "first_air_date";
  const parametri = {
    language: LINGUA,
    watch_region: PAESE,
    // un solo servizio se l'hai scelto, altrimenti tutti i tuoi
    with_watch_providers: f.servizio || chiavi.servizi.join("|"),
    with_watch_monetization_types: COMPRESI.join("|"),
    sort_by: f.ordine === "data.desc" ? campoData + ".desc" : f.ordine,
    include_adult: "false",
    page: pagina,
  };
  if (f.genere) parametri.with_genres = f.genere;
  if (f.keyword) parametri.with_keywords = f.keyword;

  // Senza una soglia di voti, "voto più alto" restituisce cose con
  // tre voti da 10: tecnicamente giusto, inutile in pratica.
  if (f.ordine === "vote_average.desc") parametri["vote_count.gte"] = 150;

  const d = DECENNI.find(x => x.n === f.decennio);
  if (d && d.da) parametri[campoData + ".gte"] = d.da;
  if (d && d.a) parametri[campoData + ".lte"] = d.a;

  const t = (DURATE[f.tipo] || []).find(x => x.n === f.durata);
  if (t && t.gte) parametri["with_runtime.gte"] = t.gte;
  if (t && t.lte) parametri["with_runtime.lte"] = t.lte;

  const dati = await tmdb("/discover/" + f.tipo, parametri);
  return {
    elementi: (dati.results || []).map(v => normalizza(v, f.tipo)),
    pagine: dati.total_pages || 1,
    totale: dati.total_results || 0,
  };
}

// Pesca un titolo a caso fra quelli che paghi. Per avere varieta'
// vera scelgo una pagina casuale e non il primo risultato: TMDB
// ordina per popolarita', quindi la pagina 1 e' sempre la stessa.
// Le pagine si fermano a 500 (la 501 risponde errore, verificato).
const paginePerFiltro = {};

// Gli ultimi pescati, per non riproporre lo stesso due volte di fila.
const pescatiDiRecente = [];

async function pescaUno(f, profondita = 500) {
  const chiave = JSON.stringify(f);
  let pagine = paginePerFiltro[chiave];
  let primaPagina = null;

  if (pagine === undefined) {
    primaPagina = await sfoglia(f, 1);
    if (!primaPagina.elementi.length) return null;
    pagine = Math.min(primaPagina.pagine, 500);
    paginePerFiltro[chiave] = pagine;
  }
  const tetto = Math.max(1, Math.min(pagine, profondita));

  // Fino a 4 tentativi per evitare gli ultimi pescati. Se il bacino e'
  // piccolo si arrende e ripropone: meglio un doppione che un "niente".
  for (let giro = 0; giro < 4; giro++) {
    const p = 1 + Math.floor(Math.random() * tetto);
    const r = (p === 1 && primaPagina) ? primaPagina : await sfoglia(f, p);
    const nuovi = r.elementi.filter(v => !pescatiDiRecente.includes(v.tipo + v.id));
    const scelti = nuovi.length ? nuovi : (giro === 3 ? r.elementi : []);
    if (scelti.length) {
      const v = scelti[Math.floor(Math.random() * scelti.length)];
      pescatiDiRecente.push(v.tipo + v.id);
      if (pescatiDiRecente.length > 12) pescatiDiRecente.shift();
      return v;
    }
  }
  return null;
}

    ingressi: leggi("samsungvd.mediaInputSource", "supportedInputSourcesMap") || [],
    immagine: leggi("custom.picturemode", "pictureMode"),

// Film e serie hanno due liste diverse (92 e 67): le unisco, perche'
// un abbonamento vale per entrambi.
async function caricaProvider(forza = false) {
  if (!forza && Object.keys(PROVIDER).length) return PROVIDER;
  const unione = {};
  for (const tipo of ["movie", "tv"]) {
    const d = await tmdb("/watch/providers/" + tipo,
                         { language: LINGUA, watch_region: PAESE });
    (d.results || []).forEach(p => {
      const id = String(p.provider_id);
      const pri = p.display_priority === undefined ? 999 : p.display_priority;
      if (!unione[id] || pri < unione[id].pri)
        unione[id] = { nome: p.provider_name, logo: p.logo_path, pri };
    });
  }
  PROVIDER = unione;
  localStorage.setItem("provider", JSON.stringify(PROVIDER));
  return PROVIDER;
}

async function generi(tipo) {
  const memoria = "generi_" + tipo;
  const salvati = sessionStorage.getItem(memoria);
  if (salvati) return JSON.parse(salvati);
  const dati = await tmdb("/genre/" + tipo + "/list", { language: LINGUA });
  const lista = dati.genres || [];
  sessionStorage.setItem(memoria, JSON.stringify(lista));

function normalizza(v, tipoNoto) {
  const tipo = tipoNoto || v.media_type;
  return {
    id: v.id, tipo,
    titolo: v.title || v.name || "?",
    anno: (v.release_date || v.first_air_date || "").slice(0, 4),
    voto: v.vote_average || 0,
    locandina: v.poster_path,
  };
}

async function cercaTitoli(query) {
  const dati = await tmdb("/search/multi", { query, language: LINGUA, include_adult: "false" });
  return (dati.results || [])
    .filter(v => v.media_type === "movie" || v.media_type === "tv")
    // TMDB non ordina per rilevanza: senza questo "Bikini Inception"
    // finisce sopra "Inception".
    .sort((a, b) => (b.popularity || 0) - (a.popularity || 0))
    .slice(0, 12)
    .map(v => normalizza(v));
}

async function scheda(tipo, id) {
  const d = await tmdb("/" + tipo + "/" + id, {
    language: LINGUA,
    append_to_response: "credits,watch/providers,videos,keywords",
  });
  const italia = ((d["watch/providers"] || {}).results || {})[PAESE] || {};

  const miei = chiavi.servizi;

  // flatrate vuole l'abbonamento. free e ads NO, per definizione: se
  // un titolo e' gratis su Plex o Rai Play lo puoi guardare adesso,
  // anche se Plex non e' fra i tuoi servizi. Prima chiedevo
  // l'abbonamento anche per quelli e rispondevo "non e' nei tuoi
  // abbonamenti" su roba guardabile subito e gratis.
  const compresi = [], visti = new Set();
  let cePaga = false;
  for (const t of COMPRESI)
    for (const p of italia[t] || []) {
      const pid = String(p.provider_id);
      const vale = t === "flatrate" ? miei.includes(pid) : true;
      if (vale && !visti.has(pid)) {
        visti.add(pid);
        if (t === "flatrate") cePaga = true;
        compresi.push({
          pid, come: TIPI[t], gratis: t !== "flatrate", logo: p.logo_path,
          nome: (MAPPA[pid] || {}).nome || p.provider_name,
          app: (MAPPA[pid] || {}).app || null,
        });
      }
    }

  // "altrove" e' solo l'abbonamento che non hai: il gratis non e'
  // altrove, e' qui.
  const altrove = [...new Set((italia.flatrate || [])
    .filter(p => !miei.includes(String(p.provider_id)))
    .map(p => p.provider_name))].sort();
  const pagando = [...new Set(PAGANDO.flatMap(t =>
    (italia[t] || []).map(p => p.provider_name)))].sort().slice(0, 5);

  const durata = tipo === "movie"
    ? (d.runtime ? d.runtime + " min" : "")
    : (d.number_of_seasons ? d.number_of_seasons + (d.number_of_seasons === 1 ? " stagione" : " stagioni") : "");

  // Trailer: prima in italiano, che TMDB ce l'ha spesso. Se non c'e',
  // ripiego sull'inglese con una seconda chiamata, non prima.
  const scegliVideo = lista => {
    const yt = (lista || []).filter(v => v.site === "YouTube");
    return yt.find(v => v.type === "Trailer" && v.official)
        || yt.find(v => v.type === "Trailer")
        || yt.find(v => v.type === "Teaser")
        || null;
  };
  let video = scegliVideo(((d.videos || {}).results) || []);
  if (!video) {
    try {
      const altri = await tmdb("/" + tipo + "/" + id + "/videos", { language: "en-US" });
      video = scegliVideo(altri.results);
    } catch (e) { /* senza trailer si vive */ }
  }

  return {
    tipo, id, video,
    titolo: d.title || d.name || "?",
    anno: (d.release_date || d.first_air_date || "").slice(0, 4),
    voto: d.vote_average || 0,
    quanti: d.vote_count || 0,
    durata,
    generi: (d.genres || []).map(g => g.name),
    trama: d.overview || "",
    locandina: d.poster_path,
    sfondo: d.backdrop_path,
    cast: ((d.credits || {}).cast || []).slice(0, 10).map(a => ({
      id: a.id, nome: a.name, ruolo: a.character, foto: a.profile_path,
    })),
    // Il regista: per i film sta nella crew, per le serie in created_by.
    regia: tipo === "movie"
      ? ((d.credits || {}).crew || [])
          .filter(c => c.job === "Director")
          .map(c => ({ id: c.id, nome: c.name, foto: c.profile_path }))
      : (d.created_by || []).map(c => ({ id: c.id, nome: c.name, foto: c.profile_path })),
    // Le keyword servono per i titoli simili: piu' precise dei generi.
    keyword: (((d.keywords || {}).keywords) || ((d.keywords || {}).results) || [])
      .slice(0, 3).map(k => String(k.id)),
    generiId: (d.genres || []).map(g => String(g.id)),
    compresi, altrove, pagando, cePaga,
    niente: !Object.keys(italia).length,
    // solo per i film: le serie non hanno collezioni (verificato)
    saga: d.belongs_to_collection
      ? { id: d.belongs_to_collection.id, nome: d.belongs_to_collection.name }
      : null,
    // solo per le serie
    stato: d.status || "",
    prossimo: d.next_episode_to_air || null,
    ultimo: d.last_episode_to_air || null,
    quantiEpisodi: d.number_of_episodes || 0,
    stagioni: (d.seasons || [])
      // la stagione 0 sono gli speciali: la tengo solo se ha episodi
      .filter(x => x.season_number > 0 || x.episode_count > 0)
      .map(x => ({
        numero: x.season_number, nome: x.name,
        quanti: x.episode_count, anno: (x.air_date || "").slice(0, 4),
        locandina: x.poster_path,
      })),
  };
}


// Una persona: film filtrati da TMDB, serie no.
// /discover/movie accetta with_cast e with_crew. /discover/tv li
// IGNORA in silenzio (verificato: restituisce lo stesso totale che
// senza filtro), quindi per le serie prendo i crediti della persona
// e controllo la disponibilita' una per una.
async function personaDati(id) {
  const miei = chiavi.servizi;
  const comuni = {
    language: LINGUA, watch_region: PAESE,
    with_watch_providers: miei.join("|"),
    with_watch_monetization_types: COMPRESI.join("|"),
    sort_by: "popularity.desc", include_adult: "false",
  };

  const [p, comeAttore, comeRegista] = await Promise.all([
    tmdb("/person/" + id, { language: LINGUA, append_to_response: "combined_credits" }),
    tmdb("/discover/movie", { ...comuni, with_cast: id }),
    tmdb("/discover/movie", { ...comuni, with_crew: id }),
  ]);

  const crediti = [...((p.combined_credits || {}).cast || []),
                   ...((p.combined_credits || {}).crew || [])];
  const visteSerie = new Set();
  const candidate = crediti
    .filter(c => c.media_type === "tv" && !visteSerie.has(c.id) && visteSerie.add(c.id))
    .sort((a, b) => (b.popularity || 0) - (a.popularity || 0))
    .slice(0, 12);

  // 12 chiamate in parallelo: piu' lente di una, ma e' l'unico modo
  // di sapere se una serie e' fra i tuoi abbonamenti.
  const serie = (await Promise.all(candidate.map(async c => {
    try {
      const d = await tmdb("/tv/" + c.id + "/watch/providers");
      const italia = (d.results || {})[PAESE] || {};
      const dentro = COMPRESI.some(t =>
        (italia[t] || []).some(x => miei.includes(String(x.provider_id))));
      return dentro ? normalizza(c, "tv") : null;
    } catch (e) { return null; }
  }))).filter(Boolean);

  return {
    nome: p.name,
    foto: p.profile_path,
    mestiere: p.known_for_department === "Directing" ? "Regia" :
              p.known_for_department === "Acting" ? "Interprete" : (p.known_for_department || ""),
    film: (comeAttore.results || []).map(v => normalizza(v, "movie")),
    regia: (comeRegista.results || []).map(v => normalizza(v, "movie")),
    serie,
  };
}

// La saga di un film, con la disponibilita' di ogni capitolo.
// Le parti arrivano in ordine sparso (verificato: 2008, 2012, 2005),
// quindi le ordino per data. Una chiamata per capitolo, in parallelo:
// le saghe sono piccole, e sapere QUALI capitoli hai vale il costo.
async function sagaCompleta(saga, idCorrente) {
  const c = await tmdb("/collection/" + saga.id, { language: LINGUA });
  const miei = chiavi.servizi;
  const parti = (c.parts || [])
    .filter(p => p.id)
    .sort((a, b) => (a.release_date || "9999").localeCompare(b.release_date || "9999"));

  const conDisponibilita = await Promise.all(parti.map(async p => {
    const base = { ...normalizza(p, "movie"), questo: String(p.id) === String(idCorrente) };
    try {
      const d = await tmdb("/movie/" + p.id + "/watch/providers");
      const italia = (d.results || {})[PAESE] || {};
      base.tua = COMPRESI.some(t => (italia[t] || []).some(x =>
        t === "flatrate" ? miei.includes(String(x.provider_id)) : true));
    } catch (e) { base.tua = false; }
    return base;
  }));

  return { nome: c.name || saga.nome, parti: conDisponibilita };
}

// Simili: uso le keyword del titolo, che sono piu' precise dei generi,
// e ripiego sui generi se non ce ne sono. Filtrato sui tuoi servizi.
async function simili(d) {
  const p = {
    language: LINGUA, watch_region: PAESE,
    with_watch_providers: chiavi.servizi.join("|"),
    with_watch_monetization_types: COMPRESI.join("|"),
    sort_by: "popularity.desc", include_adult: "false",
  };
  if (d.keyword.length) p.with_keywords = d.keyword.join("|");
  else if (d.generiId.length) p.with_genres = d.generiId.slice(0, 2).join(",");
  else return [];
  const r = await tmdb("/discover/" + d.tipo, p);
  return (r.results || [])
    .filter(v => String(v.id) !== String(d.id))
    .slice(0, 12)
    .map(v => normalizza(v, d.tipo));
}

let scheda_attiva = "sfoglia";
let F = { tipo: "movie", genere: "", keyword: "", ordine: "popularity.desc",
          servizio: "", decennio: "Tutti", durata: "Qualsiasi" };
let filtri_aperti = false;
let osservatore = null;

// Con la paginazione, tornare indietro da una scheda non deve
// farti ripartire dalla prima pagina: tengo cio' che era caricato.
let cache = { chiave: "", elementi: [], pagina: 0, pagine: 1, totale: 0, scroll: 0 };

// Ogni render di Sfoglia prende un numero. Le risposte che arrivano
// dopo che ne e' partito un altro vengono scartate, altrimenti
// disegnano dentro un contenitore che non e' piu' nel documento e la
// schermata resta col girello per sempre. Succedeva davvero: al
// caricamento parte un render, e se tocchi una pastiglia mentre il
// primo e' in volo ne parte un secondo.
let generazione = 0;
const chiaveFiltri = () => JSON.stringify(F);

function quantiFiltri() {
  return (F.keyword ? 1 : 0) + (F.servizio ? 1 : 0) +
         (F.decennio !== "Tutti" ? 1 : 0) + (F.ordine !== "popularity.desc" ? 1 : 0) +
         (F.durata !== "Qualsiasi" ? 1 : 0);
}

function vai(nome) {
  pulisciIndirizzo();
  if (osservatore) { osservatore.disconnect(); osservatore = null; }
  scheda_attiva = nome;
  nav.querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.scheda === nome)));
  if (nome !== "sfoglia") window.scrollTo(0, 0);
  if (nome === "sfoglia") schermoSfoglia();
  else if (nome === "cerca") schermoCerca();
  else if (nome === "lista") schermoLista();
  else if (nome === "telecomando") schermoTelecomando();
  else schermoImpostazioni();
}
nav.onclick = e => {
  const b = e.target.closest("button[data-scheda]");
  if (b) vai(b.dataset.scheda);
};

function grigliaDi(elementi, mostraMio = false) {
  const g = el("div", "griglia");
  elementi.forEach(v => {
    const c = el("button", "carta" +
      (v.tua === false ? " nonTua" : "") + (v.questo ? " questo" : ""));
    const distintivo = mostraMio && v.mio
      ? '<span class="voto">' + "★".repeat(v.mio) + "</span>"
      : (v.voto ? '<span class="voto">' + v.voto.toFixed(1) + "</span>" : "");
    c.innerHTML =
      '<div class="tela">' +
        (v.locandina ? locandina(v.locandina) : '<div class="manca">' + esc(v.titolo) + "</div>") +
        distintivo +
      "</div>" +
      "<h3>" + esc(v.titolo) + "</h3>" +
      '<p>' + (v.anno || "—") + "</p>";
    c.onclick = () => { cache.scroll = window.scrollY; schermoDettaglio(v.tipo, v.id); };
    g.appendChild(c);
  });
  return g;
}

function fasciaChip(voci, attuale, scegli) {
  const f = el("div", "generi");
  voci.forEach(({ etichetta, valore }) => {
    const b = el("button", "chip", esc(etichetta));
    b.setAttribute("aria-pressed", String(valore === attuale));
    b.onclick = () => scegli(valore);
    f.appendChild(b);
  });
  return f;
}

function pannelloFiltri() {
  const p = el("div", "pannello");

  const gruppo = (titolo, voci, attuale, scegli) => {
    const g = el("div", "gruppo");
    g.appendChild(el("span", null, titolo));
    const sc = el("div", "scelte");
    voci.forEach(({ etichetta, valore }) => {
      const b = el("button", "chip", esc(etichetta));
      b.setAttribute("aria-pressed", String(valore === attuale));
      b.onclick = () => scegli(valore);
      sc.appendChild(b);
    });
    g.appendChild(sc);
    return g;
  };

  // I sottogeneri stavano in una fila di pastiglie identica a quella
  // dei generi, senza etichetta: non si capiva che erano due cose
  // diverse, e costavano 48px prima del contenuto. Sono un filtro,
  // quindi stanno qui.
  p.appendChild(gruppo("Sottogenere",
    [{ etichetta: "Tutti", valore: "" },
     ...SOTTOGENERI.map(k => ({ etichetta: k.n, valore: k.k }))],
    F.keyword, v => { F.keyword = v; schermoSfoglia(); }));

  p.appendChild(gruppo("Ordine",
    ORDINI.map(o => ({ etichetta: o.n, valore: o.v })), F.ordine,
    v => { F.ordine = v; schermoSfoglia(); }));

  p.appendChild(gruppo("Servizio",
    [{ etichetta: "Tutti i miei", valore: "" },
     ...chiavi.servizi.map(pid => ({
       etichetta: (MAPPA[pid] || {}).nome || nomeProvider(pid), valore: pid }))],
    F.servizio, v => { F.servizio = v; schermoSfoglia(); }));

  p.appendChild(gruppo("Durata",
    (DURATE[F.tipo] || []).map(t => ({ etichetta: t.n, valore: t.n })), F.durata,
    v => { F.durata = v; schermoSfoglia(); }));

  p.appendChild(gruppo("Anni",
    DECENNI.map(d => ({ etichetta: d.n, valore: d.n })), F.decennio,
    v => { F.decennio = v; schermoSfoglia(); }));

  if (quantiFiltri()) {
    const z = el("button", "azzera", "Azzera i filtri");
    z.onclick = () => {
      F = { ...F, keyword: "", servizio: "", decennio: "Tutti",
            ordine: "popularity.desc", durata: "Qualsiasi" };
      schermoSfoglia();
    };
    p.appendChild(z);
  }
  return p;
}

async function schermoSfoglia() {
  if (!chiavi.tmdb) return vai("impostazioni");
  const mia = ++generazione;
  // la richiesta del render precedente, se c'e', si scarta da sola
  sto_caricando = false;
  if (osservatore) { osservatore.disconnect(); osservatore = null; }
  schermo.innerHTML = "";

  // Senza abbonamenti selezionati /discover non filtrerebbe niente e ti
  // mostrerebbe lo scibile: meglio dirlo che fingere.
  if (!chiavi.servizi.length) {
    const p = el("div", "pad");
    p.appendChild(el("h1", "titolone", "TV"));
    p.appendChild(el("p", "nota",
      "Non hai selezionato nessun abbonamento, quindi non posso dirti " +
      "cosa paghi già."));
    const b = el("button", "primario", "Scegli gli abbonamenti");
    b.onclick = () => vai("impostazioni");
    p.appendChild(b);
    schermo.appendChild(p);
    return;
  }

  // I nomi dei servizi nel pannello dei filtri vengono da qui.
  if (!Object.keys(PROVIDER).length) caricaProvider().catch(() => {});

  // ------------------------------------------------------------- capo
  const testa = el("div", "pad");
  const capo = el("div", "capo");
  capo.appendChild(el("h1", "titolone", "TV"));
  const azioni = el("div", "azioni");

  const stasera = el("button", "stasera");
  stasera.innerHTML =
    '<svg viewBox="0 0 24 24"><path d="M12 3l2.4 5.6 6 .5-4.6 4 1.4 5.9L12 15.9 6.8 19l1.4-5.9-4.6-4 6-.5z"/></svg>' +
    "Stasera";
  stasera.setAttribute("aria-label", "Stasera cosa guardiamo");
  stasera.onclick = () => schermoStasera();
  azioni.appendChild(stasera);

  const bf = el("button", "bottoneFiltri",
    "Filtri" + (quantiFiltri() ? " · " + quantiFiltri() : ""));
  bf.setAttribute("aria-expanded", String(filtri_aperti));
  if (quantiFiltri()) bf.classList.add("attivi");
  azioni.appendChild(bf);

  capo.appendChild(azioni);
  testa.appendChild(capo);

  const sw = el("div", "interruttore");
  [["movie", "Film"], ["tv", "Serie"]].forEach(([v, etichetta]) => {
    const b = el("button", null, etichetta);
    b.setAttribute("aria-pressed", String(F.tipo === v));
    // cambiando tipo, genere e sottogenere non valgono piu'
    // le soglie di durata dei film non valgono per le serie
    b.onclick = () => {
      F = { ...F, tipo: v, genere: "", keyword: "", durata: "Qualsiasi" };
      schermoSfoglia();
    };
    sw.appendChild(b);
  });
  testa.appendChild(sw);
  schermo.appendChild(testa);

  // --------------------------------------------------------- generi
  const fasciaGeneri = el("div", "generi");
  schermo.appendChild(fasciaGeneri);

  const zonaFiltri = el("div");
  schermo.appendChild(zonaFiltri);
  if (filtri_aperti) zonaFiltri.appendChild(pannelloFiltri());
  bf.onclick = () => {
    filtri_aperti = !filtri_aperti;
    bf.setAttribute("aria-expanded", String(filtri_aperti));
    zonaFiltri.innerHTML = "";
    if (filtri_aperti) zonaFiltri.appendChild(pannelloFiltri());
  };

  const contenitore = el("div");
  schermo.appendChild(contenitore);

  try {
    const lista = await generi(F.tipo);
    [{ id: "", name: "Tutto" }, ...lista].forEach(g => {
      const b = el("button", "chip", esc(g.name));
      b.setAttribute("aria-pressed", String(String(g.id) === F.genere));
      b.onclick = () => { F.genere = String(g.id); schermoSfoglia(); };
      fasciaGeneri.appendChild(b);
    });
  } catch (e) {
    contenitore.innerHTML = '<p class="vuoto">' + esc(e.message) + "</p>";
    return;
  }

  // Cache valida: rimetto quello che c'era e torno dove eri.
  if (mia !== generazione) return;
  if (cache.chiave === chiaveFiltri() && cache.elementi.length) {
    disegnaGriglia(contenitore);
    requestAnimationFrame(() => window.scrollTo(0, cache.scroll));
    return;
  }

  cache = { chiave: chiaveFiltri(), elementi: [], pagina: 0, pagine: 1, totale: 0, scroll: 0 };
  window.scrollTo(0, 0);
  contenitore.innerHTML = '<div class="caricamento"><div class="giro"></div></div>';
  await prossimaPagina(contenitore, true, mia);
}

let sto_caricando = false;

async function prossimaPagina(contenitore, prima = false, gen = generazione) {
  if (gen !== generazione) return;
  if (sto_caricando || (!prima && cache.pagina >= cache.pagine)) return;
  sto_caricando = true;
  try {
    const r = await sfoglia(F, cache.pagina + 1);
    if (gen !== generazione) return;   // arrivata tardi: la schermata e' cambiata
    cache.pagina += 1;
    cache.pagine = r.pagine;
    cache.totale = r.totale;
    // TMDB puo' ripetere titoli fra pagine quando l'ordine cambia
    const visti = new Set(cache.elementi.map(x => x.tipo + x.id));
    r.elementi.forEach(x => { if (!visti.has(x.tipo + x.id)) cache.elementi.push(x); });
    const dov_ero = window.scrollY;
    disegnaGriglia(contenitore);
    if (!prima) window.scrollTo(0, dov_ero);
  } catch (e) {
    if (gen === generazione)
      contenitore.innerHTML = '<p class="vuoto">' + esc(e.message) + "</p>";
  } finally {
    if (gen === generazione) sto_caricando = false;
  }
}

function disegnaGriglia(contenitore) {
  contenitore.innerHTML = "";
  if (!cache.elementi.length) {
    contenitore.appendChild(el("p", "vuoto",
      "Niente con questi filtri fra i tuoi abbonamenti.\nProva ad allargare."));
    return;
  }

  const intestazione = el("p", "sezione pad");
  intestazione.innerHTML = "Compreso nei tuoi abbonamenti " +
    '<span class="conteggio">· ' + cache.totale.toLocaleString("it-IT") + " titoli</span>";
  contenitore.appendChild(intestazione);
  contenitore.appendChild(grigliaDi(cache.elementi));

  if (cache.pagina < cache.pagine) {
    const s = el("div", "sentinella");
    contenitore.appendChild(s);

    // Pulsante esplicito: l'IntersectionObserver qui sotto carica da
    // solo quando la pagina e' visibile, ma non scatta se il documento
    // e' nascosto (verificato: visibilityState hidden = zero callback).
    // Il pulsante funziona sempre, e su un telefono e' anche piu' gentile
    // che scaricare pagine da solo.
    const b = el("button", "altri",
      "Carica altri titoli · " + cache.elementi.length + " di " +
      cache.totale.toLocaleString("it-IT"));
    b.onclick = async () => {
      b.disabled = true;
      b.textContent = "Carico…";
      await prossimaPagina(contenitore);
    };
    contenitore.appendChild(b);

    if (osservatore) osservatore.disconnect();
    osservatore = new IntersectionObserver(voci => {
      if (voci.some(v => v.isIntersecting)) prossimaPagina(contenitore);
    }, { rootMargin: "600px" });
    osservatore.observe(s);
  } else if (cache.elementi.length > 20) {
    contenitore.appendChild(el("p", "altri", "Finiti: " + cache.elementi.length + " titoli."));
  }
}

// Lo stato di "Stasera" e' suo: non voglio che toccare qui cambi
// i filtri di Sfoglia, e viceversa.
// Si chiama STASERA e non ST perche' ST e' l'URL di SmartThings.
let STASERA = { tipo: "movie", durata: "Qualsiasi", genere: "",
                keyword: "", preferenza: "Popolari", modalita: "scopri" };

const MODALITA = [
  { v: "scopri",   n: "Scopri" },
  { v: "gusto",    n: "Sul mio gusto" },
  { v: "rivedere", n: "Da rivedere" },
];

async function schermoStasera() {
  window.scrollTo(0, 0);
  schermo.innerHTML = "";

  const su = el("button", "indietro", "← Sfoglia");
  su.onclick = () => vai("sfoglia");
  schermo.appendChild(su);

  const pad = el("div", "pad");
  pad.appendChild(el("h1", "titolone", "Stasera"));
  schermo.appendChild(pad);

  if (!chiavi.servizi.length) {
    pad.appendChild(el("p", "nota", "Prima scegli gli abbonamenti in Opzioni."));
    return;
  }

  const fascia = valori => fasciaChip(valori.voci, valori.attuale, valori.scegli);
  const gusto = profiloGusto();

  schermo.appendChild(fascia({
    voci: MODALITA.map(m => ({ etichetta: m.n, valore: m.v })),
    attuale: STASERA.modalita,
    scegli: v => { STASERA.modalita = v; schermoStasera(); },
  }));

  // Ogni modalita' ha bisogno di controlli diversi: mostrarli tutti
  // sempre renderebbe la schermata un pannello di comandi.
  if (STASERA.modalita !== "rivedere") {
    const sw = el("div", "interruttore");
    [["movie", "Film"], ["tv", "Serie"]].forEach(([v, etichetta]) => {
      const b = el("button", null, etichetta);
      b.setAttribute("aria-pressed", String(STASERA.tipo === v));
      b.onclick = () => {
        STASERA = { ...STASERA, tipo: v, durata: "Qualsiasi", genere: "", keyword: "" };
        schermoStasera();
      };
      sw.appendChild(b);
    });
    const p2 = el("div", "pad");
    p2.appendChild(sw);
    schermo.appendChild(p2);

    schermo.appendChild(el("p", "sezione pad", "Quanto tempo hai"));
    schermo.appendChild(fascia({
      voci: (DURATE[STASERA.tipo] || []).map(t => ({ etichetta: t.n, valore: t.n })),
      attuale: STASERA.durata,
      scegli: v => { STASERA.durata = v; schermoStasera(); },
    }));
  }

  if (STASERA.modalita === "scopri") {
    const zonaGeneri = el("div");
    schermo.appendChild(el("p", "sezione pad", "Di che genere"));
    schermo.appendChild(zonaGeneri);
    generi(STASERA.tipo).then(lista => {
      zonaGeneri.appendChild(fascia({
        voci: [{ etichetta: "Qualsiasi", valore: "" },
               ...lista.map(g => ({ etichetta: g.name, valore: String(g.id) }))],
        attuale: STASERA.genere,
        scegli: v => { STASERA.genere = v; schermoStasera(); },
      }));
    }).catch(() => {});

    schermo.appendChild(el("p", "sezione pad", "Sottogenere"));
    schermo.appendChild(fascia({
      voci: [{ etichetta: "Qualsiasi", valore: "" },
             ...SOTTOGENERI.map(k => ({ etichetta: k.n, valore: k.k }))],
      attuale: STASERA.keyword,
      scegli: v => { STASERA.keyword = v; schermoStasera(); },
    }));

    schermo.appendChild(el("p", "sezione pad", "Cosa preferisci"));
    schermo.appendChild(fascia({
      voci: PREFERENZE.map(p => ({ etichetta: p.n, valore: p.n })),
      attuale: STASERA.preferenza,
      scegli: v => { STASERA.preferenza = v; schermoStasera(); },
    }));
  }

  if (STASERA.modalita === "gusto") {
    const nomi = [...gusto.generi.map(nomeGenere), ...gusto.keyword.map(nomeKeyword)]
      .filter(Boolean).slice(0, 4);
    const p = el("div", "gusto");
    p.innerHTML = gusto.quanti >= 3 && nomi.length
      ? "Pesco fra <b>" + nomi.map(esc).join(", ") + "</b>, da " + gusto.quanti +
        " titoli che hai votato 4 o 5 stelle."
      : "Mi servono almeno <b>3 titoli votati 4 o 5 stelle</b> per sapere cosa ti piace. " +
        "Ne hai " + gusto.quanti + ": vota dalle schede, poi torna qui.";
    schermo.appendChild(p);
  }

  if (STASERA.modalita === "rivedere") {
    const quanti = visti.tutto.filter(v => (v.mio || 0) >= 4).length;
    const p = el("div", "gusto");
    p.innerHTML = quanti
      ? "Pesco fra i <b>" + quanti + "</b> titoli che hai votato 4 o 5 stelle, " +
        "e ti dico se sono ancora fra i tuoi abbonamenti."
      : "Non hai ancora votato niente con 4 o 5 stelle.";
    schermo.appendChild(p);
  }

  const risultato = el("div", "pescato");
  const pulsante = el("button", "stasera");
  pulsante.style.marginTop = "18px";
  pulsante.innerHTML =
    '<svg viewBox="0 0 24 24"><path d="M12 3l2.4 5.6 6 .5-4.6 4 1.4 5.9L12 15.9 6.8 19l1.4-5.9-4.6-4 6-.5z"/></svg>' +
    "Pescane uno";
  schermo.appendChild(pulsante);
  schermo.appendChild(risultato);

  async function pesca() {
    pulsante.disabled = true;
    pulsante.textContent = "Pesco…";
    risultato.innerHTML = '<div class="caricamento"><div class="giro"></div></div>';
    try {
      let v = null;

      if (STASERA.modalita === "rivedere") {
        // niente rete: i titoli votati ce li ho gia' qui
        const buoni = visti.tutto.filter(x => (x.mio || 0) >= 4);
        if (!buoni.length) {
          risultato.innerHTML = '<p class="nota">Vota qualcosa con 4 o 5 stelle, poi torna.</p>';
          return;
        }
        const nuovi = buoni.filter(x => !pescatiDiRecente.includes(x.tipo + x.id));
        const bacino = nuovi.length ? nuovi : buoni;
        v = bacino[Math.floor(Math.random() * bacino.length)];
        pescatiDiRecente.push(v.tipo + v.id);
        if (pescatiDiRecente.length > 12) pescatiDiRecente.shift();

      } else {
        const pref = PREFERENZE.find(p => p.n === STASERA.preferenza) || PREFERENZE[0];
        const f = { tipo: STASERA.tipo, genere: STASERA.genere, keyword: STASERA.keyword,
                    ordine: pref.ordine, servizio: "",
                    decennio: "Tutti", durata: STASERA.durata };

        if (STASERA.modalita === "gusto") {
          const g = profiloGusto();
          const segnali = [...g.generi.map(x => ({ genere: x })),
                           ...g.keyword.map(x => ({ keyword: x }))];
          if (g.quanti < 3 || !segnali.length) {
            risultato.innerHTML = '<p class="nota">Vota almeno 3 titoli con 4 o 5 stelle ' +
              'e comincio a pescare sul tuo gusto.</p>';
            return;
          }
          // UN segnale per volta, scelto a caso: incrociare generi e
          // keyword in TMDB e' un AND, e restringerebbe a niente.
          const scelto = segnali[Math.floor(Math.random() * segnali.length)];
          f.genere = scelto.genere || "";
          f.keyword = scelto.keyword || "";
          // sul gusto preferisco il voto alto: e' roba che dovrebbe piacerti
          f.ordine = "vote_average.desc";
          v = await pescaUno(f, 10);
        } else {
          v = await pescaUno(f, pref.pagine);
        }

        if (!v) {
          risultato.innerHTML = '<p class="nota">Niente con questi criteri. Allarga il tiro.</p>';
          return;
        }
      }

      await mostraPescato(risultato, v, pesca);
    } catch (e) {
      risultato.innerHTML = '<p class="nota">' + esc(e.message) + "</p>";
    } finally {
      pulsante.disabled = false;
      pulsante.innerHTML =
        '<svg viewBox="0 0 24 24"><path d="M12 3l2.4 5.6 6 .5-4.6 4 1.4 5.9L12 15.9 6.8 19l1.4-5.9-4.6-4 6-.5z"/></svg>' +
        "Pescane un altro";
    }
  }
  pulsante.onclick = pesca;
}

// subito. Tutto cio' che esce da qui e' per costruzione fra i tuoi
// abbonamenti, quindi il verdetto non serve ridirlo.
async function mostraPescato(dove, v, ripesca) {

      ? '<div class="meta" style="margin-top:6px">Su <b>' +

  dove.appendChild(apri);
}

// Cerca si ricordava niente: cercavi, aprivi un film, tornavi, e
// dovevi riscrivere. Sfoglia la cache l'aveva, qui no.
let ultimaRicerca = { q: "", risultati: [], scroll: 0 };

function schermoCerca() {
  schermo.innerHTML = "";
  const testa = el("div", "pad");
  testa.appendChild(el("h1", "titolone", "Cerca"));
  schermo.appendChild(testa);

  const barra = el("div", "barraRicerca");
  const input = el("input");
  input.type = "search";
  input.placeholder = "Film o serie";
  input.autocomplete = "off";
  input.enterKeyHint = "search";
  input.setAttribute("aria-label", "Titolo da cercare");
  barra.appendChild(input);
  schermo.appendChild(barra);

  const esiti = el("div");
  schermo.appendChild(esiti);

  let ultima = 0;

  function disegnaEsiti(risultati) {
    esiti.innerHTML = "";
    if (!risultati.length) {
      esiti.appendChild(el("p", "vuoto", "Nessun titolo con questo nome.\nProva a scriverlo diversamente."));
      return;
    }
    const lista = el("div", "pad");
    risultati.forEach(v => {
      const r = el("button", "riga");
      r.innerHTML =
        '<div class="mini">' + locandina(v.locandina, "w154") + "</div>" +
        '<div class="dati"><b>' + esc(v.titolo) + "</b><span>" +
        (v.tipo === "tv" ? "Serie" : "Film") + (v.anno ? " · " + v.anno : "") +
        (v.voto ? " · " + v.voto.toFixed(1) : "") + "</span></div>";
      r.onclick = () => {
        ultimaRicerca.scroll = window.scrollY;
        schermoDettaglio(v.tipo, v.id, () => vai("cerca"));
      };
      lista.appendChild(r);
    });
    esiti.appendChild(lista);
  }

  // rientrando, rimetto quello che c'era
  if (ultimaRicerca.q) {
    input.value = ultimaRicerca.q;
    disegnaEsiti(ultimaRicerca.risultati);
    requestAnimationFrame(() => window.scrollTo(0, ultimaRicerca.scroll));
  } else {
    esiti.appendChild(el("p", "vuoto", "Scrivi un titolo.\nTi dico se lo paghi già."));
  }

  const lancia_ricerca = async () => {
    const q = input.value.trim();
    if (!q) {
      ultimaRicerca = { q: "", risultati: [], scroll: 0 };
      esiti.innerHTML = '<p class="vuoto">Scrivi un titolo.</p>';
      return;
    }
    const mio = ++ultima;
    esiti.innerHTML = '<div class="caricamento"><div class="giro"></div></div>';
    try {
      const risultati = await cercaTitoli(q);
      if (mio !== ultima) return;            // digitazione piu' recente
      ultimaRicerca = { q, risultati, scroll: 0 };
      disegnaEsiti(risultati);
    } catch (e) {
      if (mio === ultima) esiti.innerHTML = '<p class="vuoto">' + esc(e.message) + "</p>";
    }
  };

  let attesa;
  input.oninput = () => { clearTimeout(attesa); attesa = setTimeout(lancia_ricerca, 420); };
  input.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); clearTimeout(attesa); input.blur(); lancia_ricerca(); } };
  // se sto rimettendo una ricerca vecchia non apro la tastiera in faccia
  if (!ultimaRicerca.q) input.focus();
}

// Il pulsante "Apri X sulla TV". Estratto perche' serve sia nella
// scheda sia nel pescato di Stasera.
function pulsanteLancio(i, d) {
  const b = el("button", "apri");
  b.innerHTML =
    (i.logo ? '<img class="logo" src="' + IMG + "/w92" + i.logo + '" alt="">' : '<span class="logo"></span>') +
    '<span class="etichetta">Apri ' + esc(i.nome) + " sulla TV<small>Poi cerca il titolo col telecomando</small></span>";
  b.onclick = async () => {
    b.disabled = true;
    b.querySelector(".etichetta").innerHTML = "Apro " + esc(i.nome) + "…<small>Controllo che si apra davvero</small>";
    try {
      if (await lancia(i.app)) {
        b.className = "apri fatto";
        const p = await provaPonte();
        b.querySelector(".etichetta").innerHTML = esc(i.nome) + " è aperta<small>" +
          (p ? "Apri la ricerca nell'app, poi scrivi il titolo qui sotto"
             : "Ora cerca «" + esc(d.titolo) + "»") + "</small>";
        // Il ponte locale c'e': posso scrivere il titolo io, invece
        // di farglielo battere col telecomando.
        if (p && !b.parentElement.querySelector(".scriviTitolo")) {
          const sb = el("button", "apri scriviTitolo");
          sb.innerHTML = '<span class="logo"></span><span class="etichetta">Scrivi «' +
            esc(d.titolo) + '» sulla TV<small>Prima metti a fuoco il campo di ricerca</small></span>';
          sb.onclick = async () => {
            sb.disabled = true;
            const et = sb.querySelector(".etichetta");
            et.innerHTML = "Scrivo…";
            try {
              await scriviSullaTv(d.titolo);
              sb.className = "apri fatto scriviTitolo";
              et.innerHTML = "Scritto<small>Se sulla TV non si vede, il campo non era a fuoco</small>";
            } catch (e) {
              sb.className = "apri male scriviTitolo";
              et.innerHTML = esc(e.message) + "<small>Tocca per riprovare</small>";
            }
            sb.disabled = false;
          };
          b.after(sb);
        }
      } else {
        b.className = "apri male";
        b.disabled = false;
        b.querySelector(".etichetta").innerHTML =
          "La TV non ha aperto l'app<small>È accesa? Tocca per riprovare</small>";
      }
    } catch (e) {
      b.className = "apri male";
      b.disabled = false;
      b.querySelector(".etichetta").innerHTML = esc(e.message) + "<small>Tocca per riprovare</small>";
    }
  };
  // l'append lo fa chi chiama: questa funzione serve sia alla scheda
  // sia al pescato di Stasera
  return b;
}

      '<div class="via"><span><svg viewBox="0 0 24 24"><path d="M7 4.5l12 7.5-12 7.5z"/></svg></span></div>' +
      '<div class="quale">' + esc(d.video.name) + "</div>";

        esc(d.video.key) + '?autoplay=1&rel=0" allow="autoplay; fullscreen; encrypted-media" ' +

    blocco.innerHTML = '<p class="domanda">' +
      (mio ? "L'hai visto. Quanto ti è piaciuto?" : "L'hai già visto? Dai un voto.") + "</p>";
    const fila = el("div", "stelle");

        visti.segna({

          d.ultimo.episode_number + " · " + esc(quandoEsce(d.ultimo.air_date)) + "</p>" : "");
    }
    pad.appendChild(box);

    if (d.stagioni.length) {
      pad.appendChild(el("p", "sezione", "Stagioni"));
      d.stagioni.forEach(st => {
        const r = el("button", "riga");
        r.innerHTML =
          '<div class="mini">' + locandina(st.locandina, "w154") + "</div>" +
          '<div class="dati"><b>' + esc(st.nome) + "</b><span>" +
          st.quanti + (st.quanti === 1 ? " episodio" : " episodi") +
          (st.anno ? " · " + st.anno : "") + "</span></div>";
        r.onclick = () => schermoStagione(d, st);
        pad.appendChild(r);
      });
    }
  }

  if (d.regia.length) {
    pad.appendChild(el("p", "sezione", d.regia.length > 1 ? "Regia" : "Regia"));
    const fila = el("div", "cast");
    fila.style.padding = "2px 0 6px";
    d.regia.forEach(r => {
      const x = el("button", "attore");
      x.innerHTML =
        '<div class="faccia">' + (r.foto ? locandina(r.foto, "w185") : esc((r.nome || "?")[0])) + "</div>" +
        "<b>" + esc(r.nome) + "</b>";
      x.onclick = () => schermoPersona(r.id, () => schermoDettaglio(d.tipo, d.id));
      fila.appendChild(x);
    });
    pad.appendChild(fila);
  }

  if (d.generi.length) {
    pad.appendChild(el("p", "sezione", "Generi"));
    pad.appendChild(el("p", "meta", esc(d.generi.join(" · "))));
  }
  if (d.trama) {
    pad.appendChild(el("p", "sezione", "Trama"));
    pad.appendChild(el("p", "trama", esc(d.trama)));
  }
  if (d.cast.length) {
    schermo.appendChild(el("p", "sezione pad", "Cast"));
    const fila = el("div", "cast");
    d.cast.forEach(a => {
      const x = el("button", "attore");
      x.innerHTML =
        '<div class="faccia">' + (a.foto ? locandina(a.foto, "w185") : esc((a.nome || "?")[0])) + "</div>" +
        "<b>" + esc(a.nome) + "</b>" + (a.ruolo ? "<span>" + esc(a.ruolo) + "</span>" : "");
      x.onclick = () => schermoPersona(a.id, () => schermoDettaglio(d.tipo, d.id));
      fila.appendChild(x);
    });
    schermo.appendChild(fila);
  }

  // La saga: arriva dopo, come i simili.
  if (d.saga) {
    const zonaSaga = el("div");
    schermo.appendChild(zonaSaga);
    sagaCompleta(d.saga, d.id).then(s => {
      if (s.parti.length < 2) return;

      zonaSaga.appendChild(el("p", "sezione pad", esc(s.nome)));

          "abbonamenti. Gli altri sono sbiaditi.";
      zonaSaga.appendChild(p);

  schermo.appendChild(zonaSimili);

    if (!altri.length) return;

      d.keyword.length ? "Simili, e li paghi già" : "Dello stesso genere, e li paghi già"));
    zonaSimili.appendChild(grigliaDi(altri));
  }).catch(() => {});
}

async function schermoStagione(serie, stagione) {

  } catch (e) { return vuoto(e.message); }

      '<div class="dati"><b>' + e.episode_number + ". " + esc(e.name || "") + "</b>" +

// Le serie della lista: quando escono i prossimi episodi.
// Una chiamata per serie, in parallelo. Il risultato resta in
// sessionStorage per non rifarle a ogni apertura della scheda Lista.
async function inArrivo(voci) {
  const serie = voci.filter(v => v.tipo === "tv");
  if (!serie.length) return [];

  const memoria = "arrivo_" + serie.map(v => v.id).sort().join(",");
  const salvato = sessionStorage.getItem(memoria);
  if (salvato) { try { return JSON.parse(salvato); } catch (e) { /* si rifa' */ } }

  const esiti = await Promise.all(serie.map(async v => {
    try {
      const d = await tmdb("/tv/" + v.id, { language: LINGUA });
      const p = d.next_episode_to_air;
      if (!p || !p.air_date) return null;
      return {
        id: v.id, titolo: v.titolo, locandina: v.locandina,
        stagione: p.season_number, episodio: p.episode_number,
        nome: p.name || "", data: p.air_date,
      };
    } catch (e) { return null; }
  }));

  const lista = esiti.filter(Boolean).sort((a, b) => a.data.localeCompare(b.data));
  sessionStorage.setItem(memoria, JSON.stringify(lista));
  return lista;
}

// I nomi dei generi stanno in sessionStorage da quando hai sfogliato:
// se non ci sono ancora, mostro l'id invece di fare una chiamata.
function nomeGenere(id) {
  for (const tipo of ["movie", "tv"]) {
    try {
      const l = JSON.parse(sessionStorage.getItem("generi_" + tipo) || "[]");
      const g = l.find(x => String(x.id) === String(id));
      if (g) return g.name;
    } catch (e) { /* pazienza */ }
  }
  return null;
}
function nomeKeyword(k) {
  const v = SOTTOGENERI.find(x => x.k === String(k));
  return v ? v.n : null;
}

// Ricevere una lista da qualcuno. I titoli arrivano come numeri:
// i dati li prendo da TMDB, e per i visti prendo anche generi e
