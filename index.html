/* ----------------------------------------------------- LA FAMIGLIA

   Due telefoni, la stessa casa. Cosa si divide e cosa no non e' una
   scelta tecnica:

     lista e spunte notte  SONO DI CASA. Una lista di cose da vedere
                           in due esemplari non e' una lista.
     i voti                RESTANO DI CHI LI DA', ma si vedono
                           entrambi. I tuoi cinque stelle non sono i
                           suoi, e mediarli darebbe un profilo di
                           gusto che non e' di nessuno.

   Il magazzino e' una tabella di Supabase. Niente di acceso in casa,
   e niente chiavi nel codice pubblicato: indirizzo e chiave si
   incollano su ogni telefono.

   La regola quando i due telefoni non sono d'accordo: vince il piu'
   RECENTE, riga per riga. E cancellare e' un fatto con un'ora, non
   un'assenza - vedi `tombe`, senza cui quello che togli qui torna
   su da la'.                                                      */

const SQL_FAMIGLIA = `create table if not exists voci (
  famiglia text not null,
  chi text not null default '',
  cosa text not null,
  tipo text not null,
  id bigint not null,
  valore int not null default 1,
  tolto boolean not null default false,
  titolo text, anno text, locandina text, generi text, keyword text,
  quando bigint not null,
  primary key (famiglia, chi, cosa, tipo, id)
);
alter table voci enable row level security;
create policy "legge" on voci for select using (true);
create policy "scrive" on voci for insert with check (true);
create policy "aggiorna" on voci for update using (true);
grant select, insert, update on voci to anon, authenticated;
notify pgrst, 'reload schema';`;

// I voti DEGLI ALTRI. Stanno in un magazzino a parte di proposito:
// mescolati ai tuoi, «Sul mio gusto» diventerebbe il gusto medio di
// due persone, che non e' il gusto di nessuno.
const altrui = {
  get tutto() {
    try {
      const v = JSON.parse(localStorage.getItem("altrui") || "[]");
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  },
  set tutto(a) { localStorage.setItem("altrui", JSON.stringify(a)); },
  // tutti i voti di un titolo, di chiunque tranne te
  di(tipo, id) {
    return this.tutto.filter(
      x => x.tipo === tipo && String(x.id) === String(id) && x.mio);
  },
  metti(r) {
    const resto = this.tutto.filter(
      x => !(x.chi === r.chi && x.tipo === r.tipo &&
             String(x.id) === String(r.id)));
    this.tutto = r.mio ? [r, ...resto] : resto;
  },
};

const nuvola = {
  get pronta() {
    return !!(chiavi.supaUrl && chiavi.supaChiave && chiavi.famiglia &&
              chiavi.io);
  },
  get ultimoMandato() {
    return Number(localStorage.getItem("ultimo_mandato") || 0);
  },
  set ultimoMandato(v) { localStorage.setItem("ultimo_mandato", String(v)); },
};

// Un codice lungo e casuale, non scelto a mano: il codice E' la
// password, e «casa» come password non e' una password.
function nuovoCodiceFamiglia() {
  const a = "abcdefghijkmnopqrstuvwxyz23456789";
  let c = "";
  for (let i = 0; i < 16; i++)
    c += a[Math.floor(Math.random() * a.length)];
  return c.slice(0, 8) + "-" + c.slice(8);
}

// Da uno dei magazzini locali a una riga della tabella, e ritorno.
function rigaDa(cosa, chi, v, tolto, quando) {
  return {
    famiglia: chiavi.famiglia, chi, cosa,
    tipo: v.tipo, id: Number(v.id),
    valore: cosa === "voto" ? (v.mio || 0) : 1,
    tolto: !!tolto,
    titolo: v.titolo || null, anno: v.anno ? String(v.anno) : null,
    locandina: v.locandina || null,
    generi: (v.generiId || []).join(",") || null,
    keyword: (v.keyword || []).join(",") || null,
    quando: Number(quando || v.quando || 0),
  };
}

function vociDaRiga(r) {
  return {
    tipo: r.tipo, id: r.id, titolo: r.titolo || "", anno: r.anno || "",
    locandina: r.locandina || null,
    generiId: (r.generi || "").split(",").filter(Boolean).map(Number),
    keyword: (r.keyword || "").split(",").filter(Boolean).map(Number),
    quando: Number(r.quando || 0),
  };
}

// Tutto quello che questo telefono ha da dire, cambiato dopo `dopo`.
// Le tombe viaggiano come righe con tolto=true: una cancellazione e'
// un fatto, e se non viaggia l'altro telefono la disfa.
function mieRighe(dopo) {
  const d = Number(dopo || 0);
  const fuori = [];
  lista.tutto.forEach(v => {
    if (v.quando > d) fuori.push(rigaDa("lista", "", v, false));
  });
  dormire.tutto.forEach(v => {
    if (v.quando > d) fuori.push(rigaDa("dormire", "", v, false));
  });
  visti.tutto.forEach(v => {
    if (v.quando > d) fuori.push(rigaDa("voto", chiavi.io, v, false));
  });
  tombe.tutto.forEach(t => {
    if (t.quando > d)
      fuori.push(rigaDa(t.cosa, t.cosa === "voto" ? chiavi.io : "",
                        { tipo: t.tipo, id: t.id }, true, t.quando));
  });
  return fuori;
}

// Applica quello che dice l'altro telefono. Riga per riga, e solo se
// e' piu' recente di quello che sappiamo qui: e' la regola che
// permette a due telefoni di toccare le stesse cose senza un
// arbitro.
function applicaRighe(righe) {
  let cambiato = 0, piuRecente = 0;
  (righe || []).forEach(r => {
    const quando = Number(r.quando || 0);
    if (quando > piuRecente) piuRecente = quando;
    const tipo = r.tipo, id = String(r.id);

    // i voti degli altri: magazzino a parte, non mescolati ai miei
    if (r.cosa === "voto" && r.chi && r.chi !== chiavi.io) {
      const gia = altrui.tutto.find(
        x => x.chi === r.chi && x.tipo === tipo && String(x.id) === id);
      if (gia && Number(gia.quando || 0) >= quando) return;
      altrui.metti(Object.assign(vociDaRiga(r),
        { chi: r.chi, mio: r.tolto ? 0 : Number(r.valore || 0) }));
      cambiato++;
      return;
    }
    // le mie cose, da un altro mio telefono o dal telefono di casa
    const dove = r.cosa === "lista" ? lista
               : r.cosa === "dormire" ? dormire
               : r.cosa === "voto" ? visti : null;
    if (!dove) return;

    const mia = dove.tutto.find(
      x => x.tipo === tipo && String(x.id) === id);
    const miaOra = mia ? Number(mia.quando || 0)
                       : tombe.quando(r.cosa, tipo, id);
    if (miaOra >= quando) return;      // qui sappiamo qualcosa di piu' nuovo

    if (r.tolto) {
      if (mia) dove.togli(tipo, r.id);
      tombe.metti(r.cosa, tipo, id, quando);
      cambiato++;
      return;
    }
    const v = vociDaRiga(r);
    tombe.leva(r.cosa, tipo, id);
    if (r.cosa === "voto") {
      if (mia) visti.togli(tipo, r.id);
      visti.segna(v, Number(r.valore || 0));
      // l'ora e' quella della riga, non di adesso: altrimenti ogni
      // scambio farebbe sembrare tutto appena cambiato, e i due
      // telefoni si rimanderebbero le stesse cose per sempre
      visti.tutto = visti.tutto.map(x =>
        (x.tipo === tipo && String(x.id) === id)
          ? Object.assign({}, x, { quando }) : x);
    } else {
      if (mia) dove.togli(tipo, r.id);
      dove.aggiungi(v);
      dove.tutto = dove.tutto.map(x =>
        (x.tipo === tipo && String(x.id) === id)
          ? Object.assign({}, x, { quando }) : x);
    }
    cambiato++;
  });
  return { cambiato, piuRecente };
}

// Il giro completo: prima si prende, poi si manda. In quest'ordine,
// perche' mandare per primo e poi prendere farebbe tornare indietro
// quello che si e' appena mandato.
// UN SOLO SCAMBIO PER VOLTA. Due giri in volo insieme - l'avvio e
// una modifica appena fatta - si pestano i piedi: avanzano
// `ultimoScambio` e `ultimoMandato` in ordine sparso, e una modifica
// puo' finire dichiarata mandata senza esserlo. Chi chiama durante un
// giro riceve LO STESSO giro.
let scambioInCorso = null;

function scambia() {
  if (scambioInCorso) return scambioInCorso;
  // Il lucchetto si apre DENTRO, in un finally: sbloccandolo con un
  // .then attaccato da fuori si aggiunge un giro di coda, e chi
  // aspettava il primo scambio riceverebbe ancora il vecchio
  // risultato per il suo scambio nuovo.
  scambioInCorso = (async () => {
    try { return await unGiroDiScambio(); }
    finally { scambioInCorso = null; }
  })();
  return scambioInCorso;
}

async function unGiroDiScambio() {
  if (!nuvola.pronta) throw new Error("Manca qualcosa in Opzioni → Famiglia.");
  const capo = {
    apikey: chiavi.supaChiave,
    Authorization: "Bearer " + chiavi.supaChiave,
  };
  const base = indirizzoVoci();

  const preso = await fetch(base + "?famiglia=eq." +
    encodeURIComponent(chiavi.famiglia) + "&quando=gt." + chiavi.ultimoScambio,
    { headers: capo });
  if (!preso.ok) throw new Error(await spiegaSupabase(preso));
  const righe = await preso.json();
  const esito = applicaRighe(righe);
  // L'ora piu' avanti e' quella delle RIGHE, non l'orologio di questo
  // telefono: due telefoni non hanno lo stesso orologio, e usare il
  // proprio farebbe perdere le righe scritte "nel passato".
  if (esito.piuRecente > chiavi.ultimoScambio)
    chiavi.ultimoScambio = esito.piuRecente;

  const daMandareOra = mieRighe(nuvola.ultimoMandato);
  if (daMandareOra.length) {
    const messo = await fetch(base, {
      method: "POST",
      headers: Object.assign({}, capo, {
        "Content-Type": "application/json",
        Prefer: "resolution=merge-duplicates",
      }),
      body: JSON.stringify(daMandareOra),
    });
    if (!messo.ok) throw new Error(await spiegaSupabase(messo));
    // si avanza SOLO se e' andata: se si avanzasse comunque, un
    // errore di rete perderebbe le modifiche per sempre
    nuvola.ultimoMandato = daMandareOra.reduce(
      (m, r) => Math.max(m, r.quando), nuvola.ultimoMandato);
  }
  return { presi: righe.length, applicati: esito.cambiato,
           mandati: daMandareOra.length };
}

// Prova il collegamento e DICE cosa non va. Serve perche' i modi di
// sbagliare sono quattro e danno tutti «non funziona»: l'indirizzo,
// la chiave, la tabella che non c'e', e la tabella che c'e' ma non e'
// ancora stata esposta.
async function provaFamiglia() {
  const dove = indirizzoVoci() + "?limit=1";
  if (!chiavi.supaUrl)
    return { ok: false, verdetto: "Manca l\u2019indirizzo del progetto.",
             dove };
  if (!chiavi.supaChiave)
    return { ok: false, verdetto: "Manca la chiave anon.", dove };
  if (!chiavi.famiglia)
    return { ok: false, verdetto: "Manca il codice famiglia.", dove };
  if (!chiavi.io)
    return { ok: false, verdetto: "Manca il tuo nome: i voti restano di " +
             "chi li d\u00e0, e senza nome non si sa di chi sono.", dove };

  let r;
  try {
    r = await fetch(dove, {
      headers: {
        apikey: chiavi.supaChiave,
        Authorization: "Bearer " + chiavi.supaChiave,
      },
    });
  } catch (e) {
    return { ok: false, dove, verdetto:
      "Non arrivo a quell\u2019indirizzo. \u00c8 scritto giusto, e sei " +
      "in rete? (" + (e.message || "rete") + ")" };
  }

  let corpo = "";
  try { corpo = (await r.text()).slice(0, 300); } catch (e) { /* pazienza */ }

  if (r.status === 404)
    return { ok: false, dove, verdetto:
      "Arrivo al progetto, ma la tabella <b>voci</b> non c\u2019\u00e8. " +
      "Due cause, in ordine di frequenza:<br>" +
      "1. l\u2019SQL non \u00e8 stato eseguito, o \u00e8 andato in " +
      "errore a met\u00e0 (guarda il riquadro rosso nell\u2019SQL " +
      "Editor);<br>" +
      "2. la tabella c\u2019\u00e8 ma l\u2019API non la vede ancora: " +
      "su Supabase vai in <b>Settings \u203a API</b> e premi " +
      "<b>Reload schema</b>, oppure riesegui l\u2019ultima riga " +
      "dell\u2019SQL.", corpo };
  if (r.status === 401 || r.status === 403)
    return { ok: false, dove, verdetto:
      "Arrivo al progetto, ma la chiave non va (" + r.status + "). " +
      "Deve essere la chiave <b>anon public</b>, non la service_role e " +
      "non la password del database.", corpo };
  if (!r.ok)
    return { ok: false, dove, verdetto: "Supabase ha risposto " + r.status +
             ".", corpo };

  let righe = null;
  try { righe = JSON.parse(corpo); } catch (e) { /* pazienza */ }
  if (!Array.isArray(righe))
    return { ok: false, dove, verdetto:
      "Risponde, ma non con una lista di righe: forse " +
      "l\u2019indirizzo punta a qualcos\u2019altro.", corpo };

  return { ok: true, dove, verdetto:
    "\u2713 Tutto collegato. La tabella c\u2019\u00e8 e la chiave va." };
}

// L'indirizzo della tabella, in un posto solo: lo usano lo scambio e
// la prova, e se divergessero la prova direbbe che va tutto bene su
// un indirizzo che lo scambio non usa.
function indirizzoVoci() {
  return chiavi.supaUrl + "/rest/v1/voci";
}

async function spiegaSupabase(r) {
  let testo = "";
  try { testo = (await r.text()).slice(0, 200); } catch (e) { /* pazienza */ }
  if (r.status === 401 || r.status === 403)
    return "Supabase rifiuta la chiave (" + r.status + "). Controlla la " +
           "chiave anon in Opzioni → Famiglia.";
  if (r.status === 404)
    return "Supabase non trova la tabella. Hai incollato il pezzo di SQL?";
  return "Supabase ha risposto " + r.status + (testo ? ": " + testo : "");
}

// Si manda dopo un attimo e non subito: votando cinque titoli di
// fila si farebbero cinque giri di rete invece di uno.
let attesaMandare = null;
function daMandare() {
  if (!nuvola.pronta) return;
  if (attesaMandare) clearTimeout(attesaMandare);
  attesaMandare = setTimeout(() => {
    attesaMandare = null;
    scambia().catch(e => registro.aggiungi("famiglia", e.message));
  }, 1500);
}

/* ------------------------- PREPARARE UN ALTRO TELEFONO

   «Quando faccio il set up per mia moglie voglio mettere meno cose
   possibili.» Giusto: su un secondo telefono servono cinque cose
   incollate a mano, e quattro di quelle sono chiavi lunghe.

   Quindi un link che le porta tutte. Si apre sull'altro telefono, si
   scrive solo il nome, e basta.

   COSA CI METTO: la chiave TMDB, gli abbonamenti, e i tre pezzi
   della famiglia (indirizzo, chiave anon, codice).
   COSA NON CI METTO, e non per dimenticanza:
     - il token SmartThings e il token della TV: sono LEGATI AL
       DISPOSITIVO. Il token della TV e' legato al nome con cui il
       telefono si presenta, e due telefoni con lo stesso nome se lo
       invalidano a vicenda. Copiarlo farebbe danno.
     - il nome: deve essere DIVERSO, altrimenti i voti si
       sovrascrivono a vicenda. Lo chiede l'altro telefono.
     - la Scorciatoia e a-Shell: NON SERVONO. Su quel telefono
       funziona tutto tranne scrivere il titolo dentro l'app della
       TV; aprire un'app sulla TV invece si' - quello passa dal
       cloud.

   IL LINK CONTIENE DELLE CHIAVI. Va passato di mano (AirDrop), non
   messo in una chat di gruppo. Scritto anche nella schermata.      */

function datiPerAltroTelefono() {
  return {
    tmdb: chiavi.tmdb,
    servizi: chiavi.servizi,
    supaUrl: chiavi.supaUrl,
    supaChiave: chiavi.supaChiave,
    famiglia: chiavi.famiglia,
  };
}

// base64 con l'alfabeto da indirizzo: il base64 normale usa + e /,
// che in un frammento di URL vengono reinterpretati.
function inBase64Url(testo) {
  return btoa(unescape(encodeURIComponent(testo)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function daBase64Url(testo) {
  const t = String(testo).replace(/-/g, "+").replace(/_/g, "/");
  return decodeURIComponent(escape(atob(t)));
}

function linkAltroTelefono() {
  return location.origin + location.pathname +
    "#/telefono/" + inBase64Url(JSON.stringify(datiPerAltroTelefono()));
}

function leggiAltroTelefono(pezzo) {
  try {
    const d = JSON.parse(daBase64Url(pezzo));
    if (!d || typeof d !== "object") return null;
    return {
      tmdb: String(d.tmdb || ""),
      servizi: Array.isArray(d.servizi) ? d.servizi.map(String) : [],
      supaUrl: String(d.supaUrl || ""),
      supaChiave: String(d.supaChiave || ""),
      famiglia: String(d.famiglia || ""),
    };
  } catch (e) { return null; }
}

// Il gusto: conto generi e keyword dei titoli che hai votato bene,
// pesando 4 stelle 1 e 5 stelle 2. Non e' magia, e' un conteggio.
function profiloGusto() {
  const buoni = visti.tutto.filter(v => (v.mio || 0) >= 4);
  const generi = {}, keyword = {};
  buoni.forEach(v => {
    const peso = v.mio >= 5 ? 2 : 1;
    (v.generiId || []).forEach(g => { generi[g] = (generi[g] || 0) + peso; });
    (v.keyword || []).forEach(k => { keyword[k] = (keyword[k] || 0) + peso; });
  });
  const cima = o => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 4).map(x => x[0]);
  return { quanti: buoni.length, generi: cima(generi), keyword: cima(keyword) };
}

// Il gusto DI CASA: non la media dei due, ma l'INCROCIO. Un genere
// entra solo se piace a tutti e due, e il punteggio e' il piu' BASSO
// dei due: un genere che tu ami e l'altro tollera resta un genere
// che l'altro tollera.
//
// Perche' non la somma: sommando, un genere che uno adora e l'altro
// detesta batterebbe un genere che piace a entrambi - ed e'
// esattamente il titolo che poi nessuno dei due vuole guardare.
function profiloDiCasa() {
  const pesa = (voci) => {
    const g = {}, k = {};
    voci.filter(v => (v.mio || 0) >= 4).forEach(v => {
      const peso = v.mio >= 5 ? 2 : 1;
      (v.generiId || []).forEach(x => { g[x] = (g[x] || 0) + peso; });
      (v.keyword || []).forEach(x => { k[x] = (k[x] || 0) + peso; });
    });
    return { g, k, quanti: voci.filter(v => (v.mio || 0) >= 4).length };
  };

  const mio = pesa(visti.tutto);
  // tutti gli altri di casa insieme: se in casa siete in tre, un
  // genere deve piacere a tutti e tre
  const chi = [...new Set(altrui.tutto.map(x => x.chi))];
  const loro = chi.map(c => pesa(altrui.tutto.filter(x => x.chi === c)));

  const incrocia = (campo) => {
    const fuori = {};
    Object.keys(mio[campo]).forEach(id => {
      let minimo = mio[campo][id];
      for (const l of loro) {
        if (!l[campo][id]) return;      // a qualcuno non piace: fuori
        minimo = Math.min(minimo, l[campo][id]);
      }
      fuori[id] = minimo;
    });
    return Object.entries(fuori).sort((a, b) => b[1] - a[1])
      .slice(0, 4).map(x => x[0]);
  };

  return {
    // «quanti» e' il minimo: se uno ha votato tre titoli e l'altro
    // trenta, quello che sappiamo di sicuro sono tre
    quanti: loro.length ? Math.min(mio.quanti, ...loro.map(l => l.quanti))
                        : 0,
    chi, generi: incrocia("g"), keyword: incrocia("k"),
  };
}

// I «simili» di TMDB, mescolati A GIRO. Prendo le liste di consigliati
// dei tuoi titoli preferiti (una lista per seme) e le intreccio: prima
// il piu' simile di OGNI seme (uno per ognuno), poi il secondo di
// ognuno, e cosi' via. Cosi' i cinque titoli rispecchiano la VARIETA'
// dei tuoi gusti.
//
// PERCHE' NON un mucchio unico ordinato per ricorrenza e voto, come
// facevo prima: l'animazione (Pixar, Ghibli, Disney) ha voti TMDB
// altissimi E fra «simili» si richiama sempre a vicenda, quindi un
// ordinamento globale la spingeva tutta in cima e allagava la lista,
// anche quando fra i tuoi preferiti era solo una parte. A giro, un solo
// filone non puo' dominare: al massimo un titolo per seme a passata.
// Chi esce dai simili di PIU' semi compare comunque presto (nella prima
// passata) e si deduplica: la ricorrenza resta un vantaggio, implicito.
//
// `esclusi` e' un Set di «tipo+id» da saltare: gia' visti, in lista,
// scartati, e i semi stessi. Pura di proposito: e' il cuore del
// consiglio e si prova senza rete.
function mescolaAGiro(liste, esclusi) {
  const out = [];
  const visto = new Set(esclusi || []);
  const massimo = liste.reduce((m, l) => Math.max(m, (l || []).length), 0);
  for (let i = 0; i < massimo; i++)
    for (const l of liste) {
      const v = (l || [])[i];
      if (!v) continue;
      const k = v.tipo + v.id;
      if (visto.has(k)) continue;      // gia' preso (da un altro seme) o escluso
      visto.add(k);
      out.push(v);
    }
  return out;
}

// Senza server, quando qualcosa si rompe sul telefono di qualcun
// altro non c'e' modo di saperlo. Quindi l'app tiene gli ultimi 20
// problemi e li mostra in Opzioni. NON registro mai le chiavi.
const registro = {
  get tutto() {
    try {
      const v = JSON.parse(localStorage.getItem("guai") || "[]");
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  },
  aggiungi(dove, messaggio) {
    try {
      const voce = { dove, cosa: String(messaggio).slice(0, 200), quando: Date.now() };
      localStorage.setItem("guai", JSON.stringify([voce, ...this.tutto].slice(0, 20)));
    } catch (e) { /* magazzino pieno: pazienza, non e' questo il problema */ }
  },
  svuota() { localStorage.removeItem("guai"); },
};

window.addEventListener("error", e => {
  registro.aggiungi("javascript", (e.message || "errore") +
    (e.lineno ? " (riga " + e.lineno + ")" : ""));
});
window.addEventListener("unhandledrejection", e => {
  registro.aggiungi("promessa", (e.reason && e.reason.message) || e.reason || "?");
});

// ------------------------------------------------------------ OAuth
// I Personal Access Token durano 24 ore (politica Samsung dal 30
// dicembre 2024). Con OAuth l'access token dura 24 ore ma il refresh
// token dura 30 GIORNI e si rinnova a ogni uso: aprendo l'app almeno
// una volta al mese non scade piu'.
//
// Tutto dal browser, senza server: verificato che
// POST https://api.smartthings.com/oauth/token risponde con
// access-control-allow-origin: * e accetta l'header Authorization.
// (auth-global.api.smartthings.com invece rifiuta il preflight.)
const ST_AUTORIZZA = "https://api.smartthings.com/oauth/authorize";
const ST_TOKEN = "https://api.smartthings.com/oauth/token";
const ST_SCOPE = "r:devices:* x:devices:* r:locations:*";

const oauth = {
  get id() { return localStorage.getItem("oauth_id") || ""; },
  set id(v) { localStorage.setItem("oauth_id", (v || "").trim()); },
  get segreto() { return localStorage.getItem("oauth_segreto") || ""; },
  set segreto(v) { localStorage.setItem("oauth_segreto", (v || "").trim()); },
  get accesso() { return localStorage.getItem("oauth_accesso") || ""; },
  get rinnovo() { return localStorage.getItem("oauth_rinnovo") || ""; },
  get scade() { return Number(localStorage.getItem("oauth_scade") || 0); },
  get collegato() { return !!(this.accesso && this.rinnovo); },

  salva(d) {
    if (d.access_token) localStorage.setItem("oauth_accesso", d.access_token);
    if (d.refresh_token) localStorage.setItem("oauth_rinnovo", d.refresh_token);
    // tolgo un minuto di margine, per non usarlo nell'istante in cui scade
    const durata = Number(d.expires_in || 86400) - 60;
    localStorage.setItem("oauth_scade", String(Date.now() + durata * 1000));
  },

  scollega() {
    ["oauth_accesso", "oauth_rinnovo", "oauth_scade", "oauth_stato"]
      .forEach(k => localStorage.removeItem(k));
  },
};

// Su iOS un'app aggiunta alla schermata Home ha una memoria SEPARATA
// da Safari, e non puo' navigare fuori dal proprio ambito: premendo
// "Collega" iOS apre Safari, il ritorno col codice arriva la', e i
// token finiscono nella memoria di Safari. L'app installata resta a
// mani vuote. Succede davvero, ed e' per questo che esiste il
// trasferimento qui sotto.
function dentroAppInstallata() {
  try {
    if (navigator.standalone === true) return true;               // iOS
    return window.matchMedia("(display-mode: standalone)").matches;
  } catch (e) { return false; }
}

// Il collegamento in una stringa da incollare. Contiene il refresh
// token e il client secret, quindi resta fra i tuoi dispositivi: non
// va mandata a nessun altro.
const SIGILLO = "TV1:";

function impacchettaCollegamento() {
  return SIGILLO + btoa(JSON.stringify({
    i: oauth.id, s: oauth.segreto,
    a: oauth.accesso, r: oauth.rinnovo, e: oauth.scade,
  }));
}

function scartaCollegamento(testo) {
  const t = (testo || "").trim();
  if (!t.startsWith(SIGILLO)) return false;
  let d;
  try { d = JSON.parse(atob(t.slice(SIGILLO.length))); }
  catch (e) { return false; }
  if (!d || !d.i || !d.s || !d.r) return false;
  oauth.id = d.i;
  oauth.segreto = d.s;
  if (d.a) localStorage.setItem("oauth_accesso", d.a);
  localStorage.setItem("oauth_rinnovo", d.r);
  // la scadenza di chi ce l'ha mandato non vale qui: forzo un rinnovo
  localStorage.setItem("oauth_scade", "0");
  return true;
}

// Il redirect_uri deve combaciare ESATTAMENTE con quello registrato
// nell'app SmartThings, barra finale compresa.
function indirizzoDiRitorno() {
  return location.origin + location.pathname;
}

// Separata da avviaCollegamento perche' cosi' si puo' provare senza
// far navigare il browser.
function urlAutorizzazione(stato) {
  return ST_AUTORIZZA + "?" + new URLSearchParams({
    client_id: oauth.id,
    response_type: "code",
    redirect_uri: indirizzoDiRitorno(),
    scope: ST_SCOPE,
    state: stato,
  });
}

function avviaCollegamento() {
  const stato = Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem("oauth_stato", stato);
  location.href = urlAutorizzazione(stato);
}

async function chiediToken(campi) {
  const r = await fetch(ST_TOKEN, {
    method: "POST",
    headers: {
      // Basic auth con client_id:client_secret, come vuole Samsung
      "Authorization": "Basic " + btoa(oauth.id + ":" + oauth.segreto),
      "Content-Type": "application/x-www-form-urlencoded",
    },
    body: new URLSearchParams({ client_id: oauth.id, ...campi }),
  });
  const testo = await r.text();
  if (!r.ok) {
    registro.aggiungi("OAuth", campi.grant_type + " -> HTTP " + r.status +
      " " + testo.slice(0, 120));
    throw new Error("SmartThings ha rifiutato il collegamento (HTTP " + r.status + ").");
  }
  let d;
  try { d = JSON.parse(testo); }
  catch (e) { throw new Error("Risposta di SmartThings illeggibile."); }
  oauth.salva(d);
  return d;
}

// Al ritorno dall autorizzazione: ?code=... nella query.
async function raccogliCodice() {
  const q = new URLSearchParams(location.search);
  const codice = q.get("code");
  const errore = q.get("error");
  const stato = q.get("state");
  if (!codice && !errore) return null;

  // pulisco subito l indirizzo: il codice non deve restare nella
  // cronologia del browser ne' in un link condivisibile
  history.replaceState(null, "", location.pathname + location.hash);

  if (errore) {
    registro.aggiungi("OAuth", "autorizzazione negata: " + errore);
    return { esito: "negato", errore };
  }
  const atteso = localStorage.getItem("oauth_stato");
  localStorage.removeItem("oauth_stato");

  // Distinguo i due casi, perche' hanno cause diverse e uno dei due e'
  // normale su iPhone: se lo state non c'e' AFFATTO, il collegamento e'
  // partito da un'altra finestra - tipicamente dall'app installata,
  // che ha una memoria separata da Safari. Se invece c'e' ma e'
  // diverso, quello si' e' sospetto.
  if (!atteso) {
    registro.aggiungi("OAuth", "nessuno state salvato: partito da un'altra finestra");
    return { esito: "altraFinestra" };
  }
  if (stato !== atteso) {
    registro.aggiungi("OAuth", "state diverso da quello salvato");
    return { esito: "sospetto" };
  }
  try {
    await chiediToken({ grant_type: "authorization_code", code: codice,
                        redirect_uri: indirizzoDiRitorno() });
    return { esito: "collegato" };
  } catch (e) {
    return { esito: "fallito", errore: e.message };
  }
}

let rinnovoInCorso = null;
async function rinnovaSeServe(forza = false) {
  if (!oauth.rinnovo) return false;
  if (!forza && oauth.accesso && Date.now() < oauth.scade) return true;
  // un solo rinnovo per volta: due chiamate insieme brucerebbero il
  // refresh token a vicenda
  if (!rinnovoInCorso) {
    rinnovoInCorso = chiediToken({ grant_type: "refresh_token",
                                   refresh_token: oauth.rinnovo })
      .then(() => true)
      .catch(e => { registro.aggiungi("OAuth", "rinnovo fallito: " + e.message); return false; })
      .finally(() => { rinnovoInCorso = null; });
  }
  return rinnovoInCorso;
}

// Scrivere sulla TV: il browser non puo' (pagina https, e il
// certificato della TV vale solo per 127.0.0.1), ma una Scorciatoia
// iOS puo', perche' e' nativa. Quindi l'app non scrive: passa il
// testo alla Scorciatoia, che chiama a-Shell, che apre il WebSocket.
//
// Funziona solo in casa: e' un indirizzo di rete locale.
function urlScorciatoia(nome, testo) {
  // Le virgolette romperebbero il comando dentro a-Shell, e i
  // caratteri di controllo non servono a niente.
  const pulito = String(testo).replace(/["\\]/g, "").replace(/[\u0000-\u001f]/g, " ").trim();
  return "shortcuts://run-shortcut?name=" + encodeURIComponent(nome) +
         "&input=text&text=" + encodeURIComponent(pulito);
}

function scriviConScorciatoia(testo) {
  if (!chiavi.scorciatoia) return false;
  location.href = urlScorciatoia(chiavi.scorciatoia, testo);
  return true;
}

function esc(t) {

// "oggi", "domani", "fra 5 giorni", oppure la data scritta.
function quandoEsce(iso) {
  if (!iso) return "";
  const oggi = new Date(); oggi.setHours(0, 0, 0, 0);
  const d = new Date(iso + "T00:00:00");
  const giorni = Math.round((d - oggi) / 86400000);
  const scritta = d.toLocaleDateString("it-IT",
    { weekday: "long", day: "numeric", month: "long" });
  if (giorni === 0) return "oggi · " + scritta;
  if (giorni === 1) return "domani · " + scritta;
  if (giorni > 1) return "fra " + giorni + " giorni · " + scritta;
  if (giorni === -1) return "ieri · " + scritta;
  return scritta + (d.getFullYear() !== oggi.getFullYear() ? " " + d.getFullYear() : "");
}

// «1 voti» e «servono 1 spunte» si leggono male, e sono le righe che
// si leggono piu' spesso.
function quanti(n, uno, molti) { return n === 1 ? uno : molti; }

/* ------------------------------------------------------------- chiamate */

async function tmdb(percorso, parametri = {}) {
  if (!chiavi.tmdb) throw new Error("Manca la chiave TMDB: vai in Opzioni.");
  // Senza rete la fetch dice solo "Failed to fetch": meglio dirlo
  // in italiano, e ricordare che la Lista funziona comunque.
  if (navigator.onLine === false)
    throw new Error("Sei senza rete. La tua Lista funziona comunque.");
  const url = TMDB + percorso + "?" + new URLSearchParams({ ...parametri, api_key: chiavi.tmdb });
  let r;
  try { r = await fetch(url); }
  catch (e) {
    registro.aggiungi("TMDB", percorso + " -> rete: " + e.message);
    throw new Error("Non riesco a raggiungere TMDB. Controlla la rete.");
  }
  if (r.status === 401) {
    registro.aggiungi("TMDB", "chiave rifiutata (401)");
    throw new Error("Chiave TMDB rifiutata.");
  }
  if (!r.ok) {
    registro.aggiungi("TMDB", percorso + " -> HTTP " + r.status);
    throw new Error("TMDB non risponde (HTTP " + r.status + ").");
  }
  return r.json();
}

async function smartthings(percorso, corpoRichiesta, riprovato = false) {
  const conOauth = oauth.collegato;
  if (!conOauth && !chiavi.token)
    throw new Error("SmartThings non è collegato: vai in Opzioni.");
  if (navigator.onLine === false)
    throw new Error("Sei senza rete: la TV si comanda solo online.");

  // Con OAuth rinnovo prima di partire, se l'access token e' scaduto.
  if (conOauth) await rinnovaSeServe();
  const gettone = conOauth ? oauth.accesso : chiavi.token;

  const r = await fetch(ST + percorso, {
    method: corpoRichiesta ? "POST" : "GET",
    headers: { "Authorization": "Bearer " + gettone, "Content-Type": "application/json" },
    body: corpoRichiesta ? JSON.stringify(corpoRichiesta) : undefined,
  });
  if (r.status === 401) {
    // Con OAuth un 401 puo' voler dire solo "access token vecchio":
    // rinnovo e riprovo UNA volta, poi mi arrendo.
    if (conOauth && !riprovato) {
      registro.aggiungi("OAuth", "401: rinnovo e riprovo");
      if (await rinnovaSeServe(true))
        return smartthings(percorso, corpoRichiesta, true);
      throw new Error("Il collegamento a SmartThings è scaduto. " +
                      "Ricollegalo in Opzioni.");
    }
    if (conOauth) {
      registro.aggiungi("OAuth", "401 anche dopo il rinnovo");
      throw new Error("Il collegamento a SmartThings non funziona più. " +
                      "Ricollegalo in Opzioni.");
    }
    // Col PAT invece il 401 e' definitivo: durano 24 ore.
    registro.aggiungi("SmartThings", "401: token scaduto (i PAT durano 24 ore)");
    throw new Error("Token SmartThings scaduto: i PAT durano 24 ore. " +
                    "Collega SmartThings in Opzioni e non scadrà più.");
  }
  if (r.status === 403) {
    registro.aggiungi("SmartThings", "403: token senza permessi sui dispositivi");
    throw new Error("Token senza i permessi sui dispositivi.");
  }
  if (!r.ok) {
    registro.aggiungi("SmartThings", percorso + " -> HTTP " + r.status);
    throw new Error("SmartThings non risponde (HTTP " + r.status + ").");
  }
  return r.status === 204 ? {} : r.json();
}


async function trovaTv() {
  if (chiavi.tv) return chiavi.tv;
  const dati = await smartthings("/devices");
  for (const d of dati.items || [])
    for (const c of d.components || [])
      if ((c.capabilities || []).some(x => x.id === "custom.launchapp")) {
        chiavi.tv = d.deviceId;
        return d.deviceId;
      }
  throw new Error("Nessuna TV con custom.launchapp nel tuo account SmartThings.");
}

// setPictureMode e setSoundMode prendono "mode: string", ma non e'
// documentato se voglia l'id ("modeMovie") o il nome localizzato
// ("Film"). Lo stato riporta il NOME, quindi provo quello; se dopo
// qualche secondo non e' cambiato, riprovo con l'id. Come per
// launchApp, la risposta COMPLETED non e' una prova.
async function impostaModo(capacita, comando, attributo, voce) {
  const leggi = async () => {
    const st = await statoTv();
    return attributo === "immagine" ? st.immagine : st.suono;
  };
  const prima = await leggi().catch(() => null);
  await comando(voce.name);
  await new Promise(r => setTimeout(r, 2500));
  let adesso = await leggi().catch(() => null);
  if (adesso === voce.name) return adesso;

  await comando(voce.id);
  await new Promise(r => setTimeout(r, 2500));
  adesso = await leggi().catch(() => null);
  return adesso;
}

// La TV non riporta subito l'app in primo piano: il valore puo'
// restare vecchio per un po', e su quel valore si basa la verifica dei
// lanci. La capability refresh le chiede di riportare il suo stato.
async function chiediAggiornamento() {
  try { await comando("refresh", "refresh"); } catch (e) { /* non e' fatale */ }
}

async function appInPrimoPiano(fresco = false) {
  if (fresco) {
    await chiediAggiornamento();
    await new Promise(r => setTimeout(r, 900));
  }
  const stato = await smartthings("/devices/" + await trovaTv() + "/status");
  return (((stato.components || {}).main || {}).tvChannel || {}).tvChannelName?.value || "";
}

// COMPLETED vuol dire "comando recapitato", non "app aperta": la
// prova e' rileggere l'app in primo piano. Per questo verifichiamo.
async function lancia(appId, nomeAtteso) {
  const ident = await trovaTv();
  const prima = await appInPrimoPiano().catch(() => "");

  // Se e' GIA' aperta il valore non cambiera' mai, e la verifica
  // fallirebbe per forza. Confronto per NOME e non per id, perche'
  // l'id per lanciare e' numerico per cinque app mentre la TV riporta
  // sempre il nome pacchetto.
  const giaAperta = !!(nomeAtteso && nomeApp(prima) === nomeAtteso);

  await smartthings("/devices/" + ident + "/commands", {
    commands: [{ component: "main", capability: "custom.launchapp",
                 command: "launchApp", arguments: [appId] }],
  });
  // Ritorna COME e' andata, non solo se: "gia" vale quanto "aperta"
  // per chi controlla la verita' del risultato, ma permette a chi
  // chiama di sapere che l'app non deve caricare - e quindi di non
  // aspettare i quattordici secondi che servono solo all'avvio.
  if (giaAperta) return "gia";

  for (let i = 0; i < 5; i++) {
    await new Promise(r => setTimeout(r, 1800));
    // Letture fresche: senza refresh la TV puo' riportare per un po'
    // l'app precedente, e un lancio riuscito sembra fallito. E'
    // successo davvero: NOW aperta e stato fermo su Netflix.
    const adesso = await appInPrimoPiano(true).catch(() => "");
    if (adesso === appId) return "aperta";
    if (nomeAtteso && nomeApp(adesso) === nomeAtteso) return "aperta";
    if (adesso && adesso !== prima) return "aperta";
  }
  return false;
}

// Il filtro lo fa TMDB: with_watch_providers + watch_region.
// Quello che non hai in abbonamento non arriva nemmeno.
async function sfoglia(f, pagina = 1) {
  const campoData = f.tipo === "movie" ? "primary_release_date" : "first_air_date";
  const parametri = {
    language: LINGUA,
    watch_region: PAESE,
    // un solo servizio se l'hai scelto, altrimenti tutti i tuoi
    with_watch_providers: f.servizio || chiavi.servizi.join("|"),
    with_watch_monetization_types: COMPRESI.join("|"),
    sort_by: f.ordine === "data.desc" ? campoData + ".desc" : f.ordine,
    include_adult: "false",
    page: pagina,
  };
  if (f.genere) parametri.with_genres = f.genere;
  if (f.keyword) parametri.with_keywords = f.keyword;
  // Escludere generi, non solo chiederli: serve a "Per dormire", dove
  // la cosa importante non e' cosa vuoi ma cosa NON vuoi.
  if (f.senzaGenere) parametri.without_genres = f.senzaGenere;
  // Un tetto ai minuti, senza passare dalle durate con un nome: quelle
  // predefinite hanno tutte anche un minimo, e "90-120" avrebbe
  // buttato via i film sotto l'ora e mezza - che per dormire vanno
  // benissimo. Qui serve solo non incappare in tre ore di epica.
  if (f.maxMinuti) parametri["with_runtime.lte"] = f.maxMinuti;

  // Senza una soglia di voti, "voto più alto" restituisce cose con
  // tre voti da 10: tecnicamente giusto, inutile in pratica.
  if (f.ordine === "vote_average.desc") parametri["vote_count.gte"] = 150;

  const d = DECENNI.find(x => x.n === f.decennio);
  if (d && d.da) parametri[campoData + ".gte"] = d.da;
  if (d && d.a) parametri[campoData + ".lte"] = d.a;

  const t = (DURATE[f.tipo] || []).find(x => x.n === f.durata);
  if (t && t.gte) parametri["with_runtime.gte"] = t.gte;
  if (t && t.lte) parametri["with_runtime.lte"] = t.lte;

  const dati = await tmdb("/discover/" + f.tipo, parametri);
  return {
    elementi: (dati.results || []).map(v => normalizza(v, f.tipo)),
    pagine: dati.total_pages || 1,
    totale: dati.total_results || 0,
  };
}

// Pesca un titolo a caso fra quelli che paghi. Per avere varieta'
// vera scelgo una pagina casuale e non il primo risultato: TMDB
// ordina per popolarita', quindi la pagina 1 e' sempre la stessa.
// Le pagine si fermano a 500 (la 501 risponde errore, verificato).
const paginePerFiltro = {};

// Gli ultimi pescati, per non riproporre lo stesso due volte di fila.
const pescatiDiRecente = [];

// Segna un titolo come «appena pescato», per non riproporlo subito. Ne
// tengo una ventina: adesso ne pesco 5 per volta, con 12 si svuotava
// dopo due giri e tornavano gli stessi.
function ricorda(v) {
  pescatiDiRecente.push(v.tipo + v.id);
  while (pescatiDiRecente.length > 20) pescatiDiRecente.shift();
}

// N titoli a caso da un bacino LOCALE (i visti, i calmi per dormire):
// nessuna rete. Mescolo e prendo i primi n, evitando gli ultimi
// pescati finche' ce n'e' abbastanza di nuovi.
function pescaTanti(bacino, n) {
  const nuovi = bacino.filter(v => !pescatiDiRecente.includes(v.tipo + v.id));
  const fonte = (nuovi.length >= n ? nuovi : bacino).slice();
  for (let i = fonte.length - 1; i > 0; i--) {   // mescolo (Fisher-Yates)
    const j = Math.floor(Math.random() * (i + 1));
    [fonte[i], fonte[j]] = [fonte[j], fonte[i]];
  }
  const scelti = fonte.slice(0, n);
  scelti.forEach(ricorda);
  return scelti;
}

// Fino a 5 titoli dal discover, cioe' SOLO fra quelli che paghi (il
// filtro sugli abbonamenti lo mette TMDB). Una pagina a caso per
// varieta', la 1 come rete di sicurezza se quella pagina ne da' pochi.
async function cinqueDaDiscover(f, quanti = 5) {
  const chiave = JSON.stringify(f);
  let pagine = paginePerFiltro[chiave];
  let prima = null;
  if (pagine === undefined) {
    prima = await sfoglia(f, 1);
    if (!prima.elementi.length) return [];
    pagine = Math.min(prima.pagine, 500);
    paginePerFiltro[chiave] = pagine;
  }
  const tetto = Math.max(1, Math.min(pagine, 500));
  const p = 1 + Math.floor(Math.random() * tetto);
  const r = (p === 1 && prima) ? prima : await sfoglia(f, p);
  let pool = r.elementi.slice();
  if (pool.length < quanti && prima && p !== 1) pool = pool.concat(prima.elementi);

  const visto = new Set(pescatiDiRecente);
  const scelti = [];
  for (const v of pool) {
    const k = v.tipo + v.id;
    if (visto.has(k)) continue;
    visto.add(k);
    scelti.push(v);
    if (scelti.length >= quanti) break;
  }
  const finali = scelti.length ? scelti : pool.slice(0, quanti);
  finali.forEach(ricorda);
  return finali;
}

// Il motore «simili»: prendo i CONSIGLIATI di TMDB per i tuoi titoli
// preferiti (voto 4-5), li mescolo a giro, e TENGO SOLO QUELLI
// CHE PAGHI. /recommendations non filtra per abbonamento come fa
// /discover, quindi il filtro «lo paghi gia'» lo faccio a mano con la
// scheda - ma non frugo all'infinito: un tetto alle chiamate. Torna
// coppie { v, d } con la scheda gia' in mano, cosi' il disegno non la
// richiede una seconda volta. Se torna vuoto, chi chiama ripiega.
// Cosa NON riproporre nei CONSIGLI (Stasera): quello che hai gia' visto
// (votato) e quello che hai gia' messo in lista. NON gli scartati:
// «non l'ho visto» vuol dire che non l'hai visto, ed e' proprio roba
// buona da consigliare - toglierla sarebbe il contrario di quel che
// serve. (Nel mazzo «Da votare» invece lo scartato esce: li' voti solo
// cio' che HAI visto.)
function esclusiDaiConsigli() {
  return new Set([
    ...visti.tutto.map(x => x.tipo + x.id),
    ...lista.tutto.map(x => x.tipo + x.id),
    ...pescatiDiRecente,
  ]);
}

async function cinqueSimili(tipo, quanti = 5) {
  const semi = visti.tutto
    .filter(v => (v.mio || 0) >= 4 && v.tipo === tipo)
    .sort((a, b) => (b.mio || 0) - (a.mio || 0))
    .slice(0, 6);
  if (!semi.length) return [];

  const liste = await Promise.all(semi.map(sm =>
    tmdb("/" + tipo + "/" + sm.id + "/recommendations", { language: LINGUA, page: 1 })
      .then(d => (d.results || []).map(r => normalizza(r, tipo)))
      .catch(() => [])));

  const esclusi = esclusiDaiConsigli();
  semi.forEach(x => esclusi.add(x.tipo + x.id));   // e i semi stessi
  const pool = mescolaAGiro(liste, esclusi);

  const durata = (DURATE.movie || []).find(x => x.n === STASERA.durata);
  const scelti = [];
  let chiamate = 0;
  for (const v of pool) {
    if (scelti.length >= quanti || chiamate >= 16) break;
    chiamate++;
    let d;
    try { d = await scheda(v.tipo, v.id); } catch (e) { continue; }
    if (!d.compresi.length) continue;                 // non lo paghi: fuori
    if (tipo === "movie" && durata && d.minuti) {      // rispetta la durata
      if (durata.gte && d.minuti < durata.gte) continue;
      if (durata.lte && d.minuti > durata.lte) continue;
    }
    scelti.push({ v, d });
  }
  scelti.forEach(x => ricorda(x.v));
  return scelti;
}

// Film e serie hanno due liste diverse (92 e 67): le unisco, perche'
// un abbonamento vale per entrambi.
async function caricaProvider(forza = false) {
  if (!forza && Object.keys(PROVIDER).length) return PROVIDER;
  const unione = {};
  for (const tipo of ["movie", "tv"]) {
    const d = await tmdb("/watch/providers/" + tipo,
                         { language: LINGUA, watch_region: PAESE });
    (d.results || []).forEach(p => {
      const id = String(p.provider_id);
      const pri = p.display_priority === undefined ? 999 : p.display_priority;
      if (!unione[id] || pri < unione[id].pri)
        unione[id] = { nome: p.provider_name, logo: p.logo_path, pri };
    });
  }
  PROVIDER = unione;
  localStorage.setItem("provider", JSON.stringify(PROVIDER));
  return PROVIDER;
}

// TMDB traduce i generi in italiano, ma non tutti bene: 10770 arriva
// come «televisione film», e in mezzo agli altri sembra un errore
// dell'app. Correggo solo quelli sbagliati, e per id: cambiare la
// lista intera vorrebbe dire mantenerla.
const GENERI_RIBATTEZZATI = { "10770": "Film TV", "10402": "Musical" };

async function generi(tipo) {
  const memoria = "generi_" + tipo;
  const salvati = sessionStorage.getItem(memoria);
  if (salvati) return JSON.parse(salvati);
  const dati = await tmdb("/genre/" + tipo + "/list", { language: LINGUA });
  const lista = (dati.genres || []).map(
    g => Object.assign({}, g, GENERI_RIBATTEZZATI[String(g.id)]
      ? { name: GENERI_RIBATTEZZATI[String(g.id)] } : null));
  sessionStorage.setItem(memoria, JSON.stringify(lista));
  return lista;
}

function normalizza(v, tipoNoto) {
  const tipo = tipoNoto || v.media_type;
  return {
    id: v.id, tipo,
    titolo: v.title || v.name || "?",
    anno: (v.release_date || v.first_air_date || "").slice(0, 4),
    voto: v.vote_average || 0,
    locandina: v.poster_path,
  };
}

async function unaRicerca(query) {
  const dati = await tmdb("/search/multi",
    { query, language: LINGUA, include_adult: "false" });
  return (dati.results || [])
    .filter(v => v.media_type === "movie" || v.media_type === "tv")
    // TMDB non ordina per rilevanza: senza questo "Bikini Inception"
    // finisce sopra "Inception".
    .sort((a, b) => (b.popularity || 0) - (a.popularity || 0))
    .slice(0, 12)
    .map(v => normalizza(v));
}

// TMDB non perdona i typo: «intersteller» non trova niente. Ma i
// PREFISSI funzionano, quindi se il testo esatto non da' niente
// riprovo accorciandolo - questo recupera i refusi verso la FINE, che
// sono i piu' comuni (stai ancora scrivendo e sbagli l'ultimo pezzo).
// Un typo nella PRIMA parola resta difficile, e li' non fingo: torno
// vuoto e la schermata lo dice con garbo, senza vicolo cieco.
async function cercaTitoli(query) {
  const q = query.trim();
  const esatta = await unaRicerca(q);
  if (esatta.length) return esatta;

  // Due ripieghi, dal piu' simile al piu' largo:
  //   1. prefissi a caratteri (85%, 70%) - recupera i refusi in coda
  //   2. le prime parole (n-1, n-2, ...) - recupera un refuso a meta',
  //      tipo «il signore DELI anelli»: «il signore» ritrova il titolo
  const parole = q.split(/\s+/);
  const tentativi = [
    q.slice(0, Math.round(q.length * 0.85)).trim(),
    q.slice(0, Math.round(q.length * 0.7)).trim(),
  ];
  for (let k = parole.length - 1; k >= 1; k--)
    tentativi.push(parole.slice(0, k).join(" "));

  const visti = new Set([q.toLowerCase()]);
  for (const t of tentativi) {
    if (t.length < 3 || visti.has(t.toLowerCase())) continue;
    visti.add(t.toLowerCase());
    const r = await unaRicerca(t);
    if (r.length) { r.approssimata = true; return r; }
  }
  return [];
}

// La scheda di un titolo, tenuta in cache per la sessione. Mostrare 5
// titoli vuol dire chiederle a raffica, e la STESSA scheda serve due
// volte: a verificare se lo paghi e a disegnarlo. TMDB non cambia nel
// giro di un minuto. La cache tiene la PROMESSA, non il valore: due
// richieste vicine per lo stesso titolo aspettano la stessa chiamata.
// (Il verdetto «lo paghi» dipende dagli abbonamenti: sono nella chiave.)
const _cacheScheda = new Map();
function scheda(tipo, id) {
  // Nella chiave anche gli abbonamenti: se li cambi, «lo paghi gia'»
  // cambia, e la scheda in cache non deve raccontare il vecchio.
  const k = tipo + ":" + id + ":" + chiavi.servizi.join(",");
  if (!_cacheScheda.has(k)) {
    const p = schedaGrezza(tipo, id);
    p.catch(() => _cacheScheda.delete(k));   // un errore non resta in cache
    _cacheScheda.set(k, p);
  }
  return _cacheScheda.get(k);
}

async function schedaGrezza(tipo, id) {
  const d = await tmdb("/" + tipo + "/" + id, {
    language: LINGUA,
    append_to_response: "credits,watch/providers,videos,keywords",
  });
  const italia = ((d["watch/providers"] || {}).results || {})[PAESE] || {};

  const miei = chiavi.servizi;

  // flatrate vuole l'abbonamento. free e ads NO, per definizione: se
  // un titolo e' gratis su Plex o Rai Play lo puoi guardare adesso,
  // anche se Plex non e' fra i tuoi servizi. Prima chiedevo
  // l'abbonamento anche per quelli e rispondevo "non e' nei tuoi
  // abbonamenti" su roba guardabile subito e gratis.
  const compresi = [], visti = new Set();
  let cePaga = false;
  for (const t of COMPRESI)
    for (const p of italia[t] || []) {
      const pid = String(p.provider_id);
      const vale = t === "flatrate" ? miei.includes(pid) : true;
      if (vale && !visti.has(pid)) {
        visti.add(pid);
        if (t === "flatrate") cePaga = true;
        compresi.push({
          pid, come: TIPI[t], gratis: t !== "flatrate", logo: p.logo_path,
          nome: (MAPPA[pid] || {}).nome || p.provider_name,
          app: (MAPPA[pid] || {}).app || null,
        });
      }
    }

  // "altrove" e' solo l'abbonamento che non hai: il gratis non e'
  // altrove, e' qui.
  const altrove = [...new Set((italia.flatrate || [])
    .filter(p => !miei.includes(String(p.provider_id)))
    .map(p => p.provider_name))].sort();
  const pagando = [...new Set(PAGANDO.flatMap(t =>
    (italia[t] || []).map(p => p.provider_name)))].sort().slice(0, 5);

  const durata = tipo === "movie"
    ? (d.runtime ? d.runtime + " min" : "")
    : (d.number_of_seasons ? d.number_of_seasons + (d.number_of_seasons === 1 ? " stagione" : " stagioni") : "");

  // Trailer: prima in italiano, che TMDB ce l'ha spesso. Se non c'e',
  // ripiego sull'inglese con una seconda chiamata, non prima.
  const scegliVideo = lista => {
    const yt = (lista || []).filter(v => v.site === "YouTube");
    return yt.find(v => v.type === "Trailer" && v.official)
        || yt.find(v => v.type === "Trailer")
        || yt.find(v => v.type === "Teaser")
        || null;
  };
  let video = scegliVideo(((d.videos || {}).results) || []);
  if (!video) {
    try {
      const altri = await tmdb("/" + tipo + "/" + id + "/videos", { language: "en-US" });
      video = scegliVideo(altri.results);
    } catch (e) { /* senza trailer si vive */ }
  }

  return {
    tipo, id, video,
    titolo: d.title || d.name || "?",
    anno: (d.release_date || d.first_air_date || "").slice(0, 4),
    voto: d.vote_average || 0,
    quanti: d.vote_count || 0,
    durata,
    generi: (d.genres || []).map(g => g.name),
    // i minuti grezzi, per filtrare la durata sui simili (solo film:
    // per le serie la durata e' per episodio e non sta qui)
    minuti: tipo === "movie" ? (d.runtime || 0) : 0,
    trama: d.overview || "",
    locandina: d.poster_path,
    sfondo: d.backdrop_path,
    cast: ((d.credits || {}).cast || []).slice(0, 10).map(a => ({
      id: a.id, nome: a.name, ruolo: a.character, foto: a.profile_path,
    })),
    // Il regista: per i film sta nella crew, per le serie in created_by.
    regia: tipo === "movie"
      ? ((d.credits || {}).crew || [])
          .filter(c => c.job === "Director")
          .map(c => ({ id: c.id, nome: c.name, foto: c.profile_path }))
      : (d.created_by || []).map(c => ({ id: c.id, nome: c.name, foto: c.profile_path })),
    // Le keyword servono per i titoli simili: piu' precise dei generi.
    keyword: (((d.keywords || {}).keywords) || ((d.keywords || {}).results) || [])
      .slice(0, 3).map(k => String(k.id)),
    generiId: (d.genres || []).map(g => String(g.id)),
    compresi, altrove, pagando, cePaga,
    niente: !Object.keys(italia).length,
    // solo per i film: le serie non hanno collezioni (verificato)
    saga: d.belongs_to_collection
      ? { id: d.belongs_to_collection.id, nome: d.belongs_to_collection.name }
      : null,
    // solo per le serie
    stato: d.status || "",
    prossimo: d.next_episode_to_air || null,
    ultimo: d.last_episode_to_air || null,
    quantiEpisodi: d.number_of_episodes || 0,
    stagioni: (d.seasons || [])
      // la stagione 0 sono gli speciali: la tengo solo se ha episodi
      .filter(x => x.season_number > 0 || x.episode_count > 0)
      .map(x => ({
        numero: x.season_number, nome: x.name,
        quanti: x.episode_count, anno: (x.air_date || "").slice(0, 4),
        locandina: x.poster_path,
      })),
  };
}


// Una persona: film filtrati da TMDB, serie no.
// /discover/movie accetta with_cast e with_crew. /discover/tv li
// IGNORA in silenzio (verificato: restituisce lo stesso totale che
// senza filtro), quindi per le serie prendo i crediti della persona
// e controllo la disponibilita' una per una.
async function personaDati(id) {
  const miei = chiavi.servizi;
  const comuni = {
    language: LINGUA, watch_region: PAESE,
    with_watch_providers: miei.join("|"),
    with_watch_monetization_types: COMPRESI.join("|"),
    sort_by: "popularity.desc", include_adult: "false",
  };

  const [p, comeAttore, comeRegista] = await Promise.all([
    tmdb("/person/" + id, { language: LINGUA, append_to_response: "combined_credits" }),
    tmdb("/discover/movie", { ...comuni, with_cast: id }),
    tmdb("/discover/movie", { ...comuni, with_crew: id }),
  ]);

  const crediti = [...((p.combined_credits || {}).cast || []),
                   ...((p.combined_credits || {}).crew || [])];
  const visteSerie = new Set();
  const candidate = crediti
    .filter(c => c.media_type === "tv" && !visteSerie.has(c.id) && visteSerie.add(c.id))
    .sort((a, b) => (b.popularity || 0) - (a.popularity || 0))
    .slice(0, 12);

  // 12 chiamate in parallelo: piu' lente di una, ma e' l'unico modo
  // di sapere se una serie e' fra i tuoi abbonamenti.
  const serie = (await Promise.all(candidate.map(async c => {
    try {
      const d = await tmdb("/tv/" + c.id + "/watch/providers");
      const italia = (d.results || {})[PAESE] || {};
      const dentro = COMPRESI.some(t =>
        (italia[t] || []).some(x => miei.includes(String(x.provider_id))));
      return dentro ? normalizza(c, "tv") : null;
    } catch (e) { return null; }
  }))).filter(Boolean);

  return {
    nome: p.name,
    foto: p.profile_path,
    mestiere: p.known_for_department === "Directing" ? "Regia" :
              p.known_for_department === "Acting" ? "Interprete" : (p.known_for_department || ""),
    film: (comeAttore.results || []).map(v => normalizza(v, "movie")),
    regia: (comeRegista.results || []).map(v => normalizza(v, "movie")),
    serie,
  };
}

// La saga di un film, con la disponibilita' di ogni capitolo.
// Le parti arrivano in ordine sparso (verificato: 2008, 2012, 2005),
// quindi le ordino per data. Una chiamata per capitolo, in parallelo:
// le saghe sono piccole, e sapere QUALI capitoli hai vale il costo.
async function sagaCompleta(saga, idCorrente) {
  const c = await tmdb("/collection/" + saga.id, { language: LINGUA });
  const miei = chiavi.servizi;
  const parti = (c.parts || [])
    .filter(p => p.id)
    .sort((a, b) => (a.release_date || "9999").localeCompare(b.release_date || "9999"));

  const conDisponibilita = await Promise.all(parti.map(async p => {
    const base = { ...normalizza(p, "movie"), questo: String(p.id) === String(idCorrente) };
    try {
      const d = await tmdb("/movie/" + p.id + "/watch/providers");
      const italia = (d.results || {})[PAESE] || {};
      base.tua = COMPRESI.some(t => (italia[t] || []).some(x =>
        t === "flatrate" ? miei.includes(String(x.provider_id)) : true));
    } catch (e) { base.tua = false; }
    return base;
  }));

  return { nome: c.name || saga.nome, parti: conDisponibilita };
}

// Simili: uso le keyword del titolo, che sono piu' precise dei generi,
// e ripiego sui generi se non ce ne sono. Filtrato sui tuoi servizi.
async function simili(d) {
  const p = {
    language: LINGUA, watch_region: PAESE,
    with_watch_providers: chiavi.servizi.join("|"),
    with_watch_monetization_types: COMPRESI.join("|"),
    sort_by: "popularity.desc", include_adult: "false",
  };
  if (d.keyword.length) p.with_keywords = d.keyword.join("|");
  else if (d.generiId.length) p.with_genres = d.generiId.slice(0, 2).join(",");
  else return [];
  const r = await tmdb("/discover/" + d.tipo, p);
  return (r.results || [])
    .filter(v => String(v.id) !== String(d.id))
    .slice(0, 12)
    .map(v => normalizza(v, d.tipo));
}

let scheda_attiva = "sfoglia";
let F = { tipo: "movie", genere: "", keyword: "", ordine: "popularity.desc",
          servizio: "", decennio: "Tutti", durata: "Qualsiasi" };
let filtri_aperti = false;
let osservatore = null;

// Con la paginazione, tornare indietro da una scheda non deve
// farti ripartire dalla prima pagina: tengo cio' che era caricato.
let cache = { chiave: "", elementi: [], pagina: 0, pagine: 1, totale: 0, scroll: 0 };

// Ogni render di Sfoglia prende un numero. Le risposte che arrivano
// dopo che ne e' partito un altro vengono scartate, altrimenti
// disegnano dentro un contenitore che non e' piu' nel documento e la
// schermata resta col girello per sempre. Succedeva davvero: al
// caricamento parte un render, e se tocchi una pastiglia mentre il
// primo e' in volo ne parte un secondo.
let generazione = 0;
const chiaveFiltri = () => JSON.stringify(F);

function quantiFiltri() {
  return (F.keyword ? 1 : 0) + (F.servizio ? 1 : 0) +
         (F.decennio !== "Tutti" ? 1 : 0) + (F.ordine !== "popularity.desc" ? 1 : 0) +
         (F.durata !== "Qualsiasi" ? 1 : 0);
}

function vai(nome) {
  pulisciIndirizzo();
  if (osservatore) { osservatore.disconnect(); osservatore = null; }
  scheda_attiva = nome;
  nav.querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.scheda === nome)));
  if (nome !== "sfoglia") window.scrollTo(0, 0);
  if (nome === "sfoglia") schermoSfoglia();
  else if (nome === "cerca") schermoCerca();
  else if (nome === "lista") schermoLista();

  else schermoImpostazioni();

function grigliaDi(elementi, mostraMio = false) {

function fasciaChip(voci, attuale, scegli) {
  const f = el("div", "generi");
  let scelto = null;
  voci.forEach(({ etichetta, valore }) => {
    const b = el("button", "chip", esc(etichetta));
    b.setAttribute("aria-pressed", String(valore === attuale));
    if (valore === attuale) scelto = b;
    b.onclick = () => scegli(valore);
    f.appendChild(b);
  });
  // Scegliendo una voce in fondo alla fascia, lo schermo si rifa' e la
  // fascia riparte da sinistra: la scelta finiva fuori vista, e non si
  // capiva piu' cosa fosse attivo. Qui la riporto al centro.
  // Il rinvio serve perche' finche' il pezzo non e' attaccato allo
  // schermo non c'e' niente da scorrere. Un setTimeout e non un
  // requestAnimationFrame: a pagina nascosta i fotogrammi non arrivano
  // (misurato: zero chiamate), e la fascia resterebbe storta al
  // ritorno.
  if (scelto) setTimeout(() => {
    if (scelto.scrollIntoView)
      scelto.scrollIntoView({ inline: "center", block: "nearest" });
  }, 0);
  return f;
}

function pannelloFiltri() {
  const p = el("div", "pannello");

  const gruppo = (titolo, voci, attuale, scegli) => {
    const g = el("div", "gruppo");
    g.appendChild(el("span", null, titolo));
    const sc = el("div", "scelte");
    voci.forEach(({ etichetta, valore }) => {
      const b = el("button", "chip", esc(etichetta));
      b.setAttribute("aria-pressed", String(valore === attuale));
      b.onclick = () => scegli(valore);
      sc.appendChild(b);
    });
    g.appendChild(sc);
    return g;
  };

  // I sottogeneri stavano in una fila di pastiglie identica a quella
  // dei generi, senza etichetta: non si capiva che erano due cose
  // diverse, e costavano 48px prima del contenuto. Sono un filtro,
  // quindi stanno qui.
  const sott = sottogeneriPer(F.genere);
  if (sott.length)
    p.appendChild(gruppo("Sottogenere",
      [{ etichetta: "Tutti", valore: "" },
       ...sott.map(k => ({ etichetta: k.n, valore: k.k }))],
      F.keyword, v => { F.keyword = v; schermoSfoglia(); }));

  p.appendChild(gruppo("Ordine",
    ORDINI.map(o => ({ etichetta: o.n, valore: o.v })), F.ordine,
    v => { F.ordine = v; schermoSfoglia(); }));

  p.appendChild(gruppo("Servizio",
    [{ etichetta: "Tutti i miei", valore: "" },
     ...chiavi.servizi.map(pid => ({
       etichetta: (MAPPA[pid] || {}).nome || nomeProvider(pid), valore: pid }))],
    F.servizio, v => { F.servizio = v; schermoSfoglia(); }));

  p.appendChild(gruppo("Durata",
    (DURATE[F.tipo] || []).map(t => ({ etichetta: t.n, valore: t.n })), F.durata,
    v => { F.durata = v; schermoSfoglia(); }));

  p.appendChild(gruppo("Anni",
    DECENNI.map(d => ({ etichetta: d.n, valore: d.n })), F.decennio,
    v => { F.decennio = v; schermoSfoglia(); }));

  if (quantiFiltri()) {
    const z = el("button", "azzera", "Azzera i filtri");
    z.onclick = () => {

// Il tour della prima volta: tre fumetti che dicono, in ordine, le tre
// cose che l'app fa - cerchi, vedi se lo paghi, apri sulla TV. Mostrato
// una volta sola (chiavi.tourVisto), e si chiude con un tocco: chi non
// lo vuole tocca «Salta» o il fondo e non lo rivede mai piu'. Pensato
// per chi apre l'app senza averla costruita.
function mostraTour() {
  if (chiavi.tourVisto) return;               // due volte no
  if (document.querySelector(".veloTour")) return;  // gia' aperto

  const schede = [
    { icona: "\uD83D\uDD0D", titolo: "Cerca un titolo",
      testo: "Scrivi un film o una serie in <b>Cerca</b>: ti dico subito " +
             "se \u00e8 compreso in uno dei tuoi abbonamenti." },
    { icona: "\u2705", titolo: "Vedi se lo paghi gi\u00e0",
      testo: "<b>«Ce l'hai gi\u00e0»</b> vuol dire che \u00e8 incluso, senza " +
             "pagare altro. Altrimenti ti dico dove trovarlo." },
    { icona: "\uD83D\uDCFA", titolo: "Aprilo sulla TV",
      testo: "Un tocco apre l'app giusta <b>sulla TV o sul Fire Stick</b> e " +
             "cerca il titolo. Niente pi\u00f9 telecomando per scrivere." },
  ];

  let passo = 0;
  const velo = el("div", "veloTour");
  const carta = el("div", "tour");
  const icona = el("div", "tourIcona");
  const titolo = el("h3");
  const testo = el("p");
  const punti = el("div", "tourPunti");
  const pallini = schede.map(() => { const i = el("i"); punti.appendChild(i); return i; });
  const avanti = el("button", "tourAvanti");
  const salta = el("div", "tourSalta", "Salta");

  const chiudi = () => {
    chiavi.tourVisto = true;
    velo.remove();
  };
  const disegna = () => {
    const s = schede[passo];
    icona.textContent = s.icona;
    titolo.textContent = s.titolo;
    testo.innerHTML = s.testo;
    pallini.forEach((i, k) => i.classList.toggle("on", k === passo));
    const ultima = passo === schede.length - 1;
    avanti.textContent = ultima ? "Iniziamo" : "Avanti";
    salta.style.visibility = ultima ? "hidden" : "visible";
  };
  const avanza = () => {
    if (passo < schede.length - 1) { passo++; disegna(); }
    else chiudi();
  };

  avanti.onclick = avanza;
  salta.onclick = chiudi;
  // Un tocco sul fondo (fuori dalla carta) chiude: «si salta con un tocco».
  velo.addEventListener("click", e => { if (e.target === velo) chiudi(); });

  carta.appendChild(icona);
  carta.appendChild(titolo);
  carta.appendChild(testo);
  carta.appendChild(punti);
  carta.appendChild(avanti);
  carta.appendChild(salta);
  velo.appendChild(carta);
  document.body.appendChild(velo);
  disegna();
}

async function schermoSfoglia() {
  if (!chiavi.tmdb) return vai("impostazioni");
  const mia = ++generazione;
  // la richiesta del render precedente, se c'e', si scarta da sola
  sto_caricando = false;
  if (osservatore) { osservatore.disconnect(); osservatore = null; }
  schermo.innerHTML = "";

  // Senza abbonamenti selezionati /discover non filtrerebbe niente e ti
  // mostrerebbe lo scibile: meglio dirlo che fingere.
  if (!chiavi.servizi.length) {
    const p = el("div", "pad");
    p.appendChild(el("h1", "titolone", "TV"));
    p.appendChild(el("p", "nota",
      "Non hai selezionato nessun abbonamento, quindi non posso dirti " +
      "cosa paghi già."));

    b.onclick = () => vai("impostazioni");
    p.appendChild(b);
    schermo.appendChild(p);
    return;
  }

  // I nomi dei servizi nel pannello dei filtri vengono da qui.
  if (!Object.keys(PROVIDER).length) caricaProvider().catch(() => {});

  // ------------------------------------------------------------- capo
  const testa = el("div", "pad");
  const capo = el("div", "capo");
  const titolo = el("div");
  titolo.style.cssText = "display:flex;align-items:center;flex-wrap:wrap";
  titolo.appendChild(el("h1", "titolone", "TV"));
  titolo.appendChild(bolloStrada());
  capo.appendChild(titolo);
  const azioni = el("div", "azioni");

  const stasera = el("button", "stasera");
  stasera.innerHTML =
    '<svg viewBox="0 0 24 24"><path d="M12 3l2.4 5.6 6 .5-4.6 4 1.4 5.9L12 15.9 6.8 19l1.4-5.9-4.6-4 6-.5z"/></svg>' +
    "Stasera";
  stasera.setAttribute("aria-label", "Stasera cosa guardiamo");
  stasera.onclick = () => schermoStasera();
  azioni.appendChild(stasera);

  const bf = el("button", "bottoneFiltri",
    "Filtri" + (quantiFiltri() ? " · " + quantiFiltri() : ""));
  bf.setAttribute("aria-expanded", String(filtri_aperti));
  if (quantiFiltri()) bf.classList.add("attivi");
  azioni.appendChild(bf);

  capo.appendChild(azioni);
  testa.appendChild(capo);

  const sw = el("div", "interruttore");
  [["movie", "Film"], ["tv", "Serie"]].forEach(([v, etichetta]) => {
    const b = el("button", null, etichetta);
    b.setAttribute("aria-pressed", String(F.tipo === v));
    // cambiando tipo, genere e sottogenere non valgono piu'
    // le soglie di durata dei film non valgono per le serie
    b.onclick = () => {
      F = { ...F, tipo: v, genere: "", keyword: "", durata: "Qualsiasi" };
      schermoSfoglia();
    };
    sw.appendChild(b);
  });
  testa.appendChild(sw);
  schermo.appendChild(testa);

  // --------------------------------------------------------- generi
  const fasciaGeneri = el("div", "generi");
  schermo.appendChild(fasciaGeneri);

  const zonaFiltri = el("div");
  schermo.appendChild(zonaFiltri);
  if (filtri_aperti) zonaFiltri.appendChild(pannelloFiltri());
  bf.onclick = () => {
    filtri_aperti = !filtri_aperti;
    bf.setAttribute("aria-expanded", String(filtri_aperti));
    zonaFiltri.innerHTML = "";
    if (filtri_aperti) zonaFiltri.appendChild(pannelloFiltri());
  };

  const contenitore = el("div");
  schermo.appendChild(contenitore);

  try {
    const lista = await generi(F.tipo);
    [{ id: "", name: "Tutto" }, ...lista].forEach(g => {
      const b = el("button", "chip", esc(g.name));
      b.setAttribute("aria-pressed", String(String(g.id) === F.genere));
      b.onclick = () => {
        F.genere = String(g.id);
        if (!sottogeneriPer(F.genere).some(k => k.k === F.keyword)) F.keyword = "";
        schermoSfoglia();
      };
      fasciaGeneri.appendChild(b);
    });
  } catch (e) {
    contenitore.innerHTML = '<p class="vuoto">' + esc(e.message) + "</p>";
    return;
  }

  // Cache valida: rimetto quello che c'era e torno dove eri.
  if (mia !== generazione) return;
  if (cache.chiave === chiaveFiltri() && cache.elementi.length) {
    disegnaGriglia(contenitore);
    requestAnimationFrame(() => window.scrollTo(0, cache.scroll));
    return;
  }

  cache = { chiave: chiaveFiltri(), elementi: [], pagina: 0, pagine: 1, totale: 0, scroll: 0 };
  window.scrollTo(0, 0);
  contenitore.innerHTML = '<div class="caricamento"><div class="giro"></div></div>';
  await prossimaPagina(contenitore, true, mia);
}

let sto_caricando = false;

async function prossimaPagina(contenitore, prima = false, gen = generazione) {
  if (gen !== generazione) return;
  if (sto_caricando || (!prima && cache.pagina >= cache.pagine)) return;
  sto_caricando = true;
  try {
    const r = await sfoglia(F, cache.pagina + 1);
    if (gen !== generazione) return;   // arrivata tardi: la schermata e' cambiata
    cache.pagina += 1;
    cache.pagine = r.pagine;
    cache.totale = r.totale;
    // TMDB puo' ripetere titoli fra pagine quando l'ordine cambia
    const visti = new Set(cache.elementi.map(x => x.tipo + x.id));
    r.elementi.forEach(x => { if (!visti.has(x.tipo + x.id)) cache.elementi.push(x); });
    const dov_ero = window.scrollY;
    disegnaGriglia(contenitore);
    if (!prima) window.scrollTo(0, dov_ero);
  } catch (e) {
    if (gen === generazione)
      contenitore.innerHTML = '<p class="vuoto">' + esc(e.message) + "</p>";
  } finally {
    if (gen === generazione) sto_caricando = false;
  }
}

function disegnaGriglia(contenitore) {
  contenitore.innerHTML = "";
  if (!cache.elementi.length) {
    contenitore.appendChild(el("p", "vuoto",
      "Niente con questi filtri fra i tuoi abbonamenti.\nProva ad allargare."));
    return;
  }

  const intestazione = el("p", "sezione pad");
  intestazione.innerHTML = "Compreso nei tuoi abbonamenti " +
    '<span class="conteggio">· ' + cache.totale.toLocaleString("it-IT") + " titoli</span>";
  contenitore.appendChild(intestazione);
  contenitore.appendChild(grigliaDi(cache.elementi));

  if (cache.pagina < cache.pagine) {
    const s = el("div", "sentinella");
    contenitore.appendChild(s);

    // Pulsante esplicito: l'IntersectionObserver qui sotto carica da
    // solo quando la pagina e' visibile, ma non scatta se il documento
    // e' nascosto (verificato: visibilityState hidden = zero callback).
    // Il pulsante funziona sempre, e su un telefono e' anche piu' gentile
    // che scaricare pagine da solo.
    const b = el("button", "altri",
      "Carica altri titoli · " + cache.elementi.length + " di " +
      cache.totale.toLocaleString("it-IT"));
    b.onclick = async () => {
      b.disabled = true;
      b.textContent = "Carico…";
      await prossimaPagina(contenitore);
    };
    contenitore.appendChild(b);

    if (osservatore) osservatore.disconnect();
    osservatore = new IntersectionObserver(voci => {
      if (voci.some(v => v.isIntersecting)) prossimaPagina(contenitore);
    }, { rootMargin: "600px" });
    osservatore.observe(s);
  } else if (cache.elementi.length > 20) {
    contenitore.appendChild(el("p", "altri", "Finiti: " + cache.elementi.length + " titoli."));
  }
}

// Lo stato di "Stasera" e' suo: non voglio che toccare qui cambi
// i filtri di Sfoglia, e viceversa.
// Si chiama STASERA e non ST perche' ST e' l'URL di SmartThings.
let STASERA = { tipo: "movie", durata: "Qualsiasi", genere: "",
                keyword: "", preferenza: "Popolari", modalita: "scopri" };

// Gli ultimi 5 consigliati, per ritrovarli tornando indietro da una
// scheda: aprivi un titolo, tornavi, ed erano spariti (schermoStasera
// si ridisegna da capo). Li ricordo con la FIRMA dei filtri di allora,

let ultimaPesca = { firma: null, elenco: [] };
const firmaStasera = () => [STASERA.modalita, STASERA.tipo, STASERA.durata,
  STASERA.genere, STASERA.keyword, STASERA.preferenza].join("|");

// Per addormentarsi serve il contrario di quello che tiene attaccati
// allo schermo. Questi sono gli id dei generi di TMDB.
//
// Non e' una classifica di qualita': un thriller bellissimo e' un
// pessimo film per dormire. E il criterio piu' forte non e' il genere
// ma il RIVISTO: un film che conosci a memoria non ti obbliga a
// seguirlo, e puoi addormentarti a metа senza perdere niente. Per
// questo si pesca prima fra i tuoi visti e solo dopo fra i titoli
// nuovi.
const DORMIRE = {

  sveglia: [28, 53, 27, 80, 10752, 9648, 10768],

  calmano: [35, 10751, 16, 10749, 99, 10402],

  // un capolavoro. Sotto le tre, se l'hai votato male, non lo rivuoi.
  votoMinimo: 3,
};

  { v: "casa",     n: "Sul nostro gusto", seCasa: true },

function modalitaVisibili() {

}

async function schermoStasera() {
  window.scrollTo(0, 0);
  schermo.innerHTML = "";

  const su = el("button", "indietro", "← Sfoglia");
  su.onclick = () => vai("sfoglia");
  schermo.appendChild(su);

  const pad = el("div", "pad");
  pad.appendChild(el("h1", "titolone", "Stasera"));
  schermo.appendChild(pad);

  if (!chiavi.servizi.length) {
    pad.appendChild(el("p", "nota", "Prima scegli gli abbonamenti in Opzioni."));
    return;
  }

  const fascia = valori => fasciaChip(valori.voci, valori.attuale, valori.scegli);
  const gusto = profiloGusto();

  schermo.appendChild(fascia({
    voci: modalitaVisibili().map(m => ({ etichetta: m.n, valore: m.v })),
    attuale: STASERA.modalita,
    scegli: v => { STASERA.modalita = v; schermoStasera(); },
  }));

  // Una riga che dice cosa fa la modalità scelta: per chi apre la
  // prima volta, «Scopri / Sul mio gusto / Da rivedere» non si
  // spiegano da soli. Le modalità che hanno già una loro spiegazione
  // sotto (gusto, casa, rivedere, dormire) non la ripetono qui.
  const spiegaModalita = {
    scopri: "Un titolo a caso dai tuoi abbonamenti, coi filtri che scegli " +
      "qui sotto.",
  }[STASERA.modalita];
  if (spiegaModalita)
    schermo.appendChild(el("p", "spiegaMod", spiegaModalita));

  // Ogni modalita' ha bisogno di controlli diversi: mostrarli tutti
  // sempre renderebbe la schermata un pannello di comandi.
  if (STASERA.modalita !== "rivedere" && STASERA.modalita !== "dormire") {
    const sw = el("div", "interruttore");
    [["movie", "Film"], ["tv", "Serie"]].forEach(([v, etichetta]) => {
      const b = el("button", null, etichetta);
      b.setAttribute("aria-pressed", String(STASERA.tipo === v));
      b.onclick = () => {
        STASERA = { ...STASERA, tipo: v, durata: "Qualsiasi", genere: "", keyword: "" };
        schermoStasera();
      };
      sw.appendChild(b);
    });
    const p2 = el("div", "pad");
    p2.appendChild(sw);
    schermo.appendChild(p2);

    schermo.appendChild(el("p", "sezione pad", "Quanto tempo hai"));
    schermo.appendChild(fascia({
      voci: (DURATE[STASERA.tipo] || []).map(t => ({ etichetta: t.n, valore: t.n })),
      attuale: STASERA.durata,
      scegli: v => { STASERA.durata = v; schermoStasera(); },
    }));
  }

  if (STASERA.modalita === "scopri") {
    const zonaGeneri = el("div");
    schermo.appendChild(el("p", "sezione pad", "Di che genere"));
    schermo.appendChild(zonaGeneri);
    generi(STASERA.tipo).then(lista => {
      zonaGeneri.appendChild(fascia({
        voci: [{ etichetta: "Qualsiasi", valore: "" },
               ...lista.map(g => ({ etichetta: g.name, valore: String(g.id) }))],
        attuale: STASERA.genere,
        scegli: v => {
          STASERA.genere = v;
          // se il sottogenere scelto non sta piu' con questo genere, via
          if (!sottogeneriPer(v).some(k => k.k === STASERA.keyword)) STASERA.keyword = "";
          schermoStasera();
        },
      }));
    }).catch(() => {});

    // I sottogeneri dipendono dal genere: con «Fantascienza» non ha
    // senso offrire «Storia vera». Se non ne resta nessuno, niente riga.
    const sott = sottogeneriPer(STASERA.genere);
    if (sott.length) {
      schermo.appendChild(el("p", "sezione pad", "Sottogenere"));
      schermo.appendChild(fascia({
        voci: [{ etichetta: "Qualsiasi", valore: "" },
               ...sott.map(k => ({ etichetta: k.n, valore: k.k }))],
        attuale: STASERA.keyword,
        scegli: v => { STASERA.keyword = v; schermoStasera(); },
      }));
    }

    schermo.appendChild(el("p", "sezione pad", "Cosa preferisci"));
    schermo.appendChild(fascia({
      voci: PREFERENZE.map(p => ({ etichetta: p.n, valore: p.n })),
      attuale: STASERA.preferenza,
      scegli: v => { STASERA.preferenza = v; schermoStasera(); },

  if (STASERA.modalita === "gusto") {

        "Ne hai " + gusto.quanti + ": vota dalle schede, poi torna qui.";

  if (STASERA.modalita === "casa") {

    const nomi = [...c.generi.map(nomeGenere), ...c.keyword.map(nomeKeyword)]
      .filter(Boolean).slice(0, 4);

    p.innerHTML = c.quanti >= 3 && nomi.length
      ? "Pesco fra <b>" + nomi.map(esc).join(", ") + "</b>: sono i generi " +

        "In casa: tu e " + c.chi.map(esc).join(", ") + "."
      : "Per il gusto di casa servono <b>3 titoli votati 4 o 5 stelle a " +
        "testa</b>, e almeno un genere in comune. Al momento ne contiamo " +
        c.quanti + (c.chi.length
          ? " in comune con " + c.chi.map(esc).join(", ") + "."
          : ", e non vedo ancora i voti di nessun altro: controlla " +
            "Opzioni \u203a Famiglia.");
    schermo.appendChild(p);
