  if (STASERA.modalita === "rivedere") {
    const quanti = visti.tutto.filter(v => (v.mio || 0) >= 4).length;
    const p = el("div", "gusto");
    p.innerHTML = quanti
      ? "Pesco fra " + (quanti === 1
          ? "<b>l\u2019unico</b> titolo che hai votato 4 o 5 stelle"
          : "i <b>" + quanti + "</b> titoli che hai votato 4 o 5 stelle") +
        ", e ti dico se sono ancora fra i tuoi abbonamenti."
      : "Non hai ancora votato niente con 4 o 5 stelle.";
    schermo.appendChild(p);
  }

  if (STASERA.modalita === "dormire") {
    const b = bacinoPerDormire();
    const spuntati = dormire.tutto.length;
    const p = el("div", "gusto");
    // Dov'e' la spunta: sulla scheda di ogni titolo, ma il modo rapido
    // e' la sezione Da votare - e se non lo dico qui non si scopre.
    const dove = "La spunta e\u0300 sulla scheda di ogni titolo accanto alle " +
      "stelle, e in <b>Lista \u203a Da votare</b>, che \u00e8 il modo " +
      "rapido di metterne molte.";
    if (spuntati) {
      const altri = b.length - spuntati;
      p.innerHTML = "Pesco fra " +
        quanti(spuntati,
          "<b>l\u2019unico</b> titolo che hai spuntato come buono per dormire",
          "i <b>" + spuntati + "</b> titoli che hai spuntato come buoni " +
            "per dormire") +
        (altri > 0
          ? ", pi\u00f9 " + quanti(altri, "<b>un altro</b> dai tuoi visti " +
              "tranquilli", "altri <b>" + altri + "</b> dai tuoi visti " +
              "tranquilli") + "."
          : ".") +
        "<br>Vale pi\u00f9 di qualsiasi conto sui generi. " + dove;
    } else if (b.length) {
      p.innerHTML = "Pesco fra " +
        quanti(b.length, "<b>un</b> titolo che hai gi\u00e0 visto e votato",
          "<b>" + b.length + "</b> titoli che hai gi\u00e0 visto e votato") +
        ", togliendo azione, thriller, horror, crime, guerra e mistero." +
        "<br>Ma il criterio migliore lo sai tu. " + dove;
    } else {
      p.innerHTML = "Non hai ancora n\u00e9 spunte n\u00e9 visti tranquilli, " +
        "quindi pesco fra i titoli dei tuoi abbonamenti scegliendo generi " +
        "calmi.<br>" + dove;
    }
    schermo.appendChild(p);
  }

  const risultato = el("div", "pescato");
  const pulsante = el("button", "stasera");
  pulsante.style.marginTop = "18px";
  pulsante.innerHTML =
    '<svg viewBox="0 0 24 24"><path d="M12 3l2.4 5.6 6 .5-4.6 4 1.4 5.9L12 15.9 6.8 19l1.4-5.9-4.6-4 6-.5z"/></svg>' +
    "Consigliami 5 titoli";
  schermo.appendChild(pulsante);
  schermo.appendChild(risultato);

  // Tornando da una scheda ritrovi gli stessi 5 (stessi filtri), senza
  // ripescarne altri. Niente scroll qui: solo se li peschi davvero.
  if (ultimaPesca.elenco.length && ultimaPesca.firma === firmaStasera()) {
    pulsante.innerHTML =
      '<svg viewBox="0 0 24 24"><path d="M12 3l2.4 5.6 6 .5-4.6 4 1.4 5.9L12 15.9 6.8 19l1.4-5.9-4.6-4 6-.5z"/></svg>' +
      "Altri 5 titoli";
    mostraCinque(risultato, ultimaPesca.elenco);
  }

  async function pesca() {
    pulsante.disabled = true;
    pulsante.textContent = "Pesco…";
    risultato.innerHTML = '<div class="caricamento"><div class="giro"></div></div>';
    try {
      // Ogni modalita' riempie `elenco`: fino a 5 coppie { v, d? }, dove
      // d e' la scheda gia' pronta (il motore simili ce l'ha in mano)
      // oppure niente, e allora la chiede il disegno.
      let elenco = [];

      if (STASERA.modalita === "dormire") {
        const b = bacinoPerDormire();
        if (b.length) {
          // Niente rete: i visti ce li ho in mano. Fra i piu' calmi (la
          // meta' piu' tranquilla, almeno 5) ne prendo cinque a caso.
          const testa = b.slice(0, Math.max(5, Math.ceil(b.length / 2)));
          elenco = pescaTanti(testa, 5).map(v => ({ v }));
        } else {
          // Archivio ancora magro: pesco fra i titoli che paghi, con gli
          // stessi criteri (film, non troppo lunghi).
          elenco = (await cinqueDaDiscover(filtroPerDormire())).map(v => ({ v }));
          if (!elenco.length) {
            risultato.innerHTML = '<p class="nota">Non trovo niente di ' +
              'tranquillo fra i tuoi abbonamenti. Provane un altro in ' +
              'Opzioni, o vota qualche titolo che hai già visto.</p>';
            return;
          }
        }

      } else if (STASERA.modalita === "rivedere") {
        // niente rete: i titoli votati ce li ho gia' qui
        const buoni = visti.tutto.filter(x => (x.mio || 0) >= 4);
        if (!buoni.length) {
          risultato.innerHTML = '<p class="nota">Vota qualcosa con 4 o 5 stelle, poi torna.</p>';
          return;
        }
        elenco = pescaTanti(buoni, 5).map(v => ({ v }));

      } else if (STASERA.modalita === "gusto" || STASERA.modalita === "casa") {
        const diCasa = STASERA.modalita === "casa";
        const g = diCasa ? profiloDiCasa() : profiloGusto();
        const segnali = [...g.generi.map(x => ({ genere: x })),
                         ...g.keyword.map(x => ({ keyword: x }))];
        if (g.quanti < 3 || !segnali.length) {
          risultato.innerHTML = '<p class="nota">' + (diCasa
            ? "Per il gusto di casa servono 3 titoli votati 4 o 5 stelle " +
              "a testa, e almeno un genere in comune."
            : "Vota almeno 3 titoli con 4 o 5 stelle e comincio a " +
              "consigliarti sul tuo gusto.") + "</p>";
          return;
        }
        // Sul MIO gusto uso il grafo dei SIMILI di TMDB: i consigliati
        // dei miei preferiti, piu' precisi della somma di generi. Il
        // gusto DI CASA resta sull'incrocio dei generi comuni (i simili
        // di CHI, se i preferiti sono di due persone?), ma anch'esso a 5.
        if (!diCasa) elenco = await cinqueSimili(STASERA.tipo);
        if (!elenco.length) {
          // Ripiego: il vecchio segnale (un genere/keyword a caso), che
          // pesca dal discover ed e' garantito «lo paghi gia'». Serve al
          // gusto di casa, e al mio quando i simili non bastano.
          const scelto = segnali[Math.floor(Math.random() * segnali.length)];
          const f = { tipo: STASERA.tipo, genere: scelto.genere || "",
                      keyword: scelto.keyword || "", ordine: "vote_average.desc",
                      servizio: "", decennio: "Tutti", durata: STASERA.durata };
          elenco = (await cinqueDaDiscover(f)).map(v => ({ v }));
        }

      } else {
        // Scopri: un po' di tutto dai tuoi abbonamenti, coi filtri scelti.
        const pref = PREFERENZE.find(p => p.n === STASERA.preferenza) || PREFERENZE[0];
        const f = { tipo: STASERA.tipo, genere: STASERA.genere, keyword: STASERA.keyword,
                    ordine: pref.ordine, servizio: "", decennio: "Tutti", durata: STASERA.durata };
        elenco = (await cinqueDaDiscover(f)).map(v => ({ v }));
      }

      if (!elenco.length) {
        risultato.innerHTML = '<p class="nota">Niente con questi criteri. Allarga il tiro.</p>';
        return;
      }

      ultimaPesca = { firma: firmaStasera(), elenco };
      await mostraCinque(risultato, elenco);
      // La lista appariva IN FONDO, sotto i filtri e il pulsante: sembrava
      // che il tocco non facesse niente. La porto davanti. Due volte: la
      // prima puo' cadere prima che le locandine diano l'altezza vera.
      setTimeout(() =>
        risultato.scrollIntoView({ behavior: "smooth", block: "start" }), 80);
      setTimeout(() =>
        risultato.scrollIntoView({ behavior: "auto", block: "start" }), 400);
    } catch (e) {
      risultato.innerHTML = '<p class="nota">' + esc(e.message) + "</p>";
    } finally {
      pulsante.disabled = false;
      pulsante.innerHTML =
        '<svg viewBox="0 0 24 24"><path d="M12 3l2.4 5.6 6 .5-4.6 4 1.4 5.9L12 15.9 6.8 19l1.4-5.9-4.6-4 6-.5z"/></svg>' +
        "Altri 5 titoli";
    }
  }
  pulsante.onclick = pesca;
}

// I titoli gia' visti che vanno bene per addormentarsi. Nessuna
// chiamata di rete: quando segni un titolo l'app salva anche i suoi
// generi, proprio per poter fare conti come questo a costo zero.
//
// Ordinati per quanto calmano: prima quelli che hanno un genere
// tranquillo, poi gli altri. Non e' un filtro, e' una preferenza -
// togliere del tutto quelli senza genere calmo svuoterebbe il bacino
// di chi ha votato pochi titoli.
// Il filtro per il ripiego, quando l'archivio dei visti e' ancora
// magro. In una funzione perche' le prove devono poter usare QUESTO e
// non una copia scritta a mano: una prova che ricostruisce il filtro
// non si accorge se quello vero cambia.
// Cosa ho IMPARATO dalle tue spunte: conto generi e keyword dei
// titoli che hai segnato come buoni per dormire. Non e' magia, e' un
// conteggio - come profiloGusto().
//
// La parte che conta davvero e' `smentiti`: i generi che io avevo
// messo fra quelli che tengono sveglio e che TU hai spuntato
// comunque. Quelli smettono di essere esclusi, perche' il tuo
// giudizio su un titolo che conosci vale piu' di una mia regola
// generale. Se per te un certo thriller e' il film che ti fa
// crollare, il thriller non e' piu' un motivo di esclusione.
function profiloDormire() {
  const marchi = dormire.tutto;
  const generi = {}, keyword = {};
  marchi.forEach(v => {
    (v.generiId || []).forEach(g => { generi[g] = (generi[g] || 0) + 1; });
    (v.keyword || []).forEach(k => { keyword[k] = (keyword[k] || 0) + 1; });
  });
  const cima = o => Object.entries(o)
    .sort((a, b) => b[1] - a[1]).slice(0, 4).map(x => x[0]);
  return {
    quanti: marchi.length,
    generi: cima(generi),
    keyword: cima(keyword),
    smentiti: DORMIRE.sveglia.filter(g => generi[String(g)]),
  };
}

// Quanti titoli spuntati servono prima di fidarsi dei tuoi generi
// invece dei miei. Tre: sotto, un singolo titolo strano sposterebbe
// tutto. E' la stessa soglia che "Sul mio gusto" usa per i voti.
const DORMIRE_SOGLIA = 3;


function filtroPerDormire() {
  const p = profiloDormire();
  // Coi tuoi generi al posto dei miei, quando le spunte bastano.
  const chiesti = p.quanti >= DORMIRE_SOGLIA && p.generi.length
    ? p.generi : DORMIRE.calmano;
  // E senza escludere quelli che hai smentito spuntandoli.
  const esclusi = DORMIRE.sveglia.filter(g => !p.smentiti.includes(g));
  return {
    tipo: "movie",
    genere: chiesti.join("|"),
    senzaGenere: esclusi.join(","),
    keyword: "",
    ordine: "vote_average.desc",
    servizio: "",
    decennio: "Tutti",
    // Nessun minimo di minuti: i film corti per dormire vanno
    // benissimo. Solo un tetto, e per questo non passa dalle durate
    // predefinite, che hanno tutte anche un minimo.
    durata: "Qualsiasi",
    maxMinuti: 125,
  };
}

function bacinoPerDormire() {
  const p = profiloDormire();
  // I generi che tengono sveglio, MENO quelli che hai smentito
  // spuntando un titolo che li ha.
  const sveglia = new Set(DORMIRE.sveglia
    .filter(g => !p.smentiti.includes(g)).map(String));
  // E fra i calmi metto anche i tuoi, imparati dalle spunte: cosi'
  // l'ordine dei visti segue il tuo gusto e non il mio.
  const calmano = new Set(DORMIRE.calmano.map(String)
    .concat(p.quanti >= DORMIRE_SOGLIA ? p.generi.map(String) : []));

  // I titoli SPUNTATI a mano vengono prima di tutto, e senza filtri:
  // sono un giudizio di chi guarda, e vale piu' di qualunque conto sui
  // generi. Un film puo' essere una commedia e comunque tenerti
  // sveglio, e viceversa.
  const scelti = dormire.tutto.slice();
  const gia = new Set(scelti.map(x => x.tipo + x.id));

  // Poi i visti tranquilli, per non restare a secco quando le spunte
  // sono ancora poche.
  const dai_generi = visti.tutto.filter(v => {
    if (gia.has(v.tipo + v.id)) return false;
    if ((v.mio || 0) < DORMIRE.votoMinimo) return false;
    return !(v.generiId || []).some(g => sveglia.has(String(g)));
  });
  const punteggio = v =>
    (v.generiId || []).filter(g => calmano.has(String(g))).length;
  dai_generi.sort((a, b) => punteggio(b) - punteggio(a));

  return scelti.concat(dai_generi);
}

// Il pescato: locandina, dati, e i pulsanti per aprirlo sulla TV
// subito. Tutto cio' che esce da qui e' per costruzione fra i tuoi
// abbonamenti, quindi il verdetto non serve ridirlo.
// Cinque titoli da scegliere, invece di pescarne uno alla volta. Ogni
// riga si tocca e apre la scheda (dove ci sono i pulsanti per aprire
// l'app sulla TV): a colpo d'occhio vedi titolo, dove lo paghi, e il
// tuo voto se l'hai gia' visto. Le righe nascono SUBITO nell'ordine
// giusto e poi si riempiono, cosi' l'ordine non dipende da quale
// scheda torna prima dalla rete.
async function mostraCinque(dove, elenco) {
  dove.innerHTML = "";
  const lista5 = el("div", "cinque");
  dove.appendChild(lista5);
  const righe = elenco.map(item => {
    const riga = el("div", "rigaPesca");
    riga.innerHTML = '<div class="caricamento piccolo"><div class="giro"></div></div>';
    lista5.appendChild(riga);
    return { item, riga };
  });
  await Promise.all(righe.map(async ({ item, riga }) => {
    let d = item.d || null;
    if (!d) { try { d = await scheda(item.v.tipo, item.v.id); } catch (e) { d = null; } }
    riempiRiga(riga, item.v, d);
  }));
}

function riempiRiga(riga, v, d) {
  riga.innerHTML = "";
  const mio = visti.voto(v.tipo, v.id);
  const meta = [
    v.tipo === "tv" ? "Serie" : "Film",
    v.anno,
    d && d.durata ? d.durata : "",
    v.voto ? "★ " + v.voto.toFixed(1) : "",
  ].filter(Boolean).join(" · ");
  const dove = d && d.compresi.length
    ? "Su " + d.compresi.map(i => i.nome).join(", ")
    : (d ? "Non è nei tuoi abbonamenti" : "");
  const capo = el("button", "capoPesca");
  capo.innerHTML =
    '<div class="mini">' + locandina(v.locandina, "w154") + "</div>" +
    '<div class="dati"><b>' + esc(v.titolo) + "</b>" +
    '<span class="meta">' + esc(meta) + "</span>" +
    (dove ? '<span class="dove' + (d && d.compresi.length ? "" : " fuori") +
            '">' + esc(dove) + "</span>" : "") +
    (mio ? '<span class="tuo">Il tuo voto: ' + "★".repeat(mio) + "</span>" : "") +
    '<span class="freccia">Apri la scheda →</span>' +
    "</div>";
  capo.onclick = () => schermoDettaglio(v.tipo, v.id, () => schermoStasera());
  riga.appendChild(capo);
}

// Cerca si ricordava niente: cercavi, aprivi un film, tornavi, e
// dovevi riscrivere. Sfoglia la cache l'aveva, qui no.
let ultimaRicerca = { q: "", risultati: [], scroll: 0 };

function schermoCerca() {
  schermo.innerHTML = "";
  const testa = el("div", "pad");
  testa.appendChild(el("h1", "titolone", "Cerca"));
  schermo.appendChild(testa);

  const barra = el("div", "barraRicerca");
  const input = el("input");
  input.type = "search";
  input.placeholder = "Film o serie";
  input.autocomplete = "off";
  input.enterKeyHint = "search";
  input.setAttribute("aria-label", "Titolo da cercare");
  barra.appendChild(input);
  schermo.appendChild(barra);

  const esiti = el("div");
  schermo.appendChild(esiti);

  let ultima = 0;

  function disegnaEsiti(risultati) {
    esiti.innerHTML = "";
    if (!risultati.length) {
      const v = el("div", "vuoto");
      v.appendChild(el("p", null,
        "Nessun titolo con questo nome.\nControlla l’inizio della parola: " +
        "un refuso lì è l’unica cosa che blocca la ricerca."));
      esiti.appendChild(v);
      return;
    }
    // se il risultato viene da un prefisso (l'esatto non trovava
    // niente), lo dico: cosi' un refuso non blocca, ma si capisce
    // perche' i titoli non sono esattamente quello che hai scritto.
    if (risultati.approssimata)
      esiti.appendChild(el("p", "forse", "Forse cercavi…"));
    const lista = el("div", "pad");
    risultati.forEach(v => {
      const r = el("button", "riga");
      r.innerHTML =
        '<div class="mini">' + locandina(v.locandina, "w154") + "</div>" +
        '<div class="dati"><b>' + esc(v.titolo) + "</b><span>" +
        (v.tipo === "tv" ? "Serie" : "Film") + (v.anno ? " · " + v.anno : "") +
        (v.voto ? " · " + v.voto.toFixed(1) : "") + "</span></div>";
      r.onclick = () => {
        ultimaRicerca.scroll = window.scrollY;
        schermoDettaglio(v.tipo, v.id, () => vai("cerca"));
      };
      lista.appendChild(r);
    });
    esiti.appendChild(lista);
  }

  // rientrando, rimetto quello che c'era
  if (ultimaRicerca.q) {
    input.value = ultimaRicerca.q;
    disegnaEsiti(ultimaRicerca.risultati);
    requestAnimationFrame(() => window.scrollTo(0, ultimaRicerca.scroll));
  } else {
    esiti.appendChild(el("p", "vuoto", "Scrivi un titolo.\nTi dico se lo paghi già."));
  }

  const lancia_ricerca = async () => {
    const q = input.value.trim();
    if (!q) {
      ultimaRicerca = { q: "", risultati: [], scroll: 0 };
      esiti.innerHTML = '<p class="vuoto">Scrivi un titolo.</p>';
      return;
    }
    const mio = ++ultima;
    esiti.innerHTML = '<div class="caricamento"><div class="giro"></div></div>';
    try {
      const risultati = await cercaTitoli(q);
      if (mio !== ultima) return;            // digitazione piu' recente
      ultimaRicerca = { q, risultati, scroll: 0 };
      disegnaEsiti(risultati);
    } catch (e) {
      if (mio === ultima) esiti.innerHTML = '<p class="vuoto">' + esc(e.message) + "</p>";
    }
  };

  let attesa;
  input.oninput = () => { clearTimeout(attesa); attesa = setTimeout(lancia_ricerca, 420); };
  input.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); clearTimeout(attesa); input.blur(); lancia_ricerca(); } };
  // se sto rimettendo una ricerca vecchia non apro la tastiera in faccia
  if (!ultimaRicerca.q) input.focus();
}

// Il pulsante "Apri X sulla TV". Estratto perche' serve sia nella
// scheda sia nel pescato di Stasera.
// Il pulsante del Fire Stick. Uno solo, e non uno per app: la
// ricerca globale del Fire TV copre tutte le app insieme, e dice da
// se' quali ce l'hanno («Guarda ora con X») e quali no («Disponibile
// con X» e un prezzo). Su Samsung serviva una tastiera misurata per
// app; qui serve un indirizzo.
function pulsanteFire(d) {
  const b = el("button", "apri");
  const pronto = !!(chiavi.scorciatoiaFire && chiavi.fireip);
  const fermata = FERMATE_FIRE.find(f => f[0] === chiavi.firefino)
    || FERMATE_FIRE[0];
  b.innerHTML = '<span class="logo cerca"><svg viewBox="0 0 24 24">' +
    '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>' +
    '</span><span class="etichetta">' +
    (pronto
      ? "Cerca «" + esc(d.titolo) + "» sul Fire Stick<small>" +
        esc(fermata[2]) + "</small>"
      : "Fire Stick da finire di impostare<small>" +
        (chiavi.fireip ? "Manca il nome della Scorciatoia"
                       : "Manca l\u2019indirizzo del Fire Stick") +
        ": vai in Opzioni</small>") +
    "</span>";
  if (!pronto) {
    b.onclick = () => vai("impostazioni");
    return b;
  }
  b.onclick = () => {
    b.disabled = true;
    b.className = "apri fatto";
    b.querySelector(".etichetta").innerHTML = "Passo «" + esc(d.titolo) +
      "» alla Scorciatoia\u2026<small>Il Fire Stick deve essere accesso " +
      "o in attesa, e l\u2019app non pu\u00f2 saperlo: guarda lo " +
      "schermo.</small>";
    location.href = urlScorciatoia(chiavi.scorciatoiaFire,
      testoPerScorciatoiaFire(d.titolo, chiavi.firefino));
  };
  return b;
}

function pulsanteLancio(i, d) {
  const b = el("button", "apri");
  // Il titolo si puo' scrivere dentro l'app solo se la sua tastiera
  // e' stata misurata E c'e' la Scorciatoia: la scrittura passa dalla
  // rete locale, che un browser non puo' aprire (il certificato della
  // TV vale solo per 127.0.0.1).
  const tastiera = TASTIERE[i.pid];
  const cercaDentro = !!(tastiera && chiavi.scorciatoia);
  b.innerHTML =
    (i.logo ? '<img class="logo" src="' + IMG + "/w92" + i.logo + '" alt="">' : '<span class="logo"></span>') +
    '<span class="etichetta">' + (cercaDentro
      ? "Apri " + esc(i.nome) + " e cerca il titolo<small>Apre l'app e scrive «" +
        esc(d.titolo) + "» nella sua ricerca</small>"
      : "Apri " + esc(i.nome) + " sulla TV<small>Poi cerca il titolo col telecomando</small>") +
    "</span>";
  b.onclick = async () => {
    b.disabled = true;
    b.querySelector(".etichetta").innerHTML = "Apro " + esc(i.nome) + "…<small>Controllo che si apra davvero</small>";
    try {
      const comeEAndata = await lancia(i.app, i.nome);
      if (comeEAndata) {
        b.className = "apri fatto";
        if (cercaDentro) {
          // Qui si chiude il cerchio: l'app e' aperta, e il titolo
          // va alla Scorciatoia, che dentro a-Shell chiama --apri.
          // Quello normalizza lo stato dell'app (BACK ripetuti, che
          // sbattono sul tasto Home in alto senza fare danni), va
          // sulla ricerca e scrive il titolo lettera per lettera.
          b.querySelector(".etichetta").innerHTML = esc(i.nome) +
            " è aperta<small>Passo «" + esc(d.titolo) + "» alla Scorciatoia…</small>";
          scriviConScorciatoia(
            testoPerScorciatoia(tastiera, comeEAndata, d.titolo));
          return;
        }
        b.querySelector(".etichetta").innerHTML = esc(i.nome) +
          " è aperta<small>Ora cerca «" + esc(d.titolo) + "»</small>";
      } else {
        b.className = "apri male";
        b.disabled = false;
        b.querySelector(".etichetta").innerHTML =
          "Non riesco a confermarlo<small>Il comando è partito ma la TV "
          + "non ha riportato il cambio: guarda lo schermo.</small>";
      }
    } catch (e) {
      b.className = "apri male";
      b.disabled = false;
      b.querySelector(".etichetta").innerHTML = esc(e.message) + "<small>Tocca per riprovare</small>";
    }
  };
  // l'append lo fa chi chiama: questa funzione serve sia alla scheda
  // sia al pescato di Stasera
  return b;
}

async function schermoDettaglio(tipo, id, torna) {
  window.scrollTo(0, 0);

  let d;

  };

    else lista.aggiungi({ tipo: d.tipo, id: d.id, titolo: d.titolo, anno: d.anno,
                          voto: d.voto, locandina: d.locandina,
                          // i generi (e le keyword) servono al filtro per
                          // genere nella lista: ce li ho qui, non buttarli
                          generiId: d.generiId, keyword: d.keyword });
    disegnaCuore();
  };
  disegnaCuore();

  const gruppoAzioni = el("div");
  gruppoAzioni.style.cssText = "display:flex;gap:9px;align-items:center";
  const spartisci = el("button", "condividi");
  spartisci.setAttribute("aria-label", "Condividi");
  spartisci.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M8.5 6.5L12 3l3.5 3.5"/><path d="M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg>';
  spartisci.onclick = async () => {
    const esito = await condividi(d.titolo, indirizzoDi(d.tipo, d.id), pad);
    if (esito === "copiato") {
      spartisci.setAttribute("aria-label", "Indirizzo copiato");
      const p = el("p", "nota", "Indirizzo copiato.");
      p.style.margin = "8px 0 0";
      pad.appendChild(p);

  };
  gruppoAzioni.appendChild(spartisci);
  gruppoAzioni.appendChild(cuore);
  barraSu.appendChild(gruppoAzioni);
  schermo.appendChild(barraSu);

  const sfondo = el("div", "sfondo" + (d.sfondo ? "" : " senza"));
  if (d.sfondo) sfondo.innerHTML = '<img src="' + IMG + "/w780" + d.sfondo + '" alt="">';
  schermo.appendChild(sfondo);

  const pad = el("div", "pad");
  schermo.appendChild(pad);

  const meta = [
    d.tipo === "tv" ? "Serie" : "Film",
    d.anno, d.durata,
    d.voto ? "★ " + d.voto.toFixed(1) : "",
  ].filter(Boolean).join(" · ");

  const testa = el("div", "testa");
  testa.innerHTML =
    '<div class="locandina">' + locandina(d.locandina, "w342") + "</div>" +
    "<div><h1>" + esc(d.titolo) + '</h1><div class="meta">' + esc(meta) + "</div></div>";
  pad.appendChild(testa);

  // Il verdetto: la cosa piu' grande della pagina.
  const ha = d.compresi.length > 0;
  const box = el("div", "verdetto " + (ha ? "si" : "no"));
  if (ha) {
    // se non c'e' nulla in abbonamento ma e' gratis, il verdetto
    // giusto e' "e' gratis", non "lo paghi gia'"
    box.innerHTML = '<p class="risposta">' +
      (d.cePaga ? "Lo paghi già" : "È gratis") + '</p><p class="dove">Su ' +
      d.compresi.map(i => esc(i.nome) +
        (i.come !== "nell'abbonamento" ? " (" + esc(i.come) + ")" : "")).join(", ") + "</p>";
  } else if (d.niente) {
    box.innerHTML = '<p class="risposta">Non risulta disponibile in Italia</p>';
  } else {
    box.innerHTML = '<p class="risposta">Non è nei tuoi abbonamenti</p>' +
      (d.altrove.length ? '<p class="dove">In abbonamento su ' + d.altrove.map(esc).join(", ") + "</p>" : "") +
      (d.pagando.length ? '<p class="dove">Pagando: ' + d.pagando.map(esc).join(", ") + "</p>" : "");
  }
  pad.appendChild(box);

  // Le due strade sono ESCLUSIVE, e va bene cosi': sono due stanze, e
  // il modo scelto dice in quale sei. In modo Fire Stick la TV NON si
  // lancia - confermato da chi la usa. Il bollino accanto al titolo
  // dice sempre in quale sei, e un tocco cambia stanza.
  if (chiavi.strada === "fire") {
    pad.appendChild(pulsanteFire(d));
  } else {
    d.compresi.filter(i => i.app).forEach(i => pad.appendChild(pulsanteLancio(i, d)));

    // Scrivere il titolo sulla TV passando per la Scorciatoia iOS.
    // Compare solo se hai detto in Opzioni di averla: un pulsante che
    // apre Scorciatoie per dire "non trovata" non aiuta nessuno.
    if (chiavi.scorciatoia) {
      const sb = el("button", "apri");
      sb.innerHTML = '<span class="logo cerca"><svg viewBox="0 0 24 24">' +
        '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>' +
        '</span><span class="etichetta">Cerca «' +
        esc(d.titolo) + '» sulla TV<small>Apre la ricerca della TV e scrive il ' +
        "titolo. Poi scegli il risultato con la croce nel Telecomando.</small></span>";
      sb.onclick = () => scriviConScorciatoia(d.titolo);
      pad.appendChild(sb);
    }

    const senza = d.compresi.filter(i => !i.app).map(i => i.nome);
    if (senza.length)
      pad.appendChild(el("p", "nota", senza.join(" e ") + ": apri col telecomando, non so lanciarla."));
  }

  if (d.video) {
    pad.appendChild(el("p", "sezione", "Trailer"));
    const t = el("div", "trailer");
    t.innerHTML =
      '<img src="https://img.youtube.com/vi/' + esc(d.video.key) + '/hqdefault.jpg" alt="">' +
      '<div class="via"><span><svg viewBox="0 0 24 24"><path d="M7 4.5l12 7.5-12 7.5z"/></svg></span></div>' +
      '<div class="quale">' + esc(d.video.name) + "</div>";
    t.onclick = () => {
      // youtube-nocookie: meno tracciamento, stesso video
      t.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' +
        esc(d.video.key) + '?autoplay=1&rel=0" allow="autoplay; fullscreen; encrypted-media" ' +
        'allowfullscreen title="Trailer"></iframe>';
    };
    pad.appendChild(t);
  }

  // Serie: quando esce il prossimo, e le stagioni.
  // ------------------------------------------------- visto e voto
  const blocco = el("div", "visto");
  const rifaiVisto = () => {
    const mio = visti.voto(d.tipo, d.id);
    blocco.innerHTML = '<p class="domanda">' +
      (mio ? "L'hai visto. Quanto ti è piaciuto?" : "L'hai già visto? Dai un voto.") + "</p>";
    const fila = el("div", "stelle");
    for (let n = 1; n <= 5; n++) {
      const b = el("button");
      b.className = n <= mio ? "piena" : "";
      b.setAttribute("aria-label", n + (n === 1 ? " stella" : " stelle"));
      b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.7 6.2.6-4.7 4.2 1.4 6.1L12 16.9l-5.5 3.2 1.4-6.1L3.2 9.8l6.2-.6z"/></svg>';
      b.onclick = () => {
        visti.segna({
          tipo: d.tipo, id: d.id, titolo: d.titolo, anno: d.anno,
          voto: d.voto, locandina: d.locandina,
          generiId: d.generiId, keyword: d.keyword,
        }, n);
        // segnato come visto: dalla lista "da guardare" non serve piu'
        if (lista.ha(d.tipo, d.id)) { lista.togli(d.tipo, d.id); disegnaCuore(); }
        rifaiVisto();
      };
      fila.appendChild(b);
    }
    blocco.appendChild(fila);

    // Il voto di chi altro sta in casa. Non si mescola col tuo: si
    // affianca. E' l'unico modo perche' «Stasera» possa pescare
    // quello che piace a tutti e due invece di una media che non e'
    // il gusto di nessuno.
    const loro = altrui.di(d.tipo, d.id);
    if (loro.length) {
      const p = el("p", "altroVoto");
      p.innerHTML = loro.map(x => esc(x.chi) + ": " +
        "\u2605".repeat(x.mio) + "\u2606".repeat(5 - x.mio)).join(" \u00b7 ");
      blocco.appendChild(p);
    }

    if (mio) {
      const t = el("button", "togli", "Non l'ho visto");
      t.onclick = () => { visti.togli(d.tipo, d.id); rifaiVisto(); };
      blocco.appendChild(t);
    }

    // La spunta «da dormire». Sta qui e non fra le azioni in alto
    // perche' e' un giudizio sul titolo, come il voto - e si mette
    // nello stesso momento.
    const notte = el("button", "togli");
    const disegnaNotte = () => {
      const dentro = dormire.ha(d.tipo, d.id);
      notte.className = "togli" + (dentro ? " acceso" : "");
      notte.setAttribute("aria-pressed", String(dentro));

      if (dormire.ha(d.tipo, d.id)) dormire.togli(d.tipo, d.id);
      else dormire.aggiungi({
        tipo: d.tipo, id: d.id, titolo: d.titolo, anno: d.anno,
        voto: d.voto, locandina: d.locandina,
        generiId: d.generiId, keyword: d.keyword,
      });
      disegnaNotte();
    };
    disegnaNotte();
    blocco.appendChild(notte);
  };
  rifaiVisto();

  if (d.tipo === "tv") {
    const box = el("div", "prossimo");
    if (d.prossimo) {

        '<p class="quando">Prossimo episodio</p>' +

        '<p class="cosa">' + d.stagioni.length +
        (d.stagioni.length === 1 ? " stagione" : " stagioni") +
        (d.quantiEpisodi ? " · " + d.quantiEpisodi + " episodi" : "") + "</p>" +
        (d.ultimo ? '<p class="data">Ultimo: S' + d.ultimo.season_number + "E" +
          d.ultimo.episode_number + " · " + esc(quandoEsce(d.ultimo.air_date)) + "</p>" : "");
    }
    pad.appendChild(box);

    if (d.stagioni.length) {
      pad.appendChild(el("p", "sezione", "Stagioni"));
      d.stagioni.forEach(st => {
        const r = el("button", "riga");
        r.innerHTML =
          '<div class="mini">' + locandina(st.locandina, "w154") + "</div>" +
          '<div class="dati"><b>' + esc(st.nome) + "</b><span>" +
          st.quanti + (st.quanti === 1 ? " episodio" : " episodi") +
          (st.anno ? " · " + st.anno : "") + "</span></div>";
        r.onclick = () => schermoStagione(d, st);
        pad.appendChild(r);
      });
    }
  }

  if (d.regia.length) {
    pad.appendChild(el("p", "sezione", d.regia.length > 1 ? "Regia" : "Regia"));
    const fila = el("div", "cast");
    fila.style.padding = "2px 0 6px";
    d.regia.forEach(r => {
      const x = el("button", "attore");
      x.innerHTML =
        '<div class="faccia">' + (r.foto ? locandina(r.foto, "w185") : esc((r.nome || "?")[0])) + "</div>" +
        "<b>" + esc(r.nome) + "</b>";
      x.onclick = () => schermoPersona(r.id, () => schermoDettaglio(d.tipo, d.id));
      fila.appendChild(x);
    });
    pad.appendChild(fila);
  }

  if (d.generi.length) {
    pad.appendChild(el("p", "sezione", "Generi"));
    pad.appendChild(el("p", "meta", esc(d.generi.join(" · "))));
  }
  if (d.trama) {
    pad.appendChild(el("p", "sezione", "Trama"));
    pad.appendChild(el("p", "trama", esc(d.trama)));
  }
  if (d.cast.length) {
    schermo.appendChild(el("p", "sezione pad", "Cast"));
    const fila = el("div", "cast");
    d.cast.forEach(a => {
      const x = el("button", "attore");
      x.innerHTML =
        '<div class="faccia">' + (a.foto ? locandina(a.foto, "w185") : esc((a.nome || "?")[0])) + "</div>" +
        "<b>" + esc(a.nome) + "</b>" + (a.ruolo ? "<span>" + esc(a.ruolo) + "</span>" : "");
      x.onclick = () => schermoPersona(a.id, () => schermoDettaglio(d.tipo, d.id));
      fila.appendChild(x);
    });
    schermo.appendChild(fila);
  }

  // La saga: arriva dopo, come i simili.
  if (d.saga) {
    const zonaSaga = el("div");
    schermo.appendChild(zonaSaga);
    sagaCompleta(d.saga, d.id).then(s => {
      if (s.parti.length < 2) return;
      const tue = s.parti.filter(p => p.tua).length;
      zonaSaga.appendChild(el("p", "sezione pad", esc(s.nome)));
      const p = el("div", "gusto");
      p.innerHTML = tue === s.parti.length
        ? "Hai <b>tutti</b> i " + s.parti.length + " capitoli."
        : "<b>" + tue + " di " + s.parti.length + "</b> capitoli sono nei tuoi " +
          "abbonamenti. Gli altri sono sbiaditi.";
      zonaSaga.appendChild(p);
      zonaSaga.appendChild(grigliaDi(s.parti));
    }).catch(() => {});
  }

  // Simili: arriva dopo, senza far aspettare il resto della scheda.
  const zonaSimili = el("div");
  schermo.appendChild(zonaSimili);
  simili(d).then(altri => {
    if (!altri.length) return;
    zonaSimili.appendChild(el("p", "sezione pad",
      d.keyword.length ? "Simili, e li paghi già" : "Dello stesso genere, e li paghi già"));
    zonaSimili.appendChild(grigliaDi(altri));
  }).catch(() => {});
}

async function schermoStagione(serie, stagione) {
  window.scrollTo(0, 0);
  girello();
  let dati;
  try {
    dati = await tmdb("/tv/" + serie.id + "/season/" + stagione.numero, { language: LINGUA });
  } catch (e) { return vuoto(e.message); }

  schermo.innerHTML = "";
  const su = el("button", "indietro", "← " + esc(serie.titolo));
  su.onclick = () => schermoDettaglio(serie.tipo, serie.id);
  schermo.appendChild(su);

  const pad = el("div", "pad");
  pad.appendChild(el("h1", "titolone", esc(stagione.nome)));
  schermo.appendChild(pad);

  const episodi = dati.episodes || [];
  if (!episodi.length) {
    pad.appendChild(el("p", "nota", "Nessun episodio elencato per questa stagione."));
    return;
  }

  const oggi = new Date().toISOString().slice(0, 10);
  episodi.forEach(e => {
    const futuro = e.air_date && e.air_date > oggi;
    const r = el("div", "episodio" + (futuro ? " futuro" : ""));
    r.innerHTML =
      '<div class="fermo">' +
        (e.still_path ? '<img loading="lazy" src="' + IMG + "/w300" + e.still_path + '" alt="">' : "") +
      "</div>" +
      '<div class="dati"><b>' + e.episode_number + ". " + esc(e.name || "") + "</b>" +
      "<span>" + esc(quandoEsce(e.air_date)) +
      (e.runtime ? " · " + e.runtime + " min" : "") +
      (e.vote_average ? " · ★ " + e.vote_average.toFixed(1) : "") + "</span>" +
      (e.overview ? '<div class="trama2">' + esc(e.overview) + "</div>" : "") +
      "</div>";
    pad.appendChild(r);
  });
}

// Le serie della lista: quando escono i prossimi episodi.
// Una chiamata per serie, in parallelo. Il risultato resta in
// sessionStorage per non rifarle a ogni apertura della scheda Lista.
async function inArrivo(voci) {
  const serie = voci.filter(v => v.tipo === "tv");
  if (!serie.length) return [];

  const memoria = "arrivo_" + serie.map(v => v.id).sort().join(",");
  const salvato = sessionStorage.getItem(memoria);
  if (salvato) { try { return JSON.parse(salvato); } catch (e) { /* si rifa' */ } }

  const esiti = await Promise.all(serie.map(async v => {
    try {
      const d = await tmdb("/tv/" + v.id, { language: LINGUA });
      const p = d.next_episode_to_air;
      if (!p || !p.air_date) return null;
      return {
        id: v.id, titolo: v.titolo, locandina: v.locandina,
        stagione: p.season_number, episodio: p.episode_number,
        nome: p.name || "", data: p.air_date,
      };
    } catch (e) { return null; }
  }));

  const lista = esiti.filter(Boolean).sort((a, b) => a.data.localeCompare(b.data));
  sessionStorage.setItem(memoria, JSON.stringify(lista));
  return lista;
}

// I nomi dei generi stanno in sessionStorage da quando hai sfogliato:
// se non ci sono ancora, mostro l'id invece di fare una chiamata.
function nomeGenere(id) {
  for (const tipo of ["movie", "tv"]) {
    try {
      const l = JSON.parse(sessionStorage.getItem("generi_" + tipo) || "[]");
      const g = l.find(x => String(x.id) === String(id));
      if (g) return g.name;
    } catch (e) { /* pazienza */ }
  }
  return null;
}
function nomeKeyword(k) {
  const v = SOTTOGENERI.find(x => x.k === String(k));
  return v ? v.n : null;
}

// I generi DAVVERO presenti in una lista di titoli, dal piu' frequente
// al meno. I nomi vengono dalla cache di sessione (generi_movie/tv):
// se non c'e' ancora, chi disegna la riempie prima con generi(). Cosi'
// i filtri della lista mostrano solo generi che hai per davvero, non
// una tendina di tutto.
function generiDiLista(voci) {
  const conta = {};
  voci.forEach(v => (v.generiId || []).forEach(id => {
    const nome = nomeGenere(id);
    if (nome) conta[nome] = (conta[nome] || 0) + 1;
  }));
  return Object.keys(conta)
    .sort((a, b) => conta[b] - conta[a] || a.localeCompare(b))
    .map(nome => ({ nome, quanti: conta[nome] }));
}

// Rimpolpa i GENERI dei titoli in lista che non li hanno: aggiunti
// prima che li salvassi (o dalla ricerca, che non porta i generi), e
// senza il filtro per genere li ignorerebbe. Prende la scheda (in
// cache) di ciascuno, UNA volta, e scrive i generiId. A piccoli
// gruppi e con un tetto, per non martellare TMDB. Muta anche gli
// oggetti `voci` in memoria, cosi' il filtro li vede subito. Torna
// true se ha cambiato qualcosa (le chip vanno ridisegnate).
async function backfillGeneriLista(voci) {
  const mancanti = voci.filter(v => !(v.generiId && v.generiId.length)).slice(0, 40);
  let cambiato = false;
  for (let i = 0; i < mancanti.length; i += 5) {
    await Promise.all(mancanti.slice(i, i + 5).map(async v => {
      try {
        const d = await scheda(v.tipo, v.id);
        if (d.generiId && d.generiId.length) {
          v.generiId = d.generiId;   // l'oggetto in memoria, per il filtro
          v.keyword = d.keyword;
          lista.aggiornaMeta(v.tipo, v.id, { generiId: d.generiId, keyword: d.keyword });
          cambiato = true;
        }
      } catch (e) { /* un titolo senza scheda non ferma gli altri */ }
    }));
  }
  return cambiato;
}

let vistaLista = "da guardare";

// Le viste della Lista, dichiarate una volta sola: l'interruttore e
// lo smistamento leggono la stessa cosa, cosi' non puo' succedere che
// compaia un pulsante che non porta da nessuna parte.
// La prima non ha una «parte»: e' quella disegnata da schermoLista.
const VISTE_LISTA = [
  ["da guardare", "Da guardare"],
  ["visti", "Visti"],
  ["votare", "Da votare"],
];
const PARTI_LISTA = { visti: parteVisti, votare: parteVotare };

function schermoLista() {
  schermo.innerHTML = "";
  const pad = el("div", "pad");
  pad.appendChild(el("h1", "titolone", "La tua lista"));

  const sw = el("div", "interruttore");
  VISTE_LISTA.forEach(([v, etichetta]) => {
    const b = el("button", null, etichetta);
    b.setAttribute("aria-pressed", String(vistaLista === v));
    b.onclick = () => { vistaLista = v; schermoLista(); };
    sw.appendChild(b);
  });
  pad.appendChild(sw);
  schermo.appendChild(pad);

  const parte = PARTI_LISTA[vistaLista];
  if (parte) return parte();

  const voci = lista.tutto;
  if (!voci.length) {
    const v = el("div", "vuoto");
    v.appendChild(el("p", null,
      "Qui finiscono i titoli che segni col cuore.\nCosì non li perdi quando li trovi e non hai tempo."));
    // uno stato vuoto che spiega e basta e' un vicolo cieco: da qui
    // si parte.
    const b = el("button", "primario", "Cerca un titolo");
    b.style.cssText = "margin:14px auto 0";
    b.onclick = () => vai("cerca");
    v.appendChild(b);
    schermo.appendChild(v);
    return;
  }

  // In arrivo: si popola dopo, senza far aspettare la griglia.
  const zonaArrivo = el("div");
  schermo.appendChild(zonaArrivo);

  // Cercare DENTRO la lista, e filtrarla per tipo. Compare da un po'
  // di titoli in su: sotto quella soglia scorrere e' piu' veloce che
  // filtrare, e la barra sarebbe solo un ingombro.
  const intestazione = el("p", "sezione pad");
  schermo.appendChild(intestazione);
  const grigliaZona = el("div");
  schermo.appendChild(grigliaZona);

  let cerca = "", tipoLista = "tutti", genereLista = "";
  const senzaAccenti = (t) => (t || "").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "");
  const disegnaGriglia = () => {
    const q = senzaAccenti(cerca.trim());
    const filtrati = voci.filter(v =>
      (tipoLista === "tutti" || v.tipo === tipoLista) &&
      (!q || senzaAccenti(v.titolo).includes(q)) &&
      (!genereLista || (v.generiId || []).some(id => nomeGenere(id) === genereLista)));
    const filtrato = cerca || tipoLista !== "tutti" || genereLista;
    intestazione.innerHTML = filtrati.length +
      (filtrati.length === 1 ? " titolo" : " titoli") +
      (filtrato
        ? ' <span class="conteggio">· di ' + voci.length + "</span>"
        : ' <span class="conteggio">· i più recenti in cima</span>');
    grigliaZona.innerHTML = "";
    if (!filtrati.length)
      grigliaZona.appendChild(el("p", "altri", "Nessuno con questo filtro."));
    else grigliaZona.appendChild(grigliaDi(filtrati));
  };

  if (voci.length >= 8) {
    const barra = el("div", "cercaLista");
    const inp = el("input");
    inp.type = "search";
    inp.placeholder = "Cerca nella lista";
    inp.setAttribute("aria-label", "Cerca nella tua lista");
    inp.autocomplete = "off";
    inp.oninput = () => { cerca = inp.value; disegnaGriglia(); };
    barra.appendChild(inp);
    schermo.insertBefore(barra, intestazione);

    const chips = el("div", "generi");
    chips.style.cssText = "padding:2px 16px 2px";
    [["tutti", "Tutti"], ["movie", "Film"], ["tv", "Serie"]].forEach(
      ([v, etichetta]) => {
        const c = el("button", "chip", etichetta);
        c.setAttribute("aria-pressed", String(tipoLista === v));
        c.onclick = () => {
          tipoLista = v;
          chips.querySelectorAll(".chip").forEach(x =>
            x.setAttribute("aria-pressed",
              String(x.textContent === etichetta)));
          disegnaGriglia();
        };
        chips.appendChild(c);
      });
    schermo.insertBefore(chips, intestazione);

    // Filtro per GENERE: solo i generi che hai davvero in lista. I nomi
    // stanno nella cache di sessione; se non c'e' la riempio prima
    // (una chiamata piccola, i ~20 generi, poi e' in cache). Le chip
    // arrivano dopo, senza bloccare la griglia.
    const zonaGen = el("div", "generi");
    zonaGen.style.cssText = "padding:2px 16px 2px";
    schermo.insertBefore(zonaGen, intestazione);
    const costruisciGeneri = () => {
      zonaGen.innerHTML = "";
      const presenti = generiDiLista(voci);
      if (presenti.length < 2) return;   // un genere solo: niente da filtrare
      const voci2 = [{ nome: "Tutti i generi", valore: "" },
                     ...presenti.map(g => ({ nome: g.nome, valore: g.nome }))];
      voci2.forEach(({ nome, valore }) => {
        const c = el("button", "chip", esc(nome));
        c.setAttribute("aria-pressed", String(genereLista === valore));
        c.onclick = () => {
          genereLista = valore;
          zonaGen.querySelectorAll(".chip").forEach(x =>
            x.setAttribute("aria-pressed", String(x.textContent === nome)));
          disegnaGriglia();
        };
        zonaGen.appendChild(c);
      });
    };
    Promise.all([generi("movie"), generi("tv")]).catch(() => {}).then(async () => {
      costruisciGeneri();                         // coi generi gia' salvati
      // i titoli vecchi (o da ricerca) non hanno i generi: li rimpolpo,
      // poi ridisegno le chip - cosi' i generi compaiono anche per loro
      if (await backfillGeneriLista(voci)) {
        costruisciGeneri();
        if (genereLista) disegnaGriglia();
      }
    });
  }

  disegnaGriglia();

  inArrivo(voci).then(prossimi => {
    if (!prossimi.length) return;
    const oggi = new Date(); oggi.setHours(0, 0, 0, 0);
    zonaArrivo.appendChild(el("p", "sezione pad",
      prossimi.length === 1 ? "In arrivo" : "In arrivo · " + prossimi.length + " episodi"));
    const pad2 = el("div", "pad");
    prossimi.forEach(p => {
      const giorni = Math.round((new Date(p.data + "T00:00:00") - oggi) / 86400000);
      const b = el("button", "arrivo");
      b.innerHTML =
        '<div class="mini">' + locandina(p.locandina, "w154") + "</div>" +
        '<div class="dati"><b>' + esc(p.titolo) + "</b><span>S" + p.stagione + "E" + p.episodio +
        (p.nome ? " · " + esc(p.nome) : "") + "</span></div>" +
        '<span class="fra' + (giorni <= 0 ? " oggi" : "") + '">' +
        (giorni <= 0 ? "oggi" : giorni === 1 ? "domani" : "fra " + giorni + "g") + "</span>";
      b.onclick = () => { cache.scroll = window.scrollY; schermoDettaglio("tv", p.id); };
      pad2.appendChild(b);
    });
    zonaArrivo.appendChild(pad2);
  }).catch(() => {});

  schermo.appendChild(pulsanteManda(voci, false));

  const b = el("button", "svuota", "Svuota la lista");
  b.onclick = () => {
    // niente conferme a vuoto: il secondo tocco e' la conferma
    if (b.dataset.sicuro !== "1") {
      b.dataset.sicuro = "1";
      b.textContent = "Tocca di nuovo per svuotare davvero";
      return;
    }
    lista.tutto = [];
    schermoLista();
  };
  schermo.appendChild(b);
}

function parteVisti() {
  const voci = visti.tutto;
  if (!voci.length) {
    const v = el("div", "vuoto");
    v.appendChild(el("p", null,
      "Qui finiscono i titoli che hai votato.\nPiù ne voti, meglio «Stasera» ti conosce."));
    // il modo rapido e' la linguetta accanto: mandaci, invece di dire
    // «vai su una scheda»
    const b = el("button", "primario", "Vota in fretta");
    b.style.cssText = "margin:14px auto 0";
    b.onclick = () => { vistaLista = "votare"; schermoLista(); };
    v.appendChild(b);
    schermo.appendChild(v);
    return;
  }

  const g = profiloGusto();
  if (g.quanti >= 3) {
    const nomi = [...g.generi.map(nomeGenere), ...g.keyword.map(nomeKeyword)]
      .filter(Boolean).slice(0, 4);
    if (nomi.length) {
      const p = el("div", "gusto");
      p.innerHTML = "Da " + g.quanti + " titoli che hai votato 4 o 5 stelle, ti piacciono " +
        "<b>" + nomi.map(esc).join(", ") + "</b>. " +
        "«Stasera → Sul mio gusto» pesca da qui.";
      schermo.appendChild(p);
    }
  } else {
    const p = el("div", "gusto");
    // e dico anche DOVE votarne in fretta: «Da votare» e' la
    // linguetta accanto, ma se non lo scrivo qui non si trova
    p.innerHTML = "Vota almeno <b>3 titoli con 4 o 5 stelle</b> e «Stasera» " +
      "comincia a pescare sul tuo gusto. Ne hai " + g.quanti + ".<br>" +
      "Il modo rapido \u00e8 la linguetta <b>Da votare</b>, qui sopra.";
    schermo.appendChild(p);
  }

  const conteggio = el("p", "sezione pad");
  conteggio.innerHTML = voci.length + (voci.length === 1 ? " titolo votato" : " titoli votati") +
    ' <span class="conteggio">· gli ultimi in cima</span>';
  schermo.appendChild(conteggio);
  schermo.appendChild(grigliaDi(voci, true));
  schermo.appendChild(pulsanteManda(voci, true));
}

// Manda la lista a qualcuno: l'indirizzo contiene solo numeri, quindi
// nessun segreto e nessun server. Chi lo apre vede cosa gli stai
// mandando PRIMA di aggiungerlo.
function pulsanteManda(voci, sonoVisti) {
  const etichetta = sonoVisti ? "Manda i titoli votati" : "Manda la lista";
  const b = el("button", "svuota", etichetta);
  b.onclick = async () => {
    const url = location.origin + location.pathname +
      "#/" + (sonoVisti ? "visti" : "lista") + "/" + codificaVoci(voci, sonoVisti);
    const esito = await condividi(etichetta, url, b.parentElement);
    if (esito === "copiato") {
      b.textContent = "Indirizzo copiato";
      setTimeout(() => { b.textContent = etichetta; }, 2200);
    }
  };
  return b;
}

// Ricevere una lista da qualcuno. I titoli arrivano come numeri:
// i dati li prendo da TMDB, e per i visti prendo anche generi e
// keyword, altrimenti i titoli importati non contribuirebbero al
// profilo di gusto.
// Votare in fretta, per riempire l'archivio. Una scheda per titolo
// sarebbe troppo lenta: qui ogni titolo e' una riga con locandina,
// stelle e la spunta «notte».
//
// Da dove pesca: i titoli PIU' VOTATI dei tuoi abbonamenti, non i piu'
// popolari. Provato sul telefono: «popolari» vuol dire popolari
// QUESTA settimana, e la fila veniva piena di uscite del 2026 che non
// puoi aver visto - e su un titolo che non conosci non c'e' niente da
// votare. I piu' votati su TMDB sono invece i piu' visti di sempre.
// Alterna film e serie, che altrimenti verrebbero solo film.
// Due mazzi. Il primo - i piu' votati - e' quello che massimizza le
// probabilita' che tu l'abbia visto, ma sono tutti blockbuster: una
// pagina intera di Marvel, e da spuntare «notte» non c'e' niente. Il
// secondo pesca nello STESSO bacino di «Per dormire», cosi' le spunte
// che metti li' finiscono dritte nella modalita' che le usa.
// A che punto del catalogo sei arrivato a votare. PERSISTE: il mazzo
// pesca dai piu' visti (vote_count.desc) e tu voti dall'alto in basso,
// quindi se ogni volta ripartisse da pagina 1 ti riproporrebbe i
// titoli che hai appena votato - e a furia di votarne finiva per non
// mostrarti piu' niente. Ricordando dove sei, riparti dai successivi.
let paginaVotare = Number(localStorage.getItem("pagina_votare")) || 0;
let daVotare = [];

// I titoli da votare: i piu' visti (vote_count alto), quelli che hai
// piu' probabilita' di aver gia' visto. UN MAZZO SOLO: prima c'era
// anche «Da dormire», ma la divisione confondeva e il tasto 🌙 sulla
// carta basta a segnare i calmi per «Per dormire».
function filtroDaVotare(tipo) {
  return {
    tipo, genere: "", keyword: "", ordine: "vote_count.desc",
    servizio: "", decennio: "Tutti", durata: "Qualsiasi",
  };
}

// La coda visibile: quello che hai gia' votato esce, cosi' la fila si
// accorcia mentre la riempi. La spunta «notte» invece NON fa uscire:
// spuntare non e' votare, e una riga che sparisce sotto il dito
// mentre la spunti e' solo fastidiosa.
function codaDaVotare() {
  // Esce dalla coda quello che hai gia' sistemato:
  //   votato   -> l'hai visto, il voto c'e'
  //   scartato -> «non l'ho visto», non me lo far votare
  //   nel cuore -> lo vuoi vedere, non l'hai ancora visto: niente voto
  return daVotare.filter(v =>
    !visti.voto(v.tipo, v.id) &&
    !scartati.ha(v.tipo, v.id) &&
    !lista.ha(v.tipo, v.id));
}

// La RASSEGNA NOTTE: i titoli che hai gia' votato, rimessi UNA volta in
// cima al mazzo per segnare col 🌙 quelli da dormire. Prima, tolto il
// mazzo «Da dormire», i titoli votati sparivano e non potevi piu'
// segnarli. Escono appena li sistemi: 🌙 -> vanno in `dormire`; «non
// e' da dormire» -> vanno in `rassegnati`. In entrambi i casi non
// tornano. Piu' recenti prima, come li hai votati.
function rassegnaNotte() {
  return visti.tutto
    .filter(v => (v.mio || 0) >= 1 &&
                 !dormire.ha(v.tipo, v.id) &&
                 !rassegnati.ha(v.tipo, v.id))
    .map(v => ({
      tipo: v.tipo, id: v.id, titolo: v.titolo, anno: v.anno,
      voto: v.voto || 0, locandina: v.locandina,
      generiId: v.generiId, keyword: v.keyword,
    }));
}

// Il mazzo intero: prima la rassegna (i votati da rivedere per la
// notte), poi i titoli nuovi da votare.
function codaMazzo() {
  return [...rassegnaNotte(), ...codaDaVotare()];
}

// Votare un titolo DAL MAZZO (carta normale o della rassegna). Oltre a
// segnarlo visto, lo metto fra i `rassegnati`: se no, appena votato
// rientrerebbe nella rassegna notte (e' votato, non ancora 🌙) e,
// stando la rassegna in cima, ti RIMBALZEREBBE davanti invece di
// passare al titolo nuovo - «non mi fa vedere piu' altri titoli». Il 🌙
// ce l'avevi gia' sulla carta mentre votavi, quindi non serve
// rivederlo. La rassegna resta per i voti VECCHI, una volta.
function votaDalMazzo(dati, n) {
  visti.segna(dati, n);
  if (lista.ha(dati.tipo, dati.id)) lista.togli(dati.tipo, dati.id);
  rassegnati.aggiungi(dati);
}

async function altroDaVotare() {
  paginaVotare += 1;
  localStorage.setItem("pagina_votare", String(paginaVotare));   // non ripartire dall'alto
  // alterno film e serie: chiedendo solo film, le serie non
  // arriverebbero mai
  const tipo = paginaVotare % 2 ? "movie" : "tv";
  const pagina = Math.ceil(paginaVotare / 2);
  const r = await sfoglia(filtroDaVotare(tipo), pagina);
  const gia = new Set(daVotare.map(x => x.tipo + x.id));
  r.elementi.forEach(x => {
    if (!gia.has(x.tipo + x.id)) daVotare.push(x);
  });
  return codaDaVotare();
}

// Quanto e' pieno l'archivio, e a cosa serve esserlo. Le due soglie
// sono le stesse che usano davvero le due modalita', prese da loro e
// non ricopiate: se cambiano la', cambia anche qui.
function quantoArchivio() {
  const voti = visti.tutto.filter(v => v.mio).length;
  const spunte = dormire.tutto.length;
  return {
    voti, spunte,
    gustoPronto: voti >= 3,
    dormirePronto: spunte >= DORMIRE_SOGLIA,
  };
}

// Il conto, e a cosa serve: senza questo non sai se stai votando a
// vuoto o se hai gia' abbastanza roba perche' le due modalita'
// lavorino. «Ne manca una» e' l'unica cosa che fa venire voglia di
// metterne una.
function testoArchivio() {
  const q = quantoArchivio();
  const mancaGusto = 3 - q.voti, mancaNotte = DORMIRE_SOGLIA - q.spunte;
  const conto = "<b>" + q.voti + "</b> " + quanti(q.voti, "voto", "voti") +
    " \u00b7 <b>" + q.spunte + "</b> " +
    quanti(q.spunte, "spunta notte", "spunte notte");
  // Quando sono a posto tutte e due, il conto torna una riga sola: su
  // un telefono ogni riga in cima e' una riga di titoli in meno.
  if (q.gustoPronto && q.dormirePronto)
    return conto + " \u00b7 \u2713 le modalit\u00e0 imparano da qui";
  return conto + "<br>" +
    (q.gustoPronto ? "\u2713 Sul mio gusto sceglie dai tuoi voti"
       : "Sul mio gusto: " + quanti(mancaGusto, "manca un voto",
           "mancano " + mancaGusto + " voti")) + "<br>" +
    (q.dormirePronto ? "\u2713 Per dormire impara dalle tue spunte"
       : "Per dormire: " + quanti(mancaNotte, "manca una spunta",
           "mancano " + mancaNotte + " spunte"));
}

async function parteVotare() {
  if (!chiavi.servizi.length) {
    schermo.appendChild(el("p", "vuoto",
      "Prima scegli gli abbonamenti in Opzioni."));
    return;
  }

  // Compatto: su una carta a tutto schermo, tre righe di contatore
  // rubano il poster. Una riga basta a far vedere il numero salire.
  const spiega = el("p", "contaVotare");
  spiega.style.cssText = "margin:2px 16px 6px";
  const scriviConta = () => {
    const q = quantoArchivio();
    spiega.innerHTML = "<b>" + q.voti + "</b> " +
      quanti(q.voti, "voto", "voti") + " · <b>" + q.spunte + "</b> " +
      quanti(q.spunte, "spunta notte", "spunte notte") +
      (q.gustoPronto && q.dormirePronto ? " · ✓ imparano da qui" : "");
  };
  scriviConta();
  schermo.appendChild(spiega);
  // si riscrive a ogni voto: vedere il numero salire mentre voti e'
  // la cosa che fa votare il prossimo
  const aggiorna = scriviConta;

  // Una riga che dice a COSA serve, per chi non ha progettato l'app:
  // votare non e' fine a se', riempie «Stasera». Un mazzo solo, una
  // spiegazione sola.
  const perche = el("p", "spiegaMazzo");
  perche.innerHTML =
    "I titoli che hai più probabilità di <b>aver visto</b>: votali e " +
    "«Stasera › Sul mio gusto» impara cosa ti piace. Il 🌙 segna quelli " +
    "<b>calmi</b> per «Per dormire».";
  schermo.appendChild(perche);

  // Un link, discreto, agli scartati: «non per sempre» vuol dire che
  // si devono poter ripescare.
  const zonaScartati = el("div");
  zonaScartati.style.cssText = "padding:0 16px";
  schermo.appendChild(zonaScartati);
  const disegnaScartati = () => {
    zonaScartati.innerHTML = "";
    const n = scartati.tutto.length;
    if (!n) return;
    const b = el("button", "altri", "Non visti: " + n + " · rivedi");
    b.style.cssText = "width:100%;margin:0 0 4px;padding:10px";
    b.onclick = () => schermoScartati();
    zonaScartati.appendChild(b);
  };
  disegnaScartati();

  const zona = el("div", "mazzoCarte");
  schermo.appendChild(zona);

  const attesa = el("div", "caricamento");
  attesa.innerHTML = '<div class="giro"></div>';
  zona.appendChild(attesa);

  // Il mazzo: una carta per volta, come Tinder. Ogni azione avanza al
  // titolo dopo, e quando ne restano pochi ne carico altri in
  // sottofondo, cosi' non ci si ferma mai.
  let inArrivo = false;
  const dopoUnAzione = () => { aggiorna(); disegnaScartati(); prossima(); };

  // Pesca altri titoli da votare finche' non ce ne sono abbastanza di
  // NUOVI (non ancora votati). Una pagina sola puo' essere tutta roba
  // gia' votata se hai votato molto: allora si va avanti, con un tetto.
  const riempi = async () => {
    let giri = 0;
    while (codaDaVotare().length < 4 && giri < 8) {
      const prima = daVotare.length;
      await altroDaVotare();
      giri++;
      if (daVotare.length === prima) break;   // TMDB non da' piu' nuovi
    }
  };

  const prossima = () => {
    if (codaDaVotare().length < 4 && !inArrivo) {
      inArrivo = true;
      riempi().catch(() => {}).then(() => {
        inArrivo = false;
        if (!zona.querySelector(".cartaV")) disegna();
      });
    }
    disegna();
  };

  const disegna = () => {
    zona.innerHTML = "";
    // il mazzo intero: prima la rassegna dei votati (per il 🌙), poi i
    // titoli nuovi da votare
    const coda = codaMazzo();
    if (!coda.length) {
      if (inArrivo) {
        const a = el("div", "caricamento");
        a.innerHTML = '<div class="giro"></div>';
        zona.appendChild(a);
      } else {
        zona.appendChild(el("p", "altri",
          "Per ora è tutto. Torna più tardi."));
      }
      return;
    }
    // la carta dietro, come suggerimento di pila; poi quella davanti
    if (coda[1]) {
      const dietro = el("div", "cartaV dietro");
      dietro.innerHTML = coda[1].locandina
        ? locandina(coda[1].locandina, "w342") : "";
      zona.appendChild(dietro);
    }
    zona.appendChild(cardaPerVotare(coda[0], dopoUnAzione));
  };

  try {
    await riempi();
  } catch (e) {
    // La rete puo' cadere, ma la RASSEGNA NOTTE e' locale (i tuoi voti):
    // deve vedersi lo stesso. Mostro l'errore solo se non c'e' nemmeno
    // quella, se no ingoio un titolo che potevo dare.
    if (!rassegnaNotte().length) {
      zona.innerHTML = "";
      zona.appendChild(el("p", "nota", esc(e.message)));
      return;
    }
  }
  disegna();
}

// UNA CARTA, tipo Tinder. Sotto la locandina: le stelle («l'ho
// visto»), il cuore («lo voglio»), «non visto» (scarta). E si puo'
// trascinare: a sinistra scarta, a destra la mette nel cuore - con
// una mano sola il pollice arriva li'.
function cardaPerVotare(v, avanza) {
  const dati = {
    tipo: v.tipo, id: v.id, titolo: v.titolo, anno: v.anno,
    voto: v.voto, locandina: v.locandina,
    generiId: v.generiId, keyword: v.keyword,
  };

  const c = el("div", "cartaV");
  // Se l'hai GIA' votato, questa e' una carta della «rassegna notte»:
  // rimessa in cima una volta per segnare il 🌙, non per votarla di
  // nuovo. Cambia la legenda e le azioni.
  const giaVotato = visti.voto(v.tipo, v.id) || 0;

  const eti = el("div", "etichettaSwipe");
  c.appendChild(eti);

  const poster = el("button", "posterCarta");
  poster.setAttribute("aria-label", "Apri " + v.titolo);
  poster.innerHTML = (v.locandina
    ? locandina(v.locandina, "w342")
    : '<div class="mancaCarta"></div>') +
    '<div class="sottoCarta"><h3>' + esc(v.titolo) + "</h3><p>" +
    (v.anno || "—") + (v.tipo === "tv" ? " · serie" : "") + "</p></div>";
  poster.onclick = () => schermoDettaglio(v.tipo, v.id, () => vai("lista"));
  c.appendChild(poster);

  // le stelle: «l'ho visto, ecco il voto» -> ai Visti
  const stelle = el("div", "stelle");
  for (let n = 1; n <= 5; n++) {
    const b = el("button");
    if (n <= giaVotato) b.className = "piena";   // mostra il voto che hai gia' dato
    b.setAttribute("aria-label", n + (n === 1 ? " stella" : " stelle"));
    b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.7 6.2.6-4.7 4.2 1.4 6.1L12 16.9l-5.5 3.2 1.4-6.1L3.2 9.8l6.2-.6z"/></svg>';
    b.onclick = () => { votaDalMazzo(dati, n); via("su"); };
    stelle.appendChild(b);
  }
  c.appendChild(stelle);
  // Legenda fissa: sempre visibile, cosi' non si deve indovinare. Sui
  // gia' votati cambia: qui il punto e' il 🌙, non il voto.
  c.appendChild(el("p", "didascStelle", giaVotato
    ? "Già visto — segna 🌙 se è da dormire"
    : "L’ho visto — dai un voto"));

  // Le azioni. Ogni pulsante con l'etichetta sotto: le frecce ← →
  // dicono che si puo' anche TRASCINARE la carta (swipe), non solo
  // toccare.
  const azioni = el("div", "azioniCarta");
  const colonna = (btn, testo) => {
    const col = el("div", "azioneCol");
    col.appendChild(btn);
    col.appendChild(el("span", "didasc", testo));
    return col;
  };
  const luna = '<svg viewBox="0 0 24 24"><path d="M20 13a8 8 0 1 1-9-9 6 6 0 0 0 9 9z"/></svg>';

  if (giaVotato) {
    // GIA' VOTATO (rassegna notte): «non visto» e «lo voglio» non hanno
    // senso, l'hai visto e valutato. Restano 🌙 (e' da dormire: segna e
    // avanti) e «Avanti» (non lo e': salta). Entrambi lo fanno uscire
    // dalla rassegna, cosi' lo vedi una volta sola.
    const notte = el("button", "tondo notte");
    notte.setAttribute("aria-pressed", String(dormire.ha(v.tipo, v.id)));
    notte.setAttribute("aria-label", "È da dormire");
    notte.innerHTML = luna;
    notte.onclick = () => { dormire.aggiungi(dati); via("su"); };

    const avanti = el("button", "tondo");
    avanti.setAttribute("aria-label", "Avanti");
    avanti.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
    avanti.onclick = () => { rassegnati.aggiungi(dati); via("su"); };

    azioni.appendChild(colonna(notte, "è da dormire"));
    azioni.appendChild(colonna(avanti, "avanti →"));
  } else {
    const noVisto = el("button", "tondo salta");
    noVisto.setAttribute("aria-label", "Non l’ho visto");
    noVisto.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    noVisto.onclick = () => { scartati.aggiungi(dati); via("sx"); };

    const notte = el("button", "tondo notte");
    const disNotte = () => notte.setAttribute("aria-pressed",
      String(dormire.ha(v.tipo, v.id)));
    notte.setAttribute("aria-label", "Buono per dormire");
    notte.innerHTML = luna;
    notte.onclick = () => {
      if (dormire.ha(v.tipo, v.id)) dormire.togli(v.tipo, v.id);
      else dormire.aggiungi(dati);
      disNotte();
    };
    disNotte();

    const cuore = el("button", "tondo voglio");
    cuore.setAttribute("aria-label", "Lo voglio vedere");
    cuore.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-9.7A4.3 4.3 0 0112 8.4a4.3 4.3 0 017.5 2.4c0 5.1-7.5 9.7-7.5 9.7z"/></svg>';
    cuore.onclick = () => { lista.aggiungi(dati); via("dx"); };

    azioni.appendChild(colonna(noVisto, "← non visto"));
    azioni.appendChild(colonna(notte, "per dormire"));
    azioni.appendChild(colonna(cuore, "lo voglio →"));
  }
  c.appendChild(azioni);

  // l'uscita: la carta scivola via nella direzione dell'azione, poi
  // avanza. Un attimo, cosi' si vede cosa e' successo.
  let uscita = false;
  const via = (dir) => {
    if (uscita) return;
    uscita = true;
    c.style.transition = "transform .22s ease, opacity .22s ease";
    c.style.transform = dir === "dx" ? "translateX(120%) rotate(8deg)"
      : dir === "sx" ? "translateX(-120%) rotate(-8deg)"
      : "translateY(-30%) scale(.9)";
    c.style.opacity = "0";
    setTimeout(avanza, 200);
  };

  // il trascinamento: segue il dito, e oltre soglia commette.
  let x0 = null, dx = 0;
  c.addEventListener("pointerdown", (e) => {
    if (giaVotato) return;   // sui gia' visti niente swipe: si usa 🌙 / Avanti
    if (e.target.closest && e.target.closest("button")) return;
    x0 = e.clientX; dx = 0;
    c.style.transition = "none";
    try { c.setPointerCapture(e.pointerId); } catch (err) { /* pazienza */ }
  });
  c.addEventListener("pointermove", (e) => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    c.style.transform = "translateX(" + dx + "px) rotate(" + (dx / 22) + "deg)";
    eti.textContent = dx > 40 ? "LO VOGLIO" : dx < -40 ? "NON VISTO" : "";
    eti.className = "etichettaSwipe" +
      (dx > 40 ? " si" : dx < -40 ? " no" : "");
  });
  const rilascia = () => {
    if (x0 === null) return;
    if (dx > 90) { lista.aggiungi(dati); via("dx"); }
    else if (dx < -90) { scartati.aggiungi(dati); via("sx"); }
    else {
      c.style.transition = "transform .18s ease";
      c.style.transform = "";
      eti.textContent = ""; eti.className = "etichettaSwipe";
    }
    x0 = null;
  };
  c.addEventListener("pointerup", rilascia);
  c.addEventListener("pointercancel", rilascia);

  return c;
}

// Rivedere gli scartati e ripescarli: «non visto» non e' per sempre.

  schermo.innerHTML = "";
  const pad = el("div", "pad");
  const su = el("button", "indietro", "← Da votare");
  su.onclick = () => { vistaLista = "votare"; vai("lista"); };
  pad.appendChild(su);
  pad.appendChild(el("h1", "titolone", "Non visti"));
  pad.appendChild(el("p", "nota",
    "Titoli che hai saltato perché non li hai visti. Ripescane uno " +
    "e torna nella coda da votare."));
  schermo.appendChild(pad);

  const zona = el("div");
  zona.style.cssText = "padding:0 16px";
  schermo.appendChild(zona);

  const disegna = () => {
    zona.innerHTML = "";
    const tutti = scartati.tutto;
    if (!tutti.length) {
      zona.appendChild(el("p", "altri", "Nessuno scartato."));
      return;
    }
    tutti.forEach(v => {
      const f = el("div", "fila2");

      loc.innerHTML = v.locandina ? locandina(v.locandina, "w154")
        : '<div class="manca2"></div>';
      loc.onclick = () => schermoDettaglio(v.tipo, v.id, schermoScartati);
      const chi = el("div", "chi");
      chi.innerHTML = "<h3>" + esc(v.titolo || "?") + "</h3>" +
        '<p class="anno2">' + (v.anno || "—") + "</p>";
